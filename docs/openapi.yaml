      operationId: revokeAccountRole
      summary: Revoke a photographer or admin role
      description: |
        `active` to `revoked`, for `photographer` or `admin` (any other role segment is 404 `not_found`; `player` is never
        revoked in this wave). Revoking an admin is refused with 409 `version_conflict` when fewer than two active admins
        exist, so one always remains; revoking yourself is allowed while another admin remains. Audit action `role_revoke`.
        Admin only. The acting admin is re-checked under the role lock, so an admin revoked a moment ago gets 403 and nothing is
        written. Fenced by `revision` (the value the caller read): a different `revision`, or a state the move does not start from,
        is 409 `version_conflict` naming the current state and revision. Every change bumps `revision` and writes one audit row
        (`detail`: role, from and to state and revision, note). Answers 200, not 201. Exempt from the client version gate.
      parameters:
