        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/me/ugs-link:
    put:
      tags: [player]
      operationId: linkUgs
      summary: Link this sign-in to its Unity Gaming Services player
      description: |
        Lets the server mirror this player's progress to Unity Gaming Services (UGS) Cloud Save, where the game
        reads it first (see `UgsMirrorProgress`). Send the UGS player token (`AuthenticationService.Instance.AccessToken`)
        after the game has signed in to UGS with Firebase as the OpenID Connect provider. The server verifies the
        token and then asks UGS which external identity is linked to that UGS player: it must be the Firebase user
        making this request. A client-supplied player id is never accepted and the body cannot name one.

        The mirror is one-way and read-only for the game: the server is the only writer and the game must never write
        progress to UGS. The server stays the authority: prefer `GET /v1/me/progress` whenever the server is
        reachable, and treat the UGS copy as a fallback that can lag the server by minutes: the server writes a player's copy
        at most once per `UGS_MIRROR_MIN_INTERVAL_SEC` (default 5 minutes), except the first write after a link, and under
        load it is also paced by a budget shared across all server instances.

        201 on the first link. 200 when this player was already linked to that UGS player (answered from the
        server's own record with no call to UGS, so calling this on every launch is cheap), or when it was
        re-pointed to a different UGS player (the old copy is deleted by the server; progress is unchanged, but `version` goes up
        by one because the copy target changed). A first link does not change `version`.
        Requires a player (`PUT /v1/me` first). 404 `not_found` means this server has the mirror turned off.

        Any other attempt asks UGS for the link proof and counts against 5 per hour per player (429 `rate_limited`
        with `Retry-After`) and a server-wide proof budget (503 `service_unavailable`, `Retry-After: 5`). If the UGS
        player is still recorded against another sign-in that UGS no longer lists as linked, the link moves to this
        player; that move bumps the caller's `version` (the old holder's is unchanged).
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UgsLinkRequest" }
      responses:
        "200":
          description: Already linked to this UGS player, or re-pointed to it.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UgsLinkResponse" }
        "201":
          description: Linked. A first mirror write is queued.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UgsLinkResponse" }
        "400":
          description: |
            Malformed or unknown body field, or the UGS token is not acceptable (the message says which check failed,
            for example `UGS token rejected: expired.`). 401 stays reserved for the Firebase token.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [invalid_request]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The UGS player is not linked to this Firebase sign-in (`UGS account is not linked to this sign-in`).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [forbidden]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`player_not_found` (call `PUT /v1/me` first) or `not_found` (the mirror is not enabled on this server)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [player_not_found, not_found]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: That UGS player is already linked to another player, and UGS still lists that player's sign-in as linked.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [ugs_link_conflict]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: |
            `auth_unavailable`: the UGS or Firebase signing keys could not be fetched. `service_unavailable`: the
            database, or UGS (needed for the link proof), is unreachable, or the server-wide link-proof budget is
            spent. Retry later with the same request.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          x-error-codes: [auth_unavailable, service_unavailable]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/logbook:
    get:
      tags: [player]
      operationId: getLogbook
      summary: Pilot Logbook
      description: |
        Everything the Unity Logbook, passport and Awards tab show, derived on the server from
        stored Flight Segments (Unity Trips) and Rounds (Unity Flights); there are no client writes behind it
        (contract round 2). Read-only (no lock, no write, nothing is bumped) and safe to call on every Logbook open.
        The whole answer comes from one consistent database snapshot.

        - `recentTrips`: the last 20 completed Flight Segments, newest first (Unity "RECENT FLIGHTS", whose rows are
          Trips, as `RecentFlightsLog` stores them).
        - `daily`: the last played local day, its banked Rounds and the day streak. The app decides "today" with its
          own clock: TODAY = `flightsOnLastPlayedDate` when `lastPlayedDate` is today, else 0; STREAK = `streakDays`
          while `lastPlayedDate` is today or yesterday, else 0 (Unity `DailyFlightLog`).
        - `lifetime`: career totals over completed Flight Segments (Unity `LifetimeTotals`).
        - `counters`: the Field Award counters (Unity `AwardCounters`); they replace the app's local ones.
        - `clipperCards`: every collected Card, commercial and Military.
        - `fieldAwards`: all 28 Field Awards against the catalog version in force, earned or locked, with progress.
          An award no player can reach with today's content is simply locked; nothing is hidden. **`earned` is the stored
          fact, never `current >= target`:** an award earned under an old target stays earned after staff raise the target
          (`earned: true` with `current < target`), and one whose target was lowered reads `earned: false`, `current = target`
          until the player's next completed Trip stores it. `current` is the metric's value capped at the target.
        - `version` is the Logbook's own counter (`logbookVersion`), **not** `Progress.version`: it rises whenever a Round is
          banked or a Trip is completed (the daily log, counters, Cards, awards and recent Trips all move with those), and
          a completion that pays no hint and resets no streak still raises it while `Progress.version` stays put. A catalog
          publish does not change it (it changes `fieldAwards.catalogVersion` and the `ETag`), and abandoning a Trip does not
          (nothing the Logbook shows moves).
        - Every Card the player holds is listed, from the stored row alone, whether or not the `clipper-cards` document names
          it (the document supplies display names to the app; this route never joins it).

        Size: 20 Trip rows, 28 awards, a fixed set of counters, and one record per distinct Clipper Card collected. Cards
        are the only list that grows, and only with content (23 commercial families and one per distinct Military answer,
        50 today, about 8 KB; the `clipper-cards` document caps the set at 5,000, under 1 MB).

        Caching: the `ETag` names the Logbook exactly. It changes when the player's Logbook data changes, when the Field
        Award catalog or the aircraft tags in force change (a publish moves `fieldAwards` without any player write), and
        never otherwise; no field depends on the clock (`daily` is stored data, the app decides what "today" is). Send it
        back as `If-None-Match` and an unchanged Logbook is 304 with no body. `Vary: Authorization` and `Cache-Control: private, no-cache` (store,
        revalidate), an exception to the `/v1` `no-store` rule; errors stay `no-store`. 503 `service_unavailable` (with
        `Retry-After`) means the content documents are not ready yet.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The Logbook.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/PrivateNoCache" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogbookEnvelope" }
        "304":
          description: Unchanged since the `If-None-Match` tag. No body.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/PrivateNoCache" }
            ETag: { $ref: "#/components/headers/ETag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PlayerNotFound" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/rounds:
    post:
      tags: [rounds]
      operationId: startRound
      summary: Issue a Round
      description: |
        BREAKING in 0.4.0 (slice T2): the body is `{ tripId }`, not `{ module }`. Issues the next single-use Round of an
        open Flight Segment (open one with `POST /v1/trips`). Module, rank and Pleasure Cruise come from the segment,
        which snapshotted them at Active Rank when it opened. The Round gets the next flight number (banked + 1, 1-10).
        Issuing a Round while the segment's current Round is still open abandons that Round (its result then fails with
        410 `round_closed`; a spent hint is not refunded) and the new Round takes the SAME flight number: an abandoned
        Round never counts toward the ten. Any other open Round of the player is abandoned too. A Round expires 30
        minutes after issue; issuing also restarts the segment's own 30 minute clock.

        Errors: 404 `trip_not_found` (unknown, another player's, or `tripId` is not a UUID), 409 `trip_full` (all ten
        Rounds are banked: call `POST /v1/trips/{tripId}/complete`), 410 `trip_expired` (30 minutes without activity; the segment is then
        closed and the Perfect Streak is 0) or `trip_closed` (completed or abandoned).
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartRoundInSegmentRequest" }
      responses:
        "201":
          description: Round issued.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoundEnvelope" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`player_not_found`: call `PUT /v1/me` first. `trip_not_found`: not this player's Flight Segment (or unknown, or not a UUID)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [player_not_found, trip_not_found]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: All ten Rounds of the segment are banked; complete it.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [trip_full]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410": { $ref: "#/components/responses/TripGone" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/rounds/{roundId}/result:
    post:
      tags: [rounds]
      operationId: submitRoundResult
      summary: Score and bank a Round
      description: |
        Reports Round facts; the server computes the award. Resubmitting a banked Round returns the stored
        award with `replayed: true` and pays nothing, so a retry after a dropped response is safe.
        A result sooner than 3 s after issue is 429 `round_too_fast` and leaves the Round open: retry
        after `Retry-After`. A `roundId` that is not a UUID is 404 `round_not_found`.

        An `Idempotency-Key` header (the Unity outbox sends one) is accepted and ignored: the Round id already
        makes this call idempotent, so a repeat with any key, or none, is the same replay.

        BREAKING in 0.4.0 (slice T2): the body is `RoundResultWithFlightFactsRequest`: the four Round facts plus the Flight
        facts `aircraftKey`, `answerMs` and `attempts` (ADR-0008 §2), all required and strictly validated. Facts that
        fail the module rules (see the schema; for `identifier` an `aircraftKey` outside the seeded commercial Card
        catalog) are 400 `invalid_request` and bank nothing. The Perfect Streak the award is computed from is the Flight
        Segment's own (D-3): it starts at 0 when the segment opens and is reset when it closes. A banked Round also moves
        the player's day streak (local day = server time of the result + the segment's `utcOffsetMinutes`); every 7th
        consecutive day grants one hint (Unity `HintBank`), returned in `hintGrants` and ledgered as `day_streak_grant`.
        `trip` says where the segment stands after this Round (on a replay: where it stands now). Cards, Field Awards
        and the Trip hint grant are NOT decided here; they are decided once, by `POST /v1/trips/{tripId}/complete`.
        A Round whose own 30 minutes passed stays `round_expired` on every retry, even after its segment was marked
        expired or a newer segment replaced it. `trip_expired` on this route is defensive: it answers a Round that is
        still inside its own window although its segment ran out (the two clocks share a start, so this is not a normal
        outcome), and a retry for a Round abandoned together with an expired segment.

        On a replay, `progress` is current, not identical to the first answer: it is built fresh (current balances,
        `version`, lazily expired Perfect Streak, new `evaluatedAt`), while `award` and the rest are the stored ones.
        Order it against other copies by `(version, evaluatedAt)`.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - name: roundId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: false
          description: Accepted and ignored (the Round id is the idempotency key). Any value, or none.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoundResultWithFlightFactsRequest" }
      responses:
        "200":
          description: Banked, or replayed.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoundResultResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not this player's Round (or unknown, or `roundId` is not a UUID).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [round_not_found]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: |
            `round_expired`: the 30 minute window passed. `round_closed`: a newer Round superseded it, or its segment was
            abandoned. `trip_expired`: defensive only, the Round's segment ran out of time while the Round itself did not.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [round_expired, round_closed, trip_expired]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429":
          description: |
            `rate_limited`: over the request limit. `round_too_fast`: result arrived under 3 s after issue.
            Both carry `Retry-After`.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          x-error-codes: [rate_limited, round_too_fast]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/rounds/{roundId}/hint:
    post:
      tags: [rounds]
      operationId: spendRoundHint
      summary: Spend this Round's hint
      description: |
        The Round's Flight Segment must be open and unexpired (otherwise 410 `round_closed` / `round_expired`).
        Spends one Co-Pilot hint on the player's own open, unexpired Round. A Round allows one hint, so this
        is idempotent: when the Round already has its hint the answer is 200 with `replayed: true` and nothing
        is debited (also after the Round was banked or superseded). A paid hint cannot be hidden: the result
        is scored as used even if the client reports `usedHint: false`. No request body. No hints left is 409
        `insufficient_hints`. A Round that is banked or superseded without a hint is 410 `round_closed`.
        A `roundId` that is not a UUID is 404 `round_not_found`. `progress` is the current balance, also on a
        replay; don't derive deltas from it. A spent hint is final: issuing a new Round abandons this one
        without a refund.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - name: roundId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Hint spent, or already spent for this Round (`replayed`).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HintResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not this player's Round (or unknown, or `roundId` is not a UUID).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [round_not_found]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The player has no hints left.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [insufficient_hints]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: |
            `round_expired`: the 30 minute window passed. `round_closed`: the Round was superseded or already banked.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [round_expired, round_closed]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/trips:
    post:
      tags: [trips]
      operationId: openFlightSegment
      summary: Open a Flight Segment (Unity Trip)
      description: |
        Opens a server-issued Flight Segment of ten Rounds for one module at the player's Active
        Rank (contract round 1: a Trip deals at Active Rank, so a Pleasure Cruise plays that rank). Rank and Pleasure
        Cruise are snapshotted for the whole segment; changing Active Rank mid-segment does not change it.

        One open Flight Segment per player (it replaces the one-open-Round rule as the unit the app works in).
        Opening one abandons the player's open segment and its open Round and starts the new segment's Perfect Streak at
        0 (D-3), so `progress.perfectStreak` is 0 afterwards.

        **A full open segment is completed first.** When the open segment has all ten Rounds banked, opening a newer one
        completes it in the same transaction (its Clipper Cards, Award counters, Field Awards and Trip hint are recorded,
        exactly as `POST /v1/trips/{tripId}/complete` would) and then opens the new segment. The response here carries only
        the new segment; the app reads the completed one's lists by calling `complete` on its `tripId`, which replays the
        stored answer (`replayed: true`). A segment with fewer than ten banked Rounds is abandoned as before.

        When a full segment must be completed and the server's content documents are not seeded yet (a window right after a
        first start), this answers 503 `service_unavailable` with `Retry-After`, and nothing is written: retry the same request.

        `localDate` must be the calendar date of server time plus `utcOffsetMinutes` (within 15 minutes either side,
        so a request that straddles midnight passes); otherwise 422 `local_date_mismatch`. The server records the
        offset and judges every day-based rule itself from its own clock plus that offset (site-day ruling: a rewound
        phone clock cannot earn a second grant). `contentVersion` is the app's bundled pack version; it is recorded,
        and checked against releases only once releases exist.

        Requires an `Idempotency-Key` header (1-128 of `A-Z a-z 0-9 _ -`, U14, 2026-10-29): repeating a key this
        player already used answers 200 with the segment that key opened (and its current state) instead of opening
        another, so a retry after a dropped response never abandons the segment it just opened. Mint a new key per
        new segment. Reusing a key with different `module`, `localDate`, `utcOffsetMinutes` or `contentVersion` is
        422 `idempotency_key_reused`; `flightCount` is always 10. The comparison precedes date freshness, so an
        identical retry still replays after midnight. A segment expires 30 minutes after its last activity (open, Round issue or Round result); see
        `expiresAt`.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenFlightSegmentRequest" }
      responses:
        "200":
          description: Replay of an `Idempotency-Key` already used by this player; the segment it opened, as it stands now.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlightSegmentEnvelope" }
        "201":
          description: Flight Segment opened.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlightSegmentEnvelope" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PlayerNotFound" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "422":
          description: "`local_date_mismatch`: `localDate` does not match server time plus `utcOffsetMinutes`. `idempotency_key_reused`: the key already opened a segment with a different request."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [local_date_mismatch, idempotency_key_reused]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/trips/{tripId}/complete:
    post:
      tags: [trips]
      operationId: completeFlightSegment
      summary: Complete a Flight Segment
      description: |
        Call after the 10th Round is banked. In one player-locked transaction the server derives
        the outcome (all correct or not, hint use, Go Around against the previous completed segment, the Red-Eye
        window), collects Clipper Cards from the correct Rounds, updates the Field Award counters, evaluates all 28
        Field Awards against the catalog in force, and grants the Trip hint (+1 on every 4th completed segment, Unity
        `HintBank`). Field Awards pay no Miles or Status Points. The Rounds were already paid when they were banked.

        The first call answers `replayed: false`. Idempotent: a repeat returns the stored outcome, the same `fieldAwards`,
        `clipperCards` and `hintGrants` (read back from what the first call stored), with `replayed: true`, and pays and
        changes nothing; concurrent calls complete it exactly once. The Perfect Streak returns to 0 and the UGS copy is
        republished at once. `progress` is the current balance, also on a replay. A segment
        with all ten Rounds banked can be completed at any time, even after `expiresAt` (an app outbox may retry
        after a restart). No request body. A `tripId` that is not a UUID is 404 `trip_not_found`. Fewer than ten Rounds
        banked is 409 `trip_incomplete`, except that an open segment past `expiresAt` is 410 `trip_expired` (and is
        marked abandoned); an abandoned segment is 410 `trip_closed`. If the content documents the Field Awards are judged
        against are not seeded yet (a window right after a first start), this answers 503 `service_unavailable` with
        `Retry-After` and writes nothing: retry the same request.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: Completed, or already completed (`replayed`).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlightSegmentCompletion" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/TripNotFound" }
        "409":
          description: Fewer than ten Rounds of this segment are banked.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [trip_incomplete]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410": { $ref: "#/components/responses/TripGone" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/trips/{tripId}/abandon:
    post:
      tags: [trips]
      operationId: abandonFlightSegment
      summary: Abandon a Flight Segment
      description: |
        Closes the player's open segment without completing it (the player quit to the menu,
        signed out, or the app is about to open another module). Its open Round is abandoned. Rounds already banked
        keep their Miles and Status Points and still count for the day streak, but an abandoned segment collects no
        Clipper Cards, moves no Field Award counter, earns no Field Award and no Trip hint, and is not a "previous
        Trip" for Go Around. The Perfect Streak returns to 0.

        Optional for the app: opening the next segment has the same effect. Idempotent: abandoning an abandoned or
        expired segment is 200 with `replayed: true`. A segment with all ten Rounds banked cannot be abandoned (409
        `trip_full`: complete it); a completed one is 410 `trip_closed`. No request body.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: Abandoned, or already closed without completing (`replayed`).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlightSegmentAbandoned" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/TripNotFound" }
        "409":
          description: All ten Rounds are banked; complete the segment instead.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [trip_full]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: "`trip_closed`: the segment was completed."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [trip_closed]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/content/manifest:
    get:
      tags: [content]
      operationId: getContentManifest
      summary: Content manifest
      description: |
        What content the server currently publishes, pulled by Unity's existing
        `HttpContentManifestService` (contract round 1: admin updates reach the app by pull manifest; UGS Remote
        Config stays the kill switch and a pointer only). Compatible with Unity's `ApiWireModels.ManifestWire`:
        `version`, `generatedAtUtc` and `modules[] { id, enabled, contentVersion, assetBundleUrl }` keep their names
        and types. Additive: `documents[]`, which today's client ignores.

        - `version` is `m-` and 16 hex characters: a hash of the listed (name, version, sha256) triples and the module
          entries, so it is the same on every server instance and across restarts, and it changes whenever any listed
          document or module entry changes; the app caches it
          (`LocalContentManifestCache.SaveVersion`) and refetches only the documents whose `version` moved.
        - `modules` lists all eight modules with `enabled: true`. The backend never disables a module: Remote Config
          is the kill switch. `contentVersion` and `assetBundleUrl` stay null until content releases exist (5.2+);
          the app keeps playing its bundled packs.
        - `generatedAtUtc` is when the manifest last changed (the newest `createdAt` of the listed documents, database
          clock), not the time of the request, so equal versions are byte-identical.
        - `documents` lists the version IN FORCE of each document: the highest version whose body is valid and whose bytes match
          its digest (the same selection the server judges Field Awards against), so everything listed can be fetched. `clipper-cards` is absent until the first
          Military content exists (a fresh database), then it is listed from version 1.
        - `documents` point at immutable, versioned JSON documents (`GET /v1/content/documents/{name}/{version}`):
          the Field Award catalog, the Clipper Card catalog and the aircraft tags.

        Caching: `ETag` is the quoted `version`; send it back as `If-None-Match` and an unchanged manifest is 304 with
        no body. `Cache-Control: no-cache` (store, but revalidate), an exception to the `/v1` `no-store` rule.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The manifest.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoCache" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentManifest" }
        "304":
          description: Unchanged since the `If-None-Match` version. No body.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoCache" }
            ETag: { $ref: "#/components/headers/ETag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/content/documents/{name}/{version}:
    get:
      tags: [content]
      operationId: getContentDocument
      summary: One versioned content document
      description: |
        An immutable published version of one data document. Take the URL from the manifest.
        The bytes of a `(name, version)` never change, so the response may be cached for good: `Cache-Control:
        private, max-age=31536000, immutable`, and `ETag` is the quoted `sha256` the manifest lists (check it).
        Every version the manifest has ever listed stays fetchable. Unknown name or version is 404 `not_found` (so is a
        version that is not a positive integer written without leading zeros).

        The bytes are the document's canonical JSON, defined once: UTF-8 without a byte order mark, no whitespace between
        tokens and no trailing newline, object keys sorted by UTF-16 code unit at every depth, array order kept, numbers
        are integers, strings escaped as `JSON.stringify` does. Their SHA-256 is the `sha256` in the manifest and in the
        `ETag`, their length is `byteSize`. Clients should verify both against the manifest.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: name
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ContentDocumentName" }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The document.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/Immutable" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/FieldAwardCatalogDocument" }
                  - { $ref: "#/components/schemas/ClipperCardCatalogDocument" }
                  - { $ref: "#/components/schemas/AircraftTagDocument" }
        "304":
          description: Matches `If-None-Match`. No body.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/Immutable" }
            ETag: { $ref: "#/components/headers/ETag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UnknownRoute" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/shop/miles-hint-pack:
    post:
      tags: [shop]
      operationId: buyMilesHintPack
      summary: Buy the hint pack with Miles
      description: |
        Spends 5,000 Miles for 10 hints (client ruling CF-53). Requires an `Idempotency-Key` header (1-128
        characters of letters, digits, `_` and `-`); a missing or malformed key is 400 `invalid_request`.
        The first request with a key buys the pack; any later request with the same key returns the original
        receipt with `replayed: true` and charges nothing, so a retry after a dropped response is safe. A new
        key is a new purchase. Not enough Miles is 409 `insufficient_miles` and records nothing, so the same
        key can buy later: mint a new key per purchase attempt. `progress` is the current balance, also on a
        replay. No request body (an empty object is accepted; any field is 400).
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
      responses:
        "200":
          description: Purchased, or already purchased under this key (`replayed`).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PlayerNotFound" }
        "409":
          description: Fewer than 5,000 Miles.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [insufficient_miles]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  # ---------------------------------------------------------------------------------------------------------
  # Purchases (Phase 4, wave P; docs/plans/purchases.md, docs/briefs/commerce.md). Built in 0.20.0, except the two store-notification
  # webhooks (wave P4), which stay x-planned and answer 404 `not_found`.
  # ---------------------------------------------------------------------------------------------------------

  /v1/purchases:
    post:
      tags: [purchases]
      operationId: submitStorePurchase
      summary: Submit a store purchase for verification and grant
      description: |
        Signed-in player (a player row must exist: 404 `player_not_found` before `PUT /v1/me`). The app sends the store's
        reference of a purchase it holds; the server verifies it with the store itself (a client claim is never trusted), then grants
        exactly once. The reference is the idempotency key: the same `(store, transactionId | purchaseToken)` never grants twice, for any
        player. An `Idempotency-Key` header is accepted and ignored. Strict body, one of two shapes (below). The server computes the
        grant from its own catalog (`GET /v1/store/products`); the body never says what to grant. A hint pack adds its hints; a First
        Class Pass extends `firstClassUntil` (the store's expiry is authoritative) and turns the +50% on.

        **Every answer tells the client what to do with the store transaction: finish it, or keep it pending and resend later.**

        | Answer | Client action |
        |---|---|
        | 200 `status: granted` (new, or `replayed: true`) | finish the store transaction (consume consumables) |
        | 200 `status: pending` (valid store purchase, product not in the catalog or not sellable here; nothing written) | keep pending, resend later |
        | 503 `store_unavailable` + `Retry-After` (store transient, or no verifier configured; nothing written) | keep pending, resend |
        | 409 `purchase_owned_by_other` | finish (it belongs to another account) |
        | 422 `purchase_invalid` (the store says invalid), `purchase_revoked` | finish; nothing granted |

        Ownership: the store carries the buyer's `commerceToken` (`GET /v1/me/entitlements`) as Apple `appAccountToken` or Google
        `obfuscatedExternalAccountId`. A token that is present and is not the caller's is 409 `purchase_owned_by_other`. A purchase with no
        account token is owned by the first verified caller, set once; any later caller of the same purchase is 409. Account deletion is final
        (user ruling R4): the old receipt answers 409 for a new account, with or without an account token, because the server remembers
        every store reference it has granted (the reference only, no personal data) so it can never be granted twice.

        A replay (same reference, same player) is 200 `status: granted`, `replayed: true`, the recorded grant and the current `progress`;
        nothing is granted or billed again and `progress.version` does not move. A retired product still grants; a demo product is never
        sold in production (`pending` there). `progress` is the player's current balance in every 200 answer.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - name: Idempotency-Key
          in: header
          required: false
          description: Accepted and ignored. The store reference is the idempotency key.
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorePurchaseRequest" }
      responses:
        "200":
          description: |
            `granted`: the purchase is recorded (finish the store transaction); `replayed` is true when it had been granted before.
            `pending`: the store says the purchase is valid but this server will not grant it yet (the product is not in the catalog,
            or is a demo product in production, or the catalog marks it a First Class Pass while the store's transaction has no subscription expiry:
            a staff catalog mistake, logged server-side); nothing was written, `storePurchase` is null: keep the store transaction pending and resend later.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorePurchaseResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PlayerNotFound" }
        "409":
          description: |
            `purchase_owned_by_other`: the purchase belongs to another account (its account token is not yours, or another player
            claimed the reference first). Nothing was written. Finish the store transaction; do not resend.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [purchase_owned_by_other]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "422":
          description: |
            `purchase_invalid`: the store says the reference is not a valid purchase of this product (or `productId` differs from
            the store's). `purchase_revoked`: the store refunded or revoked it. Nothing was granted. Finish the store transaction; do not resend.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [purchase_invalid, purchase_revoked]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: |
            `store_unavailable`: the store could not be asked (a transient store failure), or no store verifier is configured on this
            server. Nothing was written. Keep the store transaction pending and resend after `Retry-After` seconds. The other 503 codes
            (`auth_unavailable`, `service_unavailable`) mean the same.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          x-error-codes: [store_unavailable, auth_unavailable, service_unavailable]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/entitlements:
    get:
      tags: [purchases]
      operationId: getEntitlements
      summary: The caller's First Class Pass state and commerce token
      description: |
        Signed-in player (404 `player_not_found` before `PUT /v1/me`). `commerceToken` is the opaque per-player UUID the app
        hands to the stores as Apple `appAccountToken` (the UUID) and, as 32 hex digits without hyphens, as Google
        `obfuscatedExternalAccountId` (and later the ad network's user id). It is random, created on the first read (every later read
        returns the same value), and never derived from the Firebase uid. `firstClassPass` is true while `firstClassUntil` is in the
        future on the database clock (`evaluatedAt`, the same instant `Progress` uses); `productId` is the product of the subscription
        that sets `firstClassUntil` (null without a Pass). Reads do not bump `progress.version`.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
      responses:
        "200":
          description: The caller's entitlements.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entitlements" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PlayerNotFound" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/store/products:
    get:
      tags: [store]
      operationId: listStoreProducts
      summary: The products on offer
      description: |
        Any signed-in caller. Lists the `active` catalog products, in a stable order, except demo products in production.
        Per product: `productId` (the id in the App Store and Google Play), `kind`, and `hints` (hint packs) or `passPeriod` (Passes).
        There is no title and no price: the app shows its own copy and the store's localized price. Retired products are not listed
        but a purchase of one is still honoured.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
      responses:
        "200":
          description: The listed products (possibly none).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreProductList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/store/products:
    get:
      tags: [store, admin]
      operationId: listAdminStoreProducts
      summary: Every catalog product, with staff fields
      description: |
        Admin only. All products in any status, with `title` (a staff label, never shown to players), `demo`, `status` and the
        `version` the edit routes check. Exempt from the client version gate.
      responses:
        "200":
          description: Every product.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStoreProductList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/store/products/{productId}:
    put:
      tags: [store, admin]
      operationId: putAdminStoreProduct
      summary: Create or edit a catalog product
      description: |
        Admin only. Strict body `{ version?, kind, title, hints?, passPeriod?, demo }`. Without `version` this creates the
        product (201); if the id already exists it is 409 `version_conflict`. With `version` it edits (200): a stale version is 409
        `version_conflict`, nothing written. `kind` and `demo` cannot change on an existing product (422 `content_invalid`), and creating
        `demo: true` in production is 422 `content_invalid`. A hint pack needs `hints` (1 to 1000) and no `passPeriod`; a First Class
        Pass needs `passPeriod` and no `hints` (else 422 `content_invalid`). A change bumps `version` and writes one `store_product_create`
        or `store_product_edit` audit row (principal from the token); sending the stored values back is a 200 with no change. Edits never
        change past grants (each grant is snapshotted). The id must match `^[a-z0-9][a-z0-9._]{0,99}$` (else 400).
      parameters:
        - $ref: "#/components/parameters/StoreProductIdPath"
      requestBody:
        required: true
        content:
          application/json:
