            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentItemList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownRoute" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/content/{module}/items/{id}:
    patch:
      tags: [admin]
      operationId: editContentItem
      summary: Edit a content item in place
      description: |
        Admin only. Changes an item's `rank` and/or its whole `data` payload (a replacement, not a merge: send every
        field). Optimistic: `version` must equal the item's stored version, else 409 `version_conflict` and nothing
        changes. The payload is checked by the module's own rules, the same function the sheet import uses (Military:
        `{ answer, wrong[3], sourceFile, photographer }`, text trimmed, answer and the three wrong answers present,
        all four different after ignoring case and spacing, no other keys), and the file name (`sourceFile`) must stay
        non-blank and unique in the module, retired items included: otherwise 422 `import_invalid` with the reasons in
        `message`. On a change the version goes up by one, `source` becomes `admin`, and one append-only audit row
        (`content_edit`) records the actor and the field-level `diff`. Sending the stored values (or only `version`) is
        200 `changed: false`: no bump, no audit row. A retired item stays retired when edited (a restore or a client
        sheet that lists it again returns it to `approved`). The Clipper Card key (`card_key`) is frozen when the item
        is first imported, or, for a Military item stored before the key existed (`card_key` null), when the first
        Round or Card catalog needs it. An edit never moves it: for such an older item the edit freezes the key from
        the answer as stored before the edit, in the same update.

        Runs in one transaction under the same per-module lock the import apply takes.
      parameters:
        - $ref: "#/components/parameters/ContentModule"
        - $ref: "#/components/parameters/ContentItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentItemEditRequest" }
      responses:
        "200":
          description: "The item as it is now. `changed: false` means nothing was written (no version bump, no audit row)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentItemChange" }
        "400":
          description: Unknown field, a missing or non-integer `version`, an unknown `rank`, or `data` that is not an object.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [invalid_request]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownRoute" }
        "409":
          description: |
            `version_conflict`: `version` is not the item's stored version (someone else changed it); nothing was
            written, reload and decide again. `import_in_progress`: an import or another edit holds the module's write
            lock right now; nothing was written, retry after `Retry-After` seconds (that response only).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          x-error-codes: [version_conflict, import_in_progress]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            The payload breaks a module rule, or the file name would be blank or already used in the module. Nothing was changed.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [import_invalid]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/content/{module}/items/{id}/retire:
    post:
