            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: object
                  required: [data, messageId]
                  properties:
                    data: { type: string, maxLength: 65536, description: Base64 of the notification JSON. }
                    messageId: { type: string, maxLength: 128 }
                subscription: { type: string, maxLength: 256 }
      responses:
        "200":
          description: Accepted (or ignored as a duplicate or unknown event). Empty object.
          headers:
