  /v1/store/notifications/apple:
    post:
      tags: [store]
      x-planned: true
      x-planned-note: Purchases plan wave P4 (docs/plans/purchases.md, "Next waves"). Not built, not scheduled; answers 404 not_found today.
      operationId: receiveAppleStoreNotification
      summary: Apple App Store Server Notification v2 (webhook)
      description: |
        PLANNED (wave P4). Called by Apple, not the app: no Firebase token, exempt from the client version gate and the per-IP rate limit.
        The body is Apple's `{ signedPayload }`; the server verifies the JWS itself, de-duplicates by `notificationUUID` and re-fetches the
        transaction before acting. A non-2xx answer on a transient failure makes Apple retry.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedPayload]
              properties:
                signedPayload: { type: string, maxLength: 65536 }
      responses:
        "200":
          description: Accepted (or ignored as a duplicate or unknown event). Empty object.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { type: object, additionalProperties: false }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503":
          description: Transient failure; Apple retries.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          x-error-codes: [service_unavailable]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/store/notifications/google:
    post:
      tags: [store]
      x-planned: true
      x-planned-note: Purchases plan wave P4 (docs/plans/purchases.md, "Next waves"). Not built, not scheduled; answers 404 not_found today.
      operationId: receiveGoogleStoreNotification
      summary: Google Play real-time developer notification (Pub/Sub push webhook)
      description: |
        PLANNED (wave P4). Called by Google Cloud Pub/Sub, not the app: no Firebase token (the server verifies the push's OIDC JWT:
        issuer, audience, service account, verified email), exempt from the client version gate and the per-IP rate limit. De-duplicated
        by `messageId`; the server always re-fetches the purchase from the Play API before acting. A non-2xx answer on a transient failure
