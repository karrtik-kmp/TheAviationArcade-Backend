  /v1/admin/me:
    get:
      tags: [admin]
      operationId: getAdminMe
      summary: Am I an admin?
      description: |
        Admin only. Lets the website check access: 200 `{ principal, staff: true, roles }` for an active `admin` with a
        verified email, 403 `forbidden` for any other signed-in caller (a photographer included). `staff` is kept for
        existing callers and is always `true`; `roles` lists every ACTIVE role of the caller (`player`, `photographer`,
        `admin`, in that order). An admin needs no player row. Exempt from the client version gate.
      responses:
        "200":
          description: The caller is an active admin.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
