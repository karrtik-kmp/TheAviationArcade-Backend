  /v1/admin/content/documents:
    get:
      tags: [admin]
      operationId: listContentDocumentDrafts
      summary: Every published document with its draft state
      description: |
        Admin only (slice T6, design 8). One entry per document (`field-awards`, `clipper-cards`, `aircraft-tags`): the
        version players are served (`publishedVersion`, null for `clipper-cards` before it was first sealed), the draft
        revision (`draftVersion`, 0 = no draft yet), whether a publish would change anything and the pending edits.
        Nothing here is visible to players until it is published.
      responses:
        "200":
          description: The three documents.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentDraftList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownRoute" }
        "422": { $ref: "#/components/responses/InvalidDraft" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/content/documents/field-awards/imports:
    post:
      tags: [admin]
      operationId: importFieldAwards
      summary: Re-import a later Field Awards sheet into the draft
      description: |
        Admin only. The body is the client's updated Field Awards sheet, raw `.xlsx` (Content-Type
        `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`, at most 5 MB; the same unpack and cell-reference guards
        as the content import). The first worksheet is read; its header is `Field Award`, `Current criteria`, `Threshold`.
        The result is **edits in the `field-awards` draft**, not a new version: nothing reaches players until staff publish it with
        `POST /v1/admin/content/documents/field-awards/publish`.

        Each row is matched to an award by its name (case-insensitive; the sheet has no id, and ten of the 28 Unity code ids differ from
        the sheet's own naming, so the catalog title, the title in force and the draft title all count). `title` and `criteria` are the
        cells, trimmed and otherwise verbatim. `target` is read from the Threshold cell only when that cell differs from the Threshold
        cell of the version in force, and a cell that reads as one whole number of at least 1 ("100,000 Miles" is 100000) updates it; a cell
        that is unchanged keeps the target as it is. A changed cell that cannot be read as one whole-number target ("15 Boeing + 15
        Airbus", "Many Trips") is not an error: the new cell is written, the target stays, the award carries `targetNeedsRuling: true`
        in the plan and a `warnings` entry names the row; staff then rule the target with `PATCH .../draft`, which sticks. The sheet has no `hidden` column, so `hidden` is never touched. The plan is the diff
        against the preview (the version in force with the draft overlay on top): a field the sheet shows differently from the
        preview is a change, whoever made the earlier edit. An import never adds, renames away or removes an award.

        Errors, all in one 422 `import_invalid` with a `report` (row 0 = the whole file), and nothing is written: a row that is not an
        award we have, an award missing from the sheet, an award listed twice, a
        title or criteria over the draft limits, a missing cell, and a result that the document validators (the checks of a publish)
        refuse.

        `dryRun=true` returns the plan (200) and writes and stores nothing. A plan that changes anything must be applied with
        `confirm=<planHash>` from a dry run of the same sheet: without it 422 `import_invalid` (do a dry run first); if the draft
        or the version in force changed since the dry run (an edit, a discard, a publish, another import) it is 409 `plan_changed` and
        nothing is written. Applying stores the original file in file storage (content-addressed by sha256, kept) and writes the edits
        through the same path as `PATCH .../draft`: under the per-document lock, draft revision + 1, and a `history` entry with the
        principal, `action: import` and the file's `fileSha256` (copied into the publish audit row). A sheet that changes nothing
        answers 200 `applied: false` and writes and stores nothing.
      parameters:
        - name: dryRun
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"], default: "false" }
        - name: confirm
          in: query
          required: false
          description: The `planHash` of a dry run of the same sheet. Required to apply a plan that changes anything; not accepted together with `dryRun=true`.
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
        - name: X-File-Name
          in: header
          required: false
          description: Original file name for the receipt. Sanitised and cut to 200 characters; never used as a path.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: "A dry-run plan, or an apply of a sheet that changes nothing (`applied: false`)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/FieldAwardsImportDryRun" }
                  - { $ref: "#/components/schemas/FieldAwardsImportApplied" }
        "201":
          description: The changes were written to the draft.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldAwardsImportApplied" }
        "400":
          description: |
            Not an `.xlsx` (wrong content type, unreadable, no `Field Award` / `Current criteria` / `Threshold` header), a bad `dryRun`
            or `confirm`, or too large once unpacked or too many rows or columns.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [invalid_request]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            `plan_changed`: the `confirm` hash no longer matches the plan, because the draft or the version in force changed since the
            dry run. Nothing was written; run a new dry run.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [plan_changed]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Upload over 5 MB.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [invalid_request]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            The sheet has at least one error (with a `report`), or a plan that changes something was applied without `confirm` (no report;
            do a dry run first), or the stored draft does not validate (`content_invalid`; discard it). Nothing was written. Also
            returned by `dryRun`.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [import_invalid, content_invalid]
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ImportInvalid" }
                  - { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: |
            `storage_unavailable`: file storage is down, not configured, or refused the upload (nothing written). Also `auth_unavailable`
            and `service_unavailable` (content not ready, or the lock timed out). All carry `Retry-After` except a storage refusal a retry
            will not fix.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          x-error-codes: [auth_unavailable, service_unavailable, storage_unavailable]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/admin/content/documents/{name}/draft:
    get:
      tags: [admin]
      operationId: getContentDocumentDraft
      summary: The draft of one document
      description: |
        Admin only. The pending edits and `body`, the document a publish would write now (the version in force with the
        edits applied, as `publishedVersion + 1`; for `clipper-cards` rebuilt from the approved Military content as it stands
        now, so it also shows Cards that were added or retired since the last publish). A preview: players are not served it.
      parameters:
        - $ref: "#/components/parameters/ContentDocumentNamePath"
      responses:
        "200":
          description: The draft and the preview.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentDraftDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownRoute" }
        "422": { $ref: "#/components/responses/InvalidDraft" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      tags: [admin]
      operationId: editContentDocumentDraft
      summary: Edit the draft of one document
      description: |
        Admin only. Merges edits into the draft as the next draft revision; nothing is published and players see nothing.
        `draftVersion` is the revision you read: when it is not the current one the answer is 409 `version_conflict` and
        nothing changes (an edit never overwrites another editor's). The body depends on the document, all strict (any other
        field, including `id` and `metric`, is 400):

        - `field-awards`: `awards`: up to 28 (the 28 ids, each once) `{ id, title?, criteria?, target?, hidden? }`, at least one of the four per
          award, each id once. `title` is 1 to 200 characters, `criteria` 1 to 2000 (both trimmed), `target` an integer from 1
          to 1,000,000,000. The id, the metric, the sheet row, the threshold cell and the rulings cannot be edited.
        - `clipper-cards`: `names`: up to 25 `{ key, name }`, `name` 1 to 500 characters. `key` must be a Card of the
          catalog (a commercial family, or a Military Card derived from the approved content), else 422 `content_invalid`.
          Which Cards exist is not edited here: it follows the content (see publish).
        - `aircraft-tags`: `entries`: up to 25 `{ cardKey, tags }`, the Card's whole tag list (each tag once; an empty list
          clears it). The Card must have an entry or be a Card of the catalog, else 422. A tag already on the entry keeps its
          `source`; a tag staff add is `provisional`. A new entry has no manufacturer.

        Removing a tag the client supplied (source `client_sheet` or `client_ruling`) needs `acknowledgeClientTagRemoval: true` on that
        entry, else 422 `content_invalid`; the change then carries `removedClientTags`. Text may not contain U+0000 or an unpaired
        surrogate. The global 16 KB body limit applies, so a request near the item caps can be answered 413 before validation.
      parameters:
        - $ref: "#/components/parameters/ContentDocumentNamePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: "#/components/schemas/FieldAwardsDraftEdit" }
                - { $ref: "#/components/schemas/ClipperCardsDraftEdit" }
                - { $ref: "#/components/schemas/AircraftTagsDraftEdit" }
      responses:
        "200":
          description: The draft after the edit (without `body`; read the draft for the preview).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentDraft" }
        "400":
          description: A body that does not match the document's edit shape, an invalid value (target below 1 or not an integer, empty or over-long text), a repeated id, key or tag, or an unknown field.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [invalid_request]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownRoute" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/InvalidDraft" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/content/documents/{name}/draft/discard:
    post:
      tags: [admin]
      operationId: discardContentDocumentDraft
      summary: Throw away the pending edits
      description: |
        Admin only. Clears the draft (revision + 1), version checked like an edit; also the way out of a stored draft that no
        longer validates (422 `content_invalid`). With no draft yet (`draftVersion` 0) nothing is written. Answers 200.
      parameters:
        - $ref: "#/components/parameters/ContentDocumentNamePath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentDraftVersion" }
      responses:
        "200":
          description: The draft after the discard.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentDraft" }
        "400":
          description: Not `{ draftVersion }` with a non-negative integer.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [invalid_request]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownRoute" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/content/documents/{name}/publish:
    post:
      tags: [admin]
      operationId: publishContentDocument
      summary: Publish the draft as the next document version
      description: |
        Admin only. In one transaction: writes the draft as the next immutable version of the document
        (`content_documents`, version = highest stored + 1, `created_by` = the verified staff principal), writes exactly one
        audit row (`content_publish`: actor, document, versions, digest, the draft revision, the note, every editor and the edit and discard
        history since the last publish, and the list of changes cut at 200) and resets the draft (revision + 1). Players then see it with no write to any player: the manifest `version`
        and the document entry change, a manifest request with the old `If-None-Match` misses, completions record the new
        `catalogVersion`, and the Logbook `ETag` changes. Earned Field Awards never un-earn when a target rises, and a
        completion that happened under an older version replays unchanged.

        `clipper-cards` is always rebuilt from the approved Military content as it is at publish time (names: the draft's, else
        the published Card's, else the content's), so publishing it is how a version sealed from a small or trial set catches up
        and how Cards of newly approved or retired items appear or go.

        Refusals, with nothing written: 409 `version_conflict` (`draftVersion` is not the current revision, or the version
        was just written by someone else; a retry of a publish that succeeded is this too), 409 `nothing_to_publish` (the
        document would equal the one in force, or there is no approved Military content to seal `clipper-cards` yet), 422
        `content_invalid` when the publish would remove a Card of `clipper-cards` and the body lacks `acknowledgeCardRemoval: true` (Cards
        players already hold stay in their Logbooks), when a staged tag edit removes a client tag without its acknowledgement, and when the document would not validate: each of the 28 Field Award ids exactly once, each award's metric
        its own, integer targets of at least 1, unique Card keys; or the stored draft is invalid.
      parameters:
        - $ref: "#/components/parameters/ContentDocumentNamePath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentPublishRequest" }
      responses:
        "201":
          description: Published.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentPublishResult" }
        "400":
          description: Not `{ draftVersion, note? }` (`note` is 1 to 300 characters).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [invalid_request]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownRoute" }
        "409":
          description: |
            `version_conflict`: the draft changed since you read it, or the version was written concurrently. `nothing_to_publish`:
            the draft equals the version in force (or `clipper-cards` has no approved Military content to seal). Nothing was written.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [version_conflict, nothing_to_publish]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/InvalidDraft" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  # ---------------------------------------------------------------------------------------------------------
  # Media pipeline (plan docs/plans/media-pipeline.md). All built: POST /v1/admin/media (0.14.0); PATCH
  # /v1/admin/media/{mediaId}, POST .../versions, .../publish and .../withdraw (0.15.0); GET /v1/admin/media,
  # GET /v1/admin/media/{mediaId}, PUT /v1/admin/content/{module}/items/{id}/media and GET /v1/media (0.16.0).
  # ---------------------------------------------------------------------------------------------------------

  /v1/admin/media:
    post:
      tags: [media, admin]
      operationId: uploadMedia
      summary: Upload a new image
      description: |
        Needs an ACTIVE `photographer` role (an `admin` also qualifies) and a verified email; 403 `forbidden` otherwise. The
        body is the raw image (Content-Type `image/jpeg` or `image/png`, at most 5 MB), not JSON. The 5 MB limit applies only after the
        token and the role are verified; another Content-Type is 415, a larger body 413 (both `invalid_request`).

        The server sniffs the bytes itself (JPEG or PNG signature and dimensions, at most 4096 px a side), hashes them, stores the file
        under its digest, reads it back and compares, then in one transaction records the item (`unverified`, `revision` 1, version 1,
        owner = the verified caller) and one audit row. A bad image is 422 `media_invalid`. The licence starts empty (fill it with
        `PATCH`), with `creditRequired` `true` until staff change it; nothing reaches players until an admin publishes.

        Requires an `X-Rights-Statement` header (`v1_own` or `v1_authorised`; 400 otherwise, checked before the key lookup).

        Requires an `Idempotency-Key`, looked up FIRST (this route has no `revision` fence). A replay needs the same operation (create,
        not a version upload), the same sha256 and the same `X-Rights-Statement`: it answers 200 with the item as stored now (current state; nothing new is written).
        Anything else with that key (another operation, another `mediaId`, other bytes, another statement) is 422 `idempotency_key_reused`. Two callers
        may use the same key independently. Counts against the rate limit before the body is read. Exempt from the client version gate.
      parameters:
        - $ref: "#/components/parameters/MediaIdempotencyKey"
        - $ref: "#/components/parameters/MediaRightsStatementHeader"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary, maxLength: 5242880 }
          image/png:
            schema: { type: string, format: binary, maxLength: 5242880 }
      responses:
        "200":
          description: Replay of an `Idempotency-Key` this caller already used with the same bytes; the item as it stands now.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItem" }
        "201":
          description: Item created.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItem" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/MediaBodyTooLarge" }
        "415": { $ref: "#/components/responses/MediaUnsupportedType" }
        "422": { $ref: "#/components/responses/MediaUploadRefused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/MediaStorageUnavailable" }
    get:
      tags: [media, admin]
      operationId: listMedia
      summary: List media items
      description: |
        Needs an ACTIVE `photographer` role (an `admin` also qualifies). A photographer sees only their own items; an admin
        sees all (and the `owner` field). Newest first. `state` filters. `limit` is 1 to 100 (default 50). `nextCursor` is opaque; pass
        it back as `cursor` for the next page, `null` on the last. A malformed cursor, one made under another `state`, or one that is too long, is 400
        `invalid_request`, as is any other query parameter, a repeated one or a malformed value. `pending=true` lists only
        `published` items whose draft version is ahead of the published version (an edit or new file waiting for an admin to
        publish); it may be combined with `state=published` or no `state`, and with any other `state` it is 400. Only the literal
        `true` is accepted. A cursor made under `pending=true` is 400 without it (and the reverse, including under
        `state=published`). Pages are ordered by item id, so
        uploads made while paging never move or repeat an item. Exempt from the client version gate.
      parameters:
        - name: state
          in: query
          required: false
          schema: { $ref: "#/components/schemas/MediaState" }
        - name: pending
          in: query
          required: false
          description: Only the literal `true`. Published items whose draft is ahead of the published version. With a `state` other than `published`, 400.
          schema: { type: string, enum: ["true"] }
        - name: cursor
          in: query
          required: false
          description: Opaque; pass back a `nextCursor` with the same `state` / `pending` filter. A malformed cursor or another filter's is 400. It is not a secret and grants nothing (visibility is checked on every page).
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: A page of items.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/media/{mediaId}:
    get:
      tags: [media, admin]
      operationId: getMedia
      summary: One media item with its version history
      description: |
        Needs an ACTIVE `photographer` role (an `admin` also qualifies). A photographer reads only their own items; for another's
        item (or an unknown id) the answer is 404 `not_found`. Returns the item, every version with its licence, and a `preview`
        `ImageRef` for the draft version, signed in any state. The link expires 24 hours after the database time of the request; with
        no CDN host and key configured (a local run) `preview.url` and `expiresAt` are null and `reason` is `cdn_not_configured`.
        No query parameters. Exempt from the client version gate.
      parameters:
        - $ref: "#/components/parameters/MediaIdPath"
      responses:
        "200":
          description: The item.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaDetail" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/MediaNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      tags: [media, admin]
      operationId: editMedia
      summary: Edit the draft version's licence and description
      description: |
        Needs an ACTIVE `photographer` role (an `admin` also qualifies); a photographer edits only their own items (others
        are 404 `not_found`), an admin may edit any. Allowed in every state, including `withdrawn`. Strict body
        `{ revision, licence?, description?, note? }` with at least ONE of `licence` and `description` (a body with only `revision`,
        or `revision` and `note`, is 400); inside `licence`, an absent key keeps the stored value and `null` clears it. `description`
        is a string (trimmed, CRLF becomes LF, 1 to 2000 code points, newlines allowed, every other control character is 400) or
        `null` to clear it; it is staff-only and never in `ImageRef`, `GET /v1/media` or `GET /v1/public/media`. A description edit
        follows the same new-version rule as a licence edit and is part of the change detection, the no-op check and the audit
        `changes`. A new version copies the draft's rights statement; an edit never changes a statement. `note` goes to the audit row only.

        The edit always targets the DRAFT version. When `draftVersion` equals `publishedVersion` (no newer upload), the edit creates a
        NEW draft version: the same file (sha256, type, size, dimensions), `version` + 1 and the edited licence; `draftVersion`
        advances while `publishedVersion` and its frozen licence and credit stay live until an admin publishes. When `draftVersion`
        is greater than `publishedVersion` (or nothing is published), that draft version is edited in place, except that a draft
        which was live once before (an item that was withdrawn) is never rewritten: its licence is frozen history, so the edit
        creates a new version instead. Text is trimmed; control characters are 400. Fenced by `revision`
        (stale is 409 `version_conflict`, nothing written). A change bumps `revision` and writes one audit row with the field diff.
        Sending the stored values is a 200 with no change, no new version and no new `revision`. Exempt from the client version gate.

        Only an `admin` may CHANGE `creditRequired`: a photographer who sends a value different from the stored one gets 403
        `forbidden` and nothing is written (sending the stored value, with or without other fields, is fine). The checks run in
        order: role, then ownership (404), then the `revision` fence (409), then this rule (403).
      parameters:
        - $ref: "#/components/parameters/MediaIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaEditRequest" }
      responses:
        "200":
          description: The item as it is now.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItem" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/MediaNotFound" }
        "409": { $ref: "#/components/responses/MediaWriteConflict" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/media/{mediaId}/versions:
    post:
      tags: [media, admin]
      operationId: uploadMediaVersion
      summary: Upload a new file version of an item
      description: |
        Needs an ACTIVE `photographer` role (an `admin` also qualifies). OWNER ONLY (user ruling 2026-11-04): another photographer's
        item is 404 `not_found`, and an admin who is not the owner gets 403 `forbidden`. Allowed in every state, including `withdrawn` (the owner may add a version to a
        withdrawn item; it can be published again). The body is the raw image exactly as for `POST /v1/admin/media` (same limits,
        413, 415, sniffing and 422 `media_invalid`), plus the item `revision` as a query parameter (fence: stale is 409
        `version_conflict`). The new file becomes the draft version with an empty licence to fill in; the published version and its
        credit stay live until an admin publishes. The new version copies the previous draft's `description` (the licence starts
        empty) and takes its own rights statement from `X-Rights-Statement` (400 when missing or unknown, checked before the key lookup).

        Requires an `Idempotency-Key`. The key lookup runs FIRST: it precedes the `revision` fence, so an identical retry still
        replays after the item's `revision` has moved on. A replay needs the same operation (version upload, not create), the same
        `mediaId`, the same sha256 and the same `X-Rights-Statement`, and answers 200 with the item as stored now (current state; nothing new is written). Anything
        else with that key (another operation, another `mediaId`, other bytes, another statement) is 422 `idempotency_key_reused`. A new version bumps
        `revision`; one audit row. Exempt from the client version gate.
      parameters:
        - $ref: "#/components/parameters/MediaIdPath"
        - $ref: "#/components/parameters/MediaIdempotencyKey"
        - $ref: "#/components/parameters/MediaRightsStatementHeader"
        - name: revision
          in: query
          required: true
          description: The item's `revision` as the caller read it.
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary, maxLength: 5242880 }
          image/png:
            schema: { type: string, format: binary, maxLength: 5242880 }
      responses:
        "200":
          description: Replay of an `Idempotency-Key` this caller already used for the same operation, item and bytes; the item as it stands now.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItem" }
        "201":
          description: Version added.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItem" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/MediaNotFound" }
        "409": { $ref: "#/components/responses/MediaWriteConflict" }
        "413": { $ref: "#/components/responses/MediaBodyTooLarge" }
        "415": { $ref: "#/components/responses/MediaUnsupportedType" }
        "422": { $ref: "#/components/responses/MediaUploadRefused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/MediaStorageUnavailable" }

  /v1/admin/media/{mediaId}/rights:
    put:
      tags: [media, admin]
      operationId: stateMediaRights
      summary: State the rights for a draft that has none
      description: |
        For a draft with no rights statement yet (a photo imported from the old website review queue, which carries
        `d1_private_review`, or a version from before statements existed). Needs an ACTIVE `photographer` role. OWNER ONLY: another
        photographer's item is 404 `not_found`; an admin who is not the owner gets 403 `forbidden`. Strict body
        `{ revision, statement }`, `statement` being `v1_own` or `v1_authorised` (the same wording and consent as the upload
        header; `d1_private_review` is 400). Order: role, ownership, the `revision` fence (409 `version_conflict`), then eligibility:
        the draft's statement must be absent or `d1_private_review` AND the draft must never have been published (not the
        published version and no `publishedAt`), else 409 `rights_already_stated`. Written to the draft in place (no new version),
        bumps `revision`, one `media_rights` audit row. Exempt from the client version gate.
      parameters:
        - $ref: "#/components/parameters/MediaIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaRightsRequest" }
      responses:
        "200":
          description: The item as it is now.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItem" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/MediaNotFound" }
        "409":
          description: |
            `version_conflict`: `revision` is stale. `rights_already_stated`: the draft already has a `v1_*` statement or was published
            once. Nothing was written.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [version_conflict, rights_already_stated]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/media/{mediaId}/publish:
    post:
      tags: [media, admin]
      operationId: publishMedia
      summary: Publish the draft version
      description: |
        Admin only. Makes the draft version the published one (`state` `published`, `publishedVersion` = `draftVersion`); its
        licence is frozen with it. The draft's licence must name a licence and, when `creditRequired`, a credit, and the draft must carry
        a `v1_own` or `v1_authorised` rights statement (an imported or pre-statement draft needs `PUT .../rights` first): otherwise 422
        `content_invalid`. Publishing a draft that is already the published version is 409 `nothing_to_publish`. Fenced by `revision`
        (stale is 409 `version_conflict`). Bumps `revision`; one audit row. Answers 200, not 201. Exempt from the client version gate.
      parameters:
        - $ref: "#/components/parameters/MediaIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaRevisionRequest" }
      responses:
        "200":
          description: The item as it is now.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItem" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/MediaNotFound" }
        "409":
          description: |
            `version_conflict`: `revision` is stale. `nothing_to_publish`: the draft is already the published version. Nothing was written.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [version_conflict, nothing_to_publish]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "422":
          description: "`content_invalid`: the draft's licence has no `licenceName`, `creditRequired` is true and `credit` is empty, or the draft has no `v1_*` rights statement. Nothing was written."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [content_invalid]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/media/{mediaId}/withdraw:
    post:
      tags: [media, admin]
      operationId: withdrawMedia
      summary: Withdraw a published image
      description: |
        Admin only. `published` to `withdrawn`: players and the website stop seeing it (`publishedVersion` becomes null). An
        item that is not published is 409 `version_conflict`. Fenced by `revision`. Bumps `revision`; one audit row. Answers 200, not
        201. Exempt from the client version gate.
      parameters:
        - $ref: "#/components/parameters/MediaIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaRevisionRequest" }
      responses:
        "200":
          description: The item as it is now.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItem" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/MediaNotFound" }
        "409": { $ref: "#/components/responses/MediaWriteConflict" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/content/{module}/items/{id}/media:
    put:
      tags: [media, admin]
      operationId: linkContentItemMedia
      summary: Link or unlink a content item's image
      description: |
        Admin only. Sets (or with `mediaId: null` clears) the image of a content item. Optimistic on the item `version`
        (`expectedVersion`, as on the edit route); a change bumps the item version, sets `source` to `admin` and writes one
        `content_media_link` audit row (the `diff` is one `media` entry). Runs in one transaction under the module's write lock. Linking the stored value is 200 with
        `changed: false`. An unknown `mediaId` is 422 `media_invalid`; an unknown module or item is 404 `not_found`. Any existing media
        item may be linked, whatever its state (draft, published or withdrawn); readers only ever see the published version. A spreadsheet import
        never changes the link (the export carries a trailing `Media Id` column that the import ignores). The link counts as a staff write for the client-sheet replay rule.
      parameters:
        - $ref: "#/components/parameters/ContentModule"
        - $ref: "#/components/parameters/ContentItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentItemMediaRequest" }
      responses:
        "200":
          description: "The item as it is now (with `mediaId`). `changed: false` means nothing was written."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentItemChange" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownRoute" }
        "409":
          description: |
            `version_conflict`: `expectedVersion` is not the item's stored version. `import_in_progress`: an import or another edit holds
            the module's write lock; retry after `Retry-After` seconds (that response only). Nothing was written.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          x-error-codes: [version_conflict, import_in_progress]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "422":
          description: "`media_invalid`: `mediaId` names no media item. Nothing was written."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [media_invalid]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/media:
    get:
      tags: [media]
      operationId: getPublishedMedia
      summary: Read published images by id
      description: |
        Any signed-in caller (no player row or role needed); the website calls it with `X-Client: web`. `ids` is a
        comma-separated list of 1 to 50 media ids, each strictly `med-<n>`; a malformed id, an empty list, an empty element, more
        than 50 entries as sent, or a repeated `ids` parameter is 400 `invalid_request`. Duplicates are collapsed. The answer holds
        one `ImageRef` (the PUBLISHED version, with its frozen licence and a signed link) per requested id that is published, in
        request order; unknown, unpublished and withdrawn ids are simply absent, never 404. Never returns an owner or any principal.
        Always `Cache-Control: no-store`: the links expire (see `ImageRef.expiresAt`), so ask again rather than cache the answer.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - name: ids
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items: { $ref: "#/components/schemas/MediaId" }
      responses:
        "200":
          description: The published images among those asked for.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaImages" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/public/media:
    get:
      tags: [media]
      operationId: getPublicPublishedMedia
      summary: Read published images by id, anonymously
      description: |
        The anonymous twin of `GET /v1/media`, for guests on the public website (user ruling 2026-11-04). No token is needed and
        an `Authorization` header, valid or not, is ignored (the request is treated as a guest). It is not version gated. Same
        `ids` rules, same answer, same signed 24 h links: only PUBLISHED images, in request order, with their frozen licence;
        unknown, unpublished and withdrawn ids are absent, never 404. No owner, principal or other internal field is returned.
        Always `Cache-Control: no-store`.

        Rate limit: the per-IP public tier (`RATE_LIMIT_PUBLIC_PER_MIN`), 429 with `Retry-After`. The website calls this from
        its server, so every guest shares that one budget. The website must therefore send up to 50 ids per call, cache each
        `ImageRef`, refresh ahead of `expiresAt` (for example when under 1 hour is left), and keep serving its cached refs
        when this route answers 429.
      security: []
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items: { $ref: "#/components/schemas/MediaId" }
      responses:
        "200":
          description: The published images among those asked for.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaImages" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
      description: |
        Firebase ID token (email/password or Google). The server derives the player from the verified token
        only; no ID, role or name is ever read from a request.

  parameters:
    XClientVersion:
      name: X-Client-Version
      in: header
      required: false
      description: |
        App build number, a positive integer of at most 9 digits. Required in practice once the server sets a
        minimum build (otherwise 426).
      schema: { type: string, pattern: "^[1-9][0-9]{0,8}$" }

    ContentModule:
      name: module
      in: path
      required: true
      description: A module ID. Only modules with an import mapping are served (today `aircraft-identifier-military` and `airport-spotter`); others are 404.
      schema: { $ref: "#/components/schemas/ModuleId" }

    ContentItemId:
      name: id
      in: path
      required: true
      description: A content item id, e.g. `mil-a5`. An id the module does not store is 404 `not_found`.
      schema: { type: string, minLength: 1, maxLength: 64 }

    ContentDocumentNamePath:
      name: name
      in: path
      required: true
      description: A document name. Any other name is 404 `not_found`.
      schema: { $ref: "#/components/schemas/ContentDocumentName" }

    AccountPrincipal:
      name: principal
      in: path
      required: true
      description: |
        The target account, URL-encoded: exactly `firebase:<the configured Firebase project>:<uid>`, uid 1 to 128 characters with no
        surrounding whitespace and no `:`, `/` or control character. Anything else is 400 `invalid_request`.
      schema: { type: string, minLength: 1, maxLength: 256 }

    RevocableRole:
      name: role
      in: path
      required: true
      description: The role to revoke. Any other value is 404 `not_found`.
      schema: { type: string, enum: [photographer, admin] }

    MediaIdPath:
      name: mediaId
      in: path
      required: true
      description: A media item id, `med-<n>`. A malformed or unknown id is 404 `not_found`.
      schema: { $ref: "#/components/schemas/MediaId" }

    MediaIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        1-128 of `A-Z a-z 0-9 _ -`; missing or malformed is 400 `invalid_request`. Scoped to the caller. The key is looked up FIRST,
        before the `revision` fence. Repeating a key with the same operation (create vs version upload), the same `mediaId` (version
        uploads) and the same sha256 replays with 200 and the item as stored now; any other combination with that key is 422
        `idempotency_key_reused`. Mint a new key per new upload.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }

    MediaRightsStatementHeader:
      name: X-Rights-Statement
      in: header
      required: true
      description: |
        The uploader's rights statement for this file (wording v1, shown by the website): `v1_own` ("I took this photo and hold the
        rights to it.") or `v1_authorised` ("I'm authorised by the person or organisation that holds the rights."). Missing or any
        other value (including `d1_private_review`, which only the D1 import command sets) is 400 `invalid_request`, decided before
        the `Idempotency-Key` lookup. Sending it is the uploader's consent: "I confirm this is true, and I agree that Airplane Games
        may publish this photo, after review, under the licence and credit I give for it." Stored on the new file version with the
        caller as `statedBy` and the database time as `statedAt`. A replay of an `Idempotency-Key` must send the same statement
        (else 422 `idempotency_key_reused`).
      schema: { type: string, enum: [v1_own, v1_authorised] }

    StoreProductIdPath:
      name: productId
      in: path
      required: true
      description: A store product id, `^[a-z0-9][a-z0-9._]{0,99}$`. A malformed id is 400 `invalid_request` on PUT and 404 `not_found` on retire and restore (as is an unknown one there).
      schema: { $ref: "#/components/schemas/StoreProductId" }

    TripId:
      name: tripId
      in: path
      required: true
      description: A Flight Segment (Unity Trip) id. Not a UUID is 404 `trip_not_found`.
      schema: { type: string, format: uuid }

    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: The `ETag` of a copy the app already holds (a list, a weak `W/` tag or `*` also work); an unchanged resource is 304.
      schema: { type: string }

  headers:
    XRequestId:
      description: Request correlation id. Quote it in bug reports. Also echoed as `error.requestId` on errors.
      schema: { type: string }
    NoStore:
      description: Always `no-store`.
      schema: { type: string, const: no-store }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: string, pattern: "^[0-9]+$" }
    WWWAuthenticate:
      description: Always `Bearer`.
      schema: { type: string, const: Bearer }
    NoCache:
      description: Content manifest. Always `no-cache`; revalidate with `If-None-Match`.
      schema: { type: string, const: no-cache }
    PrivateNoCache:
      description: The Logbook. Always `private, no-cache`; revalidate with `If-None-Match`.
      schema: { type: string, const: "private, no-cache" }
    Immutable:
      description: Content documents. Always `private, max-age=31536000, immutable`.
      schema: { type: string, const: "private, max-age=31536000, immutable" }
    ETag:
      description: "A strong entity tag (quoted): the manifest `version`, a document's `sha256` or a Logbook tag (`lb-` and 32 hex)."
      schema: { type: string, pattern: '^"[A-Za-z0-9._:+-]{1,80}"$' }

  responses:
    InvalidRequest:
      description: Malformed JSON, wrong field type or range, or an unknown field.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [invalid_request]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BodyRejected:
      description: Body over 16 KB (413) or unsupported charset or encoding (415). Same body shape as 400.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [invalid_request]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, malformed, expired or wrongly issued token.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        WWW-Authenticate: { $ref: "#/components/headers/WWWAuthenticate" }
      x-error-codes: [unauthorized]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PlayerNotFound:
      description: No player yet. Call `PUT /v1/me` first.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [player_not_found]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Signed in, but without the required ACTIVE role in `account_roles`, or the role needs a verified email and the token's is not (Backend ADR-0002); or an admin who does not own the item on an owner-only route (new file version, rights statement).
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [forbidden]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    VersionConflict:
      description: |
        `version_conflict`: `draftVersion` is not the current draft revision (another editor edited, discarded or published since you
        read it; the message names the current revision). Nothing was written. Read the draft again and redo the edit on top of it.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [version_conflict]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidDraft:
      description: |
        `content_invalid`: an edit names something that does not exist (a Card that is not in the catalog), or the stored draft or the
        document a publish would write does not validate. Nothing was written. A stored draft that does not validate is cleared with
        `POST .../draft/discard`.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [content_invalid]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RoleRowNotFound:
      description: The account has no row for that role (`not_found`), or the role segment names no such route.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [not_found]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RoleVersionConflict:
      description: |
        `version_conflict`: the row is not in the state the move starts from, or not at the `revision` sent (someone decided first);
        the message names the current state and revision. Also the refusal to revoke the last active admin, and to grant admin to an
        account that already holds it. Nothing was written. Reload and decide again.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [version_conflict]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MediaBodyTooLarge:
      description: |
        Image body over 5 MB (`invalid_request`). This route's limit applies only to a caller whose Bearer token is verified and who
        holds the required role; the larger body is read after that check. Anything else is read under the global 16 KB limit.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [invalid_request]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MediaUnsupportedType:
      description: A Content-Type other than `image/jpeg` or `image/png` (`invalid_request`). The bytes are also sniffed; a mismatch is 422 `media_invalid`.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [invalid_request]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MediaNotFound:
      description: |
        No such media item, or the id is malformed. A photographer who is not the owner gets the same answer (the item's existence is
        not revealed).
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [not_found]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MediaWriteConflict:
      description: |
        `version_conflict`: `revision` is not the item's current revision, or the item is not in a state the move starts from. The
        message names the current state and revision. Nothing was written; reload and decide again.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [version_conflict]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MediaUploadRefused:
      description: |
        `media_invalid`: the bytes are not a JPEG or PNG the server accepts (truncated, content that does not match the type, or a side
        over 4096 px). `idempotency_key_reused`: the key already stored a different file for this caller. Nothing was written.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [media_invalid, idempotency_key_reused]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MediaStorageUnavailable:
      description: |
        `storage_unavailable`: file storage could not be written or read back (nothing was written to the database). Also
        `auth_unavailable` and `service_unavailable` as on every route. All carry `Retry-After` except a storage refusal that a retry will
        not fix (bad credentials), which has none. Otherwise retry the same request, with the same `Idempotency-Key` for an upload.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      x-error-codes: [storage_unavailable, auth_unavailable, service_unavailable]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnknownRoute:
      description: Any path or method not in this document. Not attached to a route.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      x-error-codes: [not_found]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ClientUpdateRequired:
      description: |
        `X-Client-Version` missing, malformed or below the server's minimum build. Show an update prompt.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [client_update_required]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Over the request limit. Wait `Retry-After` seconds.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      x-error-codes: [rate_limited]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: |
        `auth_unavailable`: the Google signing keys could not be fetched (on the UGS link route, the UGS keys too). `service_unavailable`: database
        unreachable or timed out (also readiness failing). Both carry `Retry-After`; retry later with the
        same token and the same request.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      x-error-codes: [auth_unavailable, service_unavailable]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TripNotFound:
      description: Not this player's Flight Segment (or unknown, or `tripId` is not a UUID).
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [trip_not_found]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TripGone:
      description: |
        `trip_expired`: the segment expired (30 minutes without activity) before all ten Rounds were banked.
        `trip_closed`: it was abandoned (or superseded by a newer segment), or completed.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [trip_expired, trip_closed]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Unexpected server fault. Any route can return it; not attached to individual routes.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [internal_error]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Rank:
      type: string
      description: Flight Crew Hierarchy, lowest first.
      enum: [trainee, first-officer, captain, check-airman, chief-pilot]
    ModuleId:
      type: string
      description: Module ID = the Unity ModuleRegistry BackendId. The Military game's final name is a working title.
      enum:
        - airport-spotter
        - atc-match
        - call-sign-match
        - identifier
        - aircraft-identifier-military
        - code-search
        - runway-identifier
        - tail-identifier
    Completion:
      type: string
      enum: [perfect, standard, unfinished]
    Liveness:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ready }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              description: Stable. Switch on this.
              enum:
                - unauthorized
                - forbidden
                - auth_unavailable
                - invalid_request
                - player_not_found
                - round_not_found
                - round_expired
                - round_closed
                - round_too_fast
                - rank_not_certified
                - insufficient_hints
                - insufficient_miles
                - not_found
                - rate_limited
                - client_update_required
                - import_invalid
                - plan_changed
                - import_in_progress
                - unknown_item_ids
                - version_conflict
                - nothing_to_publish
                - rights_already_stated
                - content_invalid
                - ugs_link_conflict
                - storage_unavailable
                - media_invalid
                - service_unavailable
                - internal_error
                - trip_not_found
                - trip_expired
                - trip_closed
                - trip_full
                - local_date_mismatch
                - idempotency_key_reused
                - trip_incomplete
                - store_unavailable
                - purchase_invalid
                - purchase_revoked
                - purchase_owned_by_other
            message:
              type: string
              description: For logs, not for display or logic.
            requestId:
              type: string
              description: Same value as the `X-Request-Id` header.
    AdminMe:
      type: object
      additionalProperties: false
      required: [principal, staff, roles]
      properties:
        principal: { type: string, description: "firebase:<projectId>:<uid>" }
        staff: { type: boolean, const: true, description: Kept for existing callers; always true (the caller is an active admin). }
        roles:
          type: array
          uniqueItems: true
          description: The caller's ACTIVE roles from `account_roles`, in the order player, photographer, admin (Backend ADR-0002).
          items: { type: string, enum: [player, photographer, admin] }
    RoleState:
      type: string
      description: "`blocked` applies to `photographer` rows only; only `active` grants anything."
      enum: [pending, active, rejected, revoked, blocked]
    OwnRole:
      type: object
      additionalProperties: false
      required: [role, state, revision, requestedAt, decidedAt]
      properties:
        role: { type: string, enum: [player, photographer, admin] }
        state: { $ref: "#/components/schemas/RoleState" }
        revision: { type: integer, minimum: 1, description: "Bumped by every change of the row." }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: [string, "null"], format: date-time, description: "Null while pending." }
    OwnRolesEnvelope:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles: { type: array, items: { $ref: "#/components/schemas/OwnRole" } }
    PhotographerRequestResult:
      type: object
      additionalProperties: false
      required: [role, changed]
      properties:
        role: { $ref: "#/components/schemas/OwnRole" }
        changed: { type: boolean, description: "False when the row was already pending or active and nothing was written." }
    RoleDecisionRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1, maximum: 2147483647, description: The row's `revision` as the admin read it. }
        note: { type: string, minLength: 1, maxLength: 500 }
    AdminGrantRequest:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, minLength: 1, maxLength: 500 }
        email: { type: string, maxLength: 1000, description: "A typed, unverified, display-only email (trimmed and lowercased; one `@`, 3-320 characters after trimming)." }
    AdminEmailEditRequest:
      type: object
      additionalProperties: false
      required: [revision, email]
      properties:
        revision: { type: integer, minimum: 1, maximum: 2147483647, description: The row's `revision` as the admin read it. }
        email: { type: [string, "null"], maxLength: 1000, description: "The corrected typed email, or null to clear it." }
    AdminRoleRow:
      type: object
      additionalProperties: false
      required: [principal, role, state, revision, requestedAt, decidedAt, decidedBy, note, requestEmail, grantEmail, email, emailSource]
      properties:
        principal: { type: string }
        role: { type: string, enum: [player, photographer, admin] }
        state: { $ref: "#/components/schemas/RoleState" }
        revision: { type: integer, minimum: 1 }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: [string, "null"], format: date-time }
        decidedBy: { type: [string, "null"], description: "The deciding admin's principal, `operator:<os user>` or `system:signup`. Null while pending." }
        note: { type: [string, "null"], description: "The note of the latest decision (the audit rows keep the history)." }
        requestEmail: { type: [string, "null"], description: "The verified email the account had when it asked for `photographer`; admins only, never used for authorisation. Null for other roles, and cleared by `DELETE /v1/me`." }
        grantEmail: { type: [string, "null"], description: "The email TYPED by the admin who granted `admin` (or by the operator command), or later corrected: unverified, display only, never used for authorisation. Null for other roles and when none was given; cleared by `DELETE /v1/me`." }
        email: { type: [string, "null"], description: "The one email to show: `grantEmail` when set, else `requestEmail`." }
        emailSource: { type: [string, "null"], enum: [verified_at_request, typed, null], description: "Where `email` comes from. A typed email is unverified." }
    AdminRoleEnvelope:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/AdminRoleRow" }
    RoleRequestList:
      type: object
      additionalProperties: false
      required: [requests, nextCursor]
      properties:
        requests: { type: array, items: { $ref: "#/components/schemas/AdminRoleRow" } }
        nextCursor: { type: [string, "null"] }
    ContentItem:
      type: object
      additionalProperties: false
      required: [id, rank, status, source, version, data, mediaId, updatedAt]
      properties:
        mediaId:
          type: [string, "null"]
          description: The linked image (`med-<n>`), null when none. Set by `PUT .../items/{id}/media`; a link or unlink is one `media` entry in the change `diff`.
        id: { type: string, description: "Stable item id, e.g. mil-a5." }
        rank: { $ref: "#/components/schemas/Rank" }
        status: { type: string, enum: [approved, retired] }
        source: { type: string, enum: [client_sheet, admin] }
        version: { type: integer, minimum: 1, description: Bumped by every edit. }
        data:
          type: object
          description: Module payload. Military Aircraft Identifier is `{ answer, wrong[3], sourceFile, photographer }`; Airport Spotter is `{ answer, wrong[3], sourceFile }` (IATA codes).
        updatedAt: { type: string, format: date-time }
    ContentItemList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ContentItem" }
    FieldDiff:
      type: object
      additionalProperties: false
      required: [field, from, to]
      properties:
        field: { type: string, description: "e.g. answer, wrong[1], rank, status" }
        from: {}
        to: {}
    ContentItemEditRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1, description: The item version the caller read. }
        rank: { $ref: "#/components/schemas/Rank" }
        data:
          type: object
          description: The whole module payload (replaces the stored one). Military is `{ answer, wrong[3], sourceFile, photographer }`; Airport Spotter is `{ answer, wrong[3], sourceFile }`.
    ContentItemVersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1, description: The item version the caller read. }
    ContentItemChange:
      type: object
      additionalProperties: false
      required: [changed, item, diff]
      properties:
        changed: { type: boolean, description: False when nothing was written. }
        item: { $ref: "#/components/schemas/ContentItem" }
        diff:
          type: array
          description: Each changed field, sorted by field name; empty when `changed` is false. A retire or restore is one `status` entry.
          items: { $ref: "#/components/schemas/FieldDiff" }
    TripCoverageRequest:
      type: object
      additionalProperties: false
      properties:
        itemIds:
          type: array
          maxItems: 2000
          items: { type: string, minLength: 1, maxLength: 64 }
    TripCoverage:
      type: object
      additionalProperties: false
      required: [module, policy, flightsPerTrip, ranks]
      properties:
        module: { $ref: "#/components/schemas/ModuleId" }
        policy:
          type: string
          enum: [lower-ranks, nearest-ranks]
          description: The module's deal policy (`modulePolicy` in `contracts/dealer.v1.json`).
        flightsPerTrip: { type: integer, const: 10 }
        ranks:
          type: array
          description: One entry per rank, lowest first.
          items:
            type: object
            additionalProperties: false
            required: [rank, dealable]
            properties:
              rank: { type: string, enum: [trainee, first-officer, captain, check-airman, chief-pilot] }
              dealable: { type: integer, minimum: 0, maximum: 10, description: "Flights a Trip at this rank would hold (below flightsPerTrip: the content cannot fill one)." }
    ContentDraftVersion:
      type: object
      additionalProperties: false
      required: [draftVersion]
      properties:
        draftVersion: { type: integer, minimum: 0, maximum: 2000000000, description: "The draft revision you read (0 = no draft yet)." }
    ContentPublishRequest:
      type: object
      additionalProperties: false
      required: [draftVersion]
      properties:
        draftVersion: { type: integer, minimum: 0, maximum: 2000000000, description: "The draft revision you read." }
        note: { type: string, minLength: 1, maxLength: 300, description: "Why; stored on the document version and in the audit row." }
        acknowledgeCardRemoval:
          type: boolean
          const: true
          description: Required when the publish would remove a Card from `clipper-cards` (its items are no longer approved); without it the answer is 422 `content_invalid`. Recorded in the audit row.
    FieldAwardsDraftEdit:
      type: object
      additionalProperties: false
      required: [draftVersion, awards]
      properties:
        draftVersion: { type: integer, minimum: 0, maximum: 2000000000 }
        awards:
          type: array
          minItems: 1
          maxItems: 28
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id: { $ref: "#/components/schemas/FieldAwardId" }
              title: { type: string, minLength: 1, maxLength: 200 }
              criteria: { type: string, minLength: 1, maxLength: 2000 }
              target: { type: integer, minimum: 1, maximum: 1000000000 }
              hidden: { type: boolean }
    ClipperCardsDraftEdit:
      type: object
      additionalProperties: false
      required: [draftVersion, names]
      properties:
        draftVersion: { type: integer, minimum: 0, maximum: 2000000000 }
        names:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: object
            additionalProperties: false
            required: [key, name]
            properties:
              key: { type: string, minLength: 1, maxLength: 512 }
              name: { type: string, minLength: 1, maxLength: 500 }
    AircraftTagsDraftEdit:
      type: object
      additionalProperties: false
      required: [draftVersion, entries]
      properties:
        draftVersion: { type: integer, minimum: 0, maximum: 2000000000 }
        entries:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: object
            additionalProperties: false
            required: [cardKey, tags]
            properties:
              cardKey: { type: string, minLength: 1, maxLength: 512 }
              tags:
                type: array
                uniqueItems: true
                items: { $ref: "#/components/schemas/AircraftTag" }
              acknowledgeClientTagRemoval:
                type: boolean
                const: true
                description: Required when the list drops a tag the client supplied (source `client_sheet` or `client_ruling`). Applies to this edit of this Card only.
    ContentChange:
      type: object
      additionalProperties: false
      required: [kind, key]
      description: |
        One difference between the document in force and what a publish would write. `kind`: `award` (a Field Award field:
        `field` is title, criteria, target or hidden), `card-added`, `card-removed`, `card-renamed`, `card-items` (the content
        items on a Card moved) or `tags` (a Card's tag list; `from` and `to` are sorted tag lists).
      properties:
        kind: { type: string, enum: [award, card-added, card-removed, card-renamed, card-items, tags] }
        key: { type: string, description: "The award id, or the Card key." }
        field: { type: string }
        from: {}
        to: {}
        removedClientTags:
          type: array
          description: "`tags` only: client-supplied tags (source `client_sheet` or `client_ruling`) this change removes. Present only with an acknowledgement."
          items: { $ref: "#/components/schemas/AircraftTag" }
        acknowledgedRemoval: { type: boolean, const: true }
    ContentDraft:
      type: object
      additionalProperties: false
      required: [name, publishedVersion, draftVersion, changed, edits, changeCount, changes]
      properties:
        name: { $ref: "#/components/schemas/ContentDocumentName" }
        publishedVersion:
          description: The version players are served. Null only for `clipper-cards` before its first seal.
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: "null" }
        draftVersion: { type: integer, minimum: 0, description: "The revision the version check compares. 0 = no draft row yet. Edits, discards and publishes raise it." }
        changed: { type: boolean, description: "Whether a publish now would write a different document than the one in force." }
        edits:
          type: object
          description: |
            The pending overlay. `field-awards`: `{ awards: { <id>: { title?, criteria?, target?, hidden? } } }`; `clipper-cards`:
            `{ names: { <cardKey>: name } }`; `aircraft-tags`: `{ tags: { <cardKey>: [tag] }, ackClientTagRemoval: { <cardKey>: true } }`. Every
            document also carries `history`: `[{ principal, action: edit|discard|import, at, draftVersion, fileSha256? }]` (`fileSha256` on an import only), every editor, importer and discarder since the last
            publish (kept across a discard, copied into the publish audit row, cleared by a publish). Empty when there is no draft.
        changeCount: { type: integer, minimum: 0 }
        changes:
          type: array
          maxItems: 200
          description: The first 200 of `changeCount` differences.
          items: { $ref: "#/components/schemas/ContentChange" }
    ContentDraftDetail:
      description: A draft plus the document a publish would write.
      type: object
      additionalProperties: false
      required: [name, publishedVersion, draftVersion, changed, edits, changeCount, changes, body]
      properties:
        name: { $ref: "#/components/schemas/ContentDocumentName" }
        publishedVersion:
          description: The version players are served. Null only for `clipper-cards` before its first seal.
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: "null" }
        draftVersion: { type: integer, minimum: 0, description: "The revision the version check compares. 0 = no draft row yet. Edits, discards and publishes raise it." }
        changed: { type: boolean, description: "Whether a publish now would write a different document than the one in force." }
        edits:
          type: object
          description: |
            The pending overlay. `field-awards`: `{ awards: { <id>: { title?, criteria?, target?, hidden? } } }`; `clipper-cards`:
            `{ names: { <cardKey>: name } }`; `aircraft-tags`: `{ tags: { <cardKey>: [tag] } }`. Empty when there is no draft.
        changeCount: { type: integer, minimum: 0 }
        changes:
          type: array
          maxItems: 200
          description: The first 200 of `changeCount` differences.
          items: { $ref: "#/components/schemas/ContentChange" }
        body:
          description: The preview, as version `publishedVersion + 1` (or the next free version).
          oneOf:
            - { $ref: "#/components/schemas/FieldAwardCatalogDocument" }
            - { $ref: "#/components/schemas/ClipperCardCatalogDocument" }
            - { $ref: "#/components/schemas/AircraftTagDocument" }
    ContentDraftList:
      type: object
      additionalProperties: false
      required: [documents]
      properties:
        documents:
          type: array
          items: { $ref: "#/components/schemas/ContentDraft" }
    ContentPublishResult:
      type: object
      additionalProperties: false
      required: [name, version, previousVersion, sha256, byteSize, draftVersion, changeCount, manifestVersion]
      properties:
        name: { $ref: "#/components/schemas/ContentDocumentName" }
        version: { type: integer, minimum: 1, description: The version just written. }
        previousVersion:
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: "null" }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "The digest the manifest lists for the new version." }
        byteSize: { type: integer, minimum: 1 }
        draftVersion: { type: integer, minimum: 1, description: "The draft revision after the publish (the draft is empty again)." }
        changeCount: { type: integer, minimum: 0 }
        manifestVersion: { type: string, description: "The manifest `version` a player is served right after the commit." }
    ImportIssue:
      type: object
      additionalProperties: false
      required: [row, level, message]
      properties:
        row: { type: integer, minimum: 0, description: "1-based sheet row; 0 = the whole file (only the Field Awards import: an award missing from the sheet, or the result failing the document validators)." }
        id: { type: string }
        level: { type: string, enum: [error, conflict, warning] }
        message: { type: string }
    ImportCounts:
      type: object
      additionalProperties: false
      required: [created, updated, unchanged, retired]
      properties:
        created: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        retired: { type: integer, minimum: 0, description: Stored items a client sheet no longer lists. }
    ImportSummary:
      type: object
      additionalProperties: false
      required: [id, module, fileName, sha256, byteSize, created, updated, unchanged, retired, createdAt]
      properties:
        id: { type: string, format: uuid }
        module: { $ref: "#/components/schemas/ModuleId" }
        fileName: { type: string }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        byteSize: { type: integer, minimum: 1 }
        created: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        retired: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    ImportDryRun:
      type: object
      additionalProperties: false
      required: [dryRun, replay, kind, counts, planHash, requiresConfirm, rows, retirements, warnings]
      properties:
        dryRun: { type: boolean, const: true }
        replay: { type: boolean, const: false, description: A real import of these bytes would be planned and applied, not replayed. }
        kind:
          type: string
          enum: [client_sheet, admin_export]
          description: A file without an Id column is a client sheet (authoritative); with one it is an admin export.
        counts: { $ref: "#/components/schemas/ImportCounts" }
        planHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: sha256 of the canonical plan. Pass it as `confirm` to apply a plan that has `requiresConfirm`.
        requiresConfirm:
          type: boolean
          description: True for a client sheet that would update or retire stored items.
        rows:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [row, id, action]
            properties:
              row: { type: integer, minimum: 1 }
              id: { type: string }
              action: { type: string, enum: [create, update, unchanged] }
              diff:
                type: array
                description: For an update, each changed field. A retired item coming back shows `status` retired to approved.
                items:
                  type: object
                  additionalProperties: false
                  required: [field, from, to]
                  properties:
                    field: { type: string, description: "e.g. answer, wrong[1], rank, status" }
                    from: {}
                    to: {}
        retirements:
          type: array
          description: Stored items the apply would retire (client sheets only).
          items:
            type: object
            additionalProperties: false
            required: [id, naturalKey]
            properties:
              id: { type: string }
              naturalKey: { type: string, description: "Military and Airport Spotter: the file name." }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/ImportIssue" }
    ImportDryRunReplay:
      type: object
      additionalProperties: false
      required: [dryRun, replay, import]
      description: A real import of these bytes would replay this receipt (it is the module's latest import).
      properties:
        dryRun: { type: boolean, const: true }
        replay: { type: boolean, const: true }
        import: { $ref: "#/components/schemas/ImportSummary" }
    ImportApplied:
      type: object
      additionalProperties: false
      required: [replayed, import, warnings]
      properties:
        replayed: { type: boolean, const: false }
        import: { $ref: "#/components/schemas/ImportSummary" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/ImportIssue" }
    ImportReplayed:
      type: object
      additionalProperties: false
      required: [replayed, import]
      properties:
        replayed: { type: boolean, const: true }
        import: { $ref: "#/components/schemas/ImportSummary" }
    FieldAwardsImportChange:
      type: object
      additionalProperties: false
      required: [field, from, to]
      properties:
        field: { type: string, enum: [title, criteria, target, thresholdCell] }
        from:
          description: The value in the preview (version in force plus draft overlay).
          oneOf: [{ type: string }, { type: integer }]
        to:
          description: The value the sheet carries.
          oneOf: [{ type: string }, { type: integer }]
    FieldAwardsImportAward:
      type: object
      additionalProperties: false
      required: [id, changes]
      properties:
        id: { type: string, description: The Field Award's Unity code id. }
        changes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/FieldAwardsImportChange" }
        targetNeedsRuling:
          type: boolean
          const: true
          description: >-
            Present (true) when the Threshold cell changed but no single whole-number target can be read from it (for example
            "15 Boeing + 15 Airbus"). The new `thresholdCell` is written, the `target` is left as it is, and staff must rule the
            target with `PATCH .../draft`; that ruling then sticks, because the same sheet no longer changes the cell. Covered by the planHash.
    FieldAwardsImportCounts:
      type: object
      additionalProperties: false
      required: [rows, awardsChanged, awardsUnchanged, fieldChanges]
      properties:
        rows: { type: integer, minimum: 0, description: Award rows read from the sheet. }
        awardsChanged: { type: integer, minimum: 0 }
        awardsUnchanged: { type: integer, minimum: 0 }
        fieldChanges: { type: integer, minimum: 0 }
    FieldAwardsImportDryRun:
      type: object
      additionalProperties: false
      required: [dryRun, publishedVersion, draftVersion, counts, planHash, requiresConfirm, awards, warnings]
      properties:
        dryRun: { type: boolean, const: true }
        publishedVersion:
          description: The version in force the plan was made against.
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: "null" }
        draftVersion: { type: integer, minimum: 0, description: The draft revision the plan was made against. }
        counts: { $ref: "#/components/schemas/FieldAwardsImportCounts" }
        planHash: { type: string, pattern: "^[0-9a-f]{64}$", description: "Present as ?confirm= when applying. Covers the changes, the version in force and the draft revision." }
        requiresConfirm: { type: boolean, description: True when the plan changes anything. }
        awards:
          type: array
          description: Only the awards that change, in catalog order. Empty when the sheet matches the preview.
          items: { $ref: "#/components/schemas/FieldAwardsImportAward" }
        warnings:
          type: array
          description: Non-blocking notes, in row order. An award whose changed Threshold cell cannot be read as one whole number is named here and flagged `targetNeedsRuling`.
          items: { $ref: "#/components/schemas/ImportIssue" }
    FieldAwardsImportApplied:
      type: object
      additionalProperties: false
      required: [applied, publishedVersion, draftVersion, counts, planHash, requiresConfirm, awards, warnings]
      properties:
        applied: { type: boolean, description: "False: the sheet changes nothing, so nothing was written or stored." }
        publishedVersion:
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: "null" }
        draftVersion: { type: integer, minimum: 0, description: "The draft revision after the write (unchanged when `applied` is false)." }
        counts: { $ref: "#/components/schemas/FieldAwardsImportCounts" }
        planHash: { type: string, pattern: "^[0-9a-f]{64}$", description: The hash of the plan that was applied. }
        requiresConfirm: { type: boolean }
        awards:
          type: array
          items: { $ref: "#/components/schemas/FieldAwardsImportAward" }
        warnings:
          type: array
          description: Non-blocking notes, in row order. An award whose changed Threshold cell cannot be read as one whole number is named here and flagged `targetNeedsRuling`.
          items: { $ref: "#/components/schemas/ImportIssue" }
        file:
          description: Present when `applied` is true.
          type: object
          additionalProperties: false
          required: [fileName, sha256, byteSize, blobKey]
          properties:
            fileName: { type: string }
            sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
            byteSize: { type: integer, minimum: 1 }
            blobKey: { type: string, description: "Where the original upload is kept (`imports/field-awards/<sha256>.xlsx`)." }
    ImportInvalid:
      type: object
      additionalProperties: false
      required: [error, report]
      properties:
        error: { $ref: "#/components/schemas/Error/properties/error" }
        report:
          type: array
          description: Every problem found, in row order, including warnings. At least one is an error or conflict.
          items: { $ref: "#/components/schemas/ImportIssue" }
    NextRank:
      type: object
      additionalProperties: false
      required: [rank, statusPoints]
      properties:
        rank: { $ref: "#/components/schemas/Rank" }
        statusPoints: { type: integer, minimum: 0, description: Lifetime Status Points needed. }
    Progress:
      type: object
      additionalProperties: false
      required:
        - evaluatedAt
        - version
        - statusPoints
        - miles
        - hints
        - certifiedRank
        - activeRank
        - pleasureCruise
        - selectableRanks
        - nextRank
        - perfectStreak
        - firstClassPass
      properties:
        version:
          type: integer
          minimum: 1
          description: |
            The server's stored player revision. It goes up by one for stored progress changes (a Round result,
            hint spend, hint pack or changed Active Rank). The game orders copies by `(version, evaluatedAt)`
            (user ruling 2026-11-02): a higher version wins regardless of evaluation time; at the same version
            the later evaluatedAt wins, because time-derived fields can change without a write.
        evaluatedAt:
          type: string
          format: date-time
          description: |
            The DATABASE clock at the instant this view was built (millisecond precision), the same instant that
            judged lazy Trip expiry and firstClassPass. One clock serves every server instance. For snapshots of
            the same player, compare version first, then this instant at equal versions. Equal pairs are
            equivalent evaluations. Compare parsed instants, not locale-formatted strings. Reads do not bump version.
        statusPoints: { type: integer, minimum: 0, description: Lifetime Status Points. }
        miles: { type: integer, minimum: 0 }
        hints: { type: integer, minimum: 0, description: Co-Pilot hints left. }
        certifiedRank: { $ref: "#/components/schemas/Rank" }
        activeRank: { $ref: "#/components/schemas/Rank" }
        pleasureCruise:
          type: boolean
          description: True when Active Rank is below Certified Rank.
        selectableRanks:
          type: array
          description: Ranks the player may fly, Certified down to Trainee.
          items: { $ref: "#/components/schemas/Rank" }
        nextRank:
          description: Null at Chief Pilot.
          oneOf:
            - { $ref: "#/components/schemas/NextRank" }
            - { type: "null" }
        perfectStreak:
          type: integer
          minimum: 0
          description: |
            Consecutive Perfect Completions inside the open Flight Segment, 0 when none is open (D-3, built in T2: the
            streak counts per Trip; it resets when a segment opens, completes, is abandoned or expires). The same applies
            to `UgsMirrorProgress.perfectStreak`. A segment that expired is closed lazily, so the stored value can lag until
            the next write; `GET /v1/me/progress` already reads 0 then. No Field Award or Clipper Card data is added here or
            to the UGS copy (design doc, U1/U2); the Logbook carries them.
        firstClassPass: { type: boolean }
    ProgressEnvelope:
      type: object
      additionalProperties: false
      required: [progress]
      properties:
        progress: { $ref: "#/components/schemas/Progress" }
    UgsLinkRequest:
      type: object
      additionalProperties: false
      required: [ugsToken]
      properties:
        ugsToken:
          type: string
          minLength: 1
          maxLength: 8000
          description: The UGS player access token. Verified server-side; the player id comes from it, never from the client.
    UgsLinkResponse:
      type: object
      additionalProperties: false
      required: [link]
      properties:
        link:
          type: object
          additionalProperties: false
          required: [linkedAt]
          properties:
            linkedAt: { type: string, format: date-time }
    UgsMirrorProgress:
      type: object
      additionalProperties: false
      description: |
        NOT an API response: the JSON value of the Cloud Save **Protected** item with key `progress`, written by the
        server for each linked player (the player can read their own, only the server can write). Same field names
        and values as `Progress` where they overlap. It is a fallback: prefer the server when it is reachable, and
        expect the copy to lag by minutes (at most one write per player per UGS_MIRROR_MIN_INTERVAL_SEC, default 5 minutes). Never write it. Order two copies, or a copy and a server answer,
        by `version` first (the same stored counter as `Progress.version`), then `evaluatedAt` at equal versions.
        Time-derived lazy Trip expiry can change perfectStreak without a stored version change.
        Every copy carries evaluatedAt (required since schemaVersion 3).
        Never use updatedAt as an evaluation timestamp. Use the copy only when `uid` is the signed-in Firebase user: after a UGS link moves, or an
        account is deleted and the UGS player re-linked, the item can still hold the previous owner's copy until the
        server rewrites it, and versions of different owners are not comparable.
      required: [schemaVersion, uid, version, evaluatedAt, statusPoints, miles, hints, perfectStreak, certifiedRank, activeRank, firstClassUntil, updatedAt]
      properties:
        schemaVersion: { type: integer, const: 3, description: "3 since 2026-11-02 (`evaluatedAt` required; 2 added `uid` on 2026-10-29 and was never written to a real player)." }
        uid: { type: string, minLength: 1, maxLength: 128, description: Firebase uid of the player this copy belongs to. }
        evaluatedAt: { type: string, format: date-time, description: "The database instant at which this snapshot was built; orders copies at one `version`." }
        version: { type: integer, minimum: 1, description: "The server's player version at the time of the snapshot." }
        statusPoints: { type: integer, minimum: 0 }
        miles: { type: integer, minimum: 0 }
        hints: { type: integer, minimum: 0, description: Co-Pilot hints left. }
        perfectStreak: { type: integer, minimum: 0 }
        certifiedRank: { $ref: "#/components/schemas/Rank" }
        activeRank: { $ref: "#/components/schemas/Rank" }
        firstClassUntil:
          type: [string, "null"]
          format: date-time
          description: End of the First Class Pass, or null. The pass is active while this is in the future.
        updatedAt: { type: string, format: date-time, description: "Server time of the player's last change." }
    SetActiveRankRequest:
      type: object
      additionalProperties: false
      required: [rank]
      properties:
        rank: { $ref: "#/components/schemas/Rank" }
    IssuedRound:
      type: object
      additionalProperties: false
      required: [roundId, module, rank, pleasureCruise, expiresAt, tripId, flightNumber]
      properties:
        roundId: { type: string, format: uuid }
        module: { $ref: "#/components/schemas/ModuleId", description: "The segment's module." }
        rank: { $ref: "#/components/schemas/Rank", description: "The segment's rank (Active Rank when it opened)." }
        pleasureCruise: { type: boolean }
        expiresAt: { type: string, format: date-time, description: "30 minutes after issue." }
        tripId: { type: string, format: uuid, description: The Flight Segment this Round belongs to. }
        flightNumber: { type: integer, minimum: 1, maximum: 10, description: "Unity Flight number in the Trip (rounds banked + 1)." }
    RoundEnvelope:
      type: object
      additionalProperties: false
      required: [round]
      properties:
        round: { $ref: "#/components/schemas/IssuedRound" }
    Award:
      type: object
      additionalProperties: false
      required: [completion, speedBonus, streakMiles, statusPoints, miles, firstClassPass, pleasureCruise]
      properties:
        completion: { $ref: "#/components/schemas/Completion" }
        speedBonus: { type: boolean }
        streakMiles: { type: integer, minimum: 0 }
        statusPoints: { type: integer, minimum: 0 }
        miles: { type: integer, minimum: 0 }
        firstClassPass: { type: boolean, description: Whether First Class Pass applied to this Round. }
        pleasureCruise: { type: boolean, description: Whether this Round was flown below Certified Rank. }
    Promotion:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: { $ref: "#/components/schemas/Rank" }
        to: { $ref: "#/components/schemas/Rank" }
    RoundResultResponse:
      type: object
      additionalProperties: false
      required: [award, promotion, replayed, hintGrants, trip, progress]
      properties:
        award: { $ref: "#/components/schemas/Award" }
        promotion:
          description: Null unless this Round raised Certified Rank.
          oneOf:
            - { $ref: "#/components/schemas/Promotion" }
            - { type: "null" }
        replayed:
          type: boolean
          description: True when this Round was already banked; nothing was paid again.
        hintGrants:
          description: Hints this result granted (a 7th consecutive local day, `day_streak_grant`). Empty on a replay of a Round that granted nothing; the same grant on a replay of one that did.
          type: array
          items: { $ref: "#/components/schemas/HintGrant" }
        trip:
          description: Where the Flight Segment stands after this Round (on a replay, where it stands now). Null only for a Round banked before Flight Segments existed (local dev data).
          oneOf:
            - type: object
              additionalProperties: false
              required: [tripId, roundsBanked, perfectStreak]
              properties:
                tripId: { type: string, format: uuid }
                roundsBanked: { type: integer, minimum: 1, maximum: 10 }
                perfectStreak: { type: integer, minimum: 0, maximum: 10 }
            - { type: "null" }
        progress: { $ref: "#/components/schemas/Progress" }
    HintReceipt:
      type: object
      additionalProperties: false
      required: [roundId, replayed]
      properties:
        roundId: { type: string, format: uuid }
        replayed:
          type: boolean
          description: True when this Round already had its hint; nothing was debited again.
    HintResponse:
      type: object
      additionalProperties: false
      required: [hint, progress]
      properties:
        hint: { $ref: "#/components/schemas/HintReceipt" }
        progress: { $ref: "#/components/schemas/Progress" }
    PurchaseReceipt:
      type: object
      additionalProperties: false
      required: [hints, priceMiles, replayed]
      properties:
        hints: { type: integer, minimum: 1, description: Hints added by the pack. }
        priceMiles: { type: integer, minimum: 1, description: Miles charged. }
        replayed:
          type: boolean
          description: True when this Idempotency-Key was already billed; nothing was charged again.
    PurchaseResponse:
      type: object
      additionalProperties: false
      required: [purchase, progress]
      properties:
        purchase: { $ref: "#/components/schemas/PurchaseReceipt" }
        progress: { $ref: "#/components/schemas/Progress" }

    # ---------------------------------------------------------------------------------------------------------
    # Store catalog and purchases (wave P; docs/plans/purchases.md). Built in 0.20.0.
    # ---------------------------------------------------------------------------------------------------------

    StoreProductKind:
      type: string
      enum: [hint_pack, first_class_pass]
    StorePassPeriod:
      type: string
      enum: [P1M, P1Y]
      description: "ISO 8601 duration of one Pass term (monthly, yearly). Informational: the store's expiry is authoritative."
    StoreProductStatus:
      type: string
      enum: [active, retired]
    StoreProductId:
      type: string
      pattern: "^[a-z0-9][a-z0-9._]{0,99}$"
      description: The product id as registered in the App Store and Google Play (the same string in both).
    StoreName:
      type: string
      enum: [apple, google]
    StoreProduct:
      type: object
      additionalProperties: false
      required: [productId, kind]
      description: One product on offer. No title and no price (the app shows its own copy and the store's localized price).
      properties:
        productId: { $ref: "#/components/schemas/StoreProductId" }
        kind: { $ref: "#/components/schemas/StoreProductKind" }
        hints: { type: integer, minimum: 1, maximum: 1000, description: Hints a `hint_pack` adds. Absent for a Pass. }
        passPeriod: { $ref: "#/components/schemas/StorePassPeriod" }
    StoreProductList:
      type: object
      additionalProperties: false
      required: [products]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/StoreProduct" }
    AdminStoreProduct:
      type: object
      additionalProperties: false
      required: [productId, kind, title, demo, status, version, createdAt, updatedAt]
      properties:
        productId: { $ref: "#/components/schemas/StoreProductId" }
        kind: { $ref: "#/components/schemas/StoreProductKind" }
        hints: { type: [integer, "null"], minimum: 1, maximum: 1000, description: Present for a `hint_pack`, null for a Pass. }
        passPeriod:
          oneOf: [{ $ref: "#/components/schemas/StorePassPeriod" }, { type: "null" }]
          description: Present for a Pass, null for a `hint_pack`.
        title: { type: string, minLength: 1, maxLength: 100, description: A staff label. Never shown to players. }
        demo:
          type: boolean
          description: A demo product carries a placeholder store id; it is never listed and never sold in production.
        status: { $ref: "#/components/schemas/StoreProductStatus" }
        version: { type: integer, minimum: 1, description: The optimistic-lock value the edit routes check. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminStoreProductList:
      type: object
      additionalProperties: false
      required: [products]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/AdminStoreProduct" }
    AdminStoreProductRequest:
      type: object
      additionalProperties: false
      required: [kind, title, demo]
      description: |
        No `version` creates, `version` edits. A `hint_pack` needs `hints` and no `passPeriod`; a `first_class_pass` needs `passPeriod`
        and no `hints`. `kind` and `demo` are immutable once the product exists.
      properties:
        version: { type: integer, minimum: 1, maximum: 2147483647, description: The product `version` the caller read. Omit to create. }
        kind: { $ref: "#/components/schemas/StoreProductKind" }
        title: { type: string, minLength: 1, maxLength: 100 }
        hints: { type: integer, minimum: 1, maximum: 1000 }
        passPeriod: { $ref: "#/components/schemas/StorePassPeriod" }
        demo: { type: boolean }
    StoreProductVersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1, maximum: 2147483647, description: The product `version` the caller read. }
    StorePurchaseAppleRequest:
      type: object
      additionalProperties: false
      required: [store, productId, transactionId]
      properties:
        store: { type: string, const: apple }
        productId: { $ref: "#/components/schemas/StoreProductId" }
        transactionId: { type: string, pattern: "^[A-Za-z0-9._~-]{1,256}$", description: The StoreKit 2 transaction id. }
        jws: { type: string, maxLength: 12288, description: "The signed transaction (optional, unused until the Apple verifier lands). Capped below the 16 KB JSON body limit." }
    StorePurchaseGoogleRequest:
      type: object
      additionalProperties: false
      required: [store, productId, purchaseToken]
      properties:
        store: { type: string, const: google }
        productId: { $ref: "#/components/schemas/StoreProductId" }
        purchaseToken: { type: string, pattern: "^[A-Za-z0-9._~:-]{1,1024}$" }
    StorePurchaseRequest:
      description: The store reference of a purchase the app holds. Strict; the shape is chosen by `store`. The server never reads a grant from it.
      oneOf:
        - { $ref: "#/components/schemas/StorePurchaseAppleRequest" }
        - { $ref: "#/components/schemas/StorePurchaseGoogleRequest" }
      discriminator:
        propertyName: store
        mapping:
          apple: "#/components/schemas/StorePurchaseAppleRequest"
          google: "#/components/schemas/StorePurchaseGoogleRequest"
    StorePurchase:
      type: object
      additionalProperties: false
      required: [store, productId, kind, environment, purchasedAt, grantedHints, grantedUntil]
      description: The recorded grant, snapshotted when it was made (a later catalog edit does not change it).
      properties:
        store: { $ref: "#/components/schemas/StoreName" }
        productId: { $ref: "#/components/schemas/StoreProductId" }
        kind: { $ref: "#/components/schemas/StoreProductKind" }
        environment: { type: string, enum: [production, sandbox, fake] }
        purchasedAt: { type: string, format: date-time }
        grantedHints: { type: [integer, "null"], minimum: 1, description: Hints added by a `hint_pack`; null for a Pass. }
        grantedUntil: { type: [string, "null"], format: date-time, description: The Pass expiry this transaction carried; null for a `hint_pack`. }
    StorePurchaseResponse:
      type: object
      additionalProperties: false
      required: [status, replayed, storePurchase, progress]
      properties:
        status:
          type: string
          enum: [granted, pending]
          description: |
            `granted`: recorded; finish the store transaction. `pending`: valid at the store but not granted here (product unknown
            or not sellable); nothing written; keep the store transaction pending and resend later.
        replayed:
          type: boolean
          description: True when this store reference was already granted to this player; nothing was granted again. Always false for `pending`.
        storePurchase:
          oneOf: [{ $ref: "#/components/schemas/StorePurchase" }, { type: "null" }]
          description: The recorded grant; null when `status` is `pending`.
        progress: { $ref: "#/components/schemas/Progress" }
    Entitlements:
      type: object
      additionalProperties: false
      required: [commerceToken, firstClassPass, firstClassUntil, productId, evaluatedAt]
      properties:
        commerceToken:
          type: string
          format: uuid
          description: |
            Opaque per-player token for the stores: Apple `appAccountToken` as this UUID, Google `obfuscatedExternalAccountId` as 32 hex
            digits without hyphens. Random, stable once created, unrelated to the Firebase uid.
        firstClassPass: { type: boolean, description: True while `firstClassUntil` is in the future at `evaluatedAt`. }
        firstClassUntil: { type: [string, "null"], format: date-time }
        productId:
          oneOf: [{ $ref: "#/components/schemas/StoreProductId" }, { type: "null" }]
          description: The Pass product that sets `firstClassUntil`; null without a Pass.
        evaluatedAt: { type: string, format: date-time, description: The database clock at the instant this view was built. }

    # ---------------------------------------------------------------------------------------------------------
    # Flight Segment, Field Award and Logbook schemas: built in slices T2, T3 and T5 (a schema marked x-planned: true would be
    # designed and not built). docs/design/trips-awards-logbook.md.
    # ---------------------------------------------------------------------------------------------------------

    LocalDate:
      type: string
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      description: A calendar date, `YYYY-MM-DD`.
    ContentVersion:
      type: string
      pattern: "^[A-Za-z0-9._:+-]{1,64}$"
      description: The app's bundled content pack version (ADR-0008 §4, snapshot date plus a hash). Recorded only, until releases exist.
    FlightSegmentStatus:
      type: string
      enum: [open, completed, abandoned]
      description: An expired segment reads `abandoned` (unless all ten Rounds were banked, then it can still be completed).
    FlightSegmentOutcome:
      type: string
      enum: [all_correct, not_all_correct]
      description: Unity `TripOutcome`. `all_correct` = every Round finished (answered correctly; a hint or a second try still counts).

    OpenFlightSegmentRequest:
      type: object
      additionalProperties: false
      required: [module, flightCount, localDate, utcOffsetMinutes, contentVersion]
      description: Body of `POST /v1/trips` (ADR-0008 §2, `moduleId` there is `module` here, as on `POST /v1/rounds`).
      properties:
        module: { $ref: "#/components/schemas/ModuleId" }
        flightCount:
          type: integer
          const: 10
          description: Rounds (Unity Flights) in the segment. Always 10 (Unity `TripProfiles`, catalog `trip.flightsPerTrip`).
        localDate: { $ref: "#/components/schemas/LocalDate" }
        utcOffsetMinutes:
          type: integer
          minimum: -720
          maximum: 840
          description: The phone's current UTC offset in minutes (UTC+05:30 is 330, UTC-05:00 is -300).
        contentVersion: { $ref: "#/components/schemas/ContentVersion" }

    FlightSegment:
      type: object
      additionalProperties: false
      description: A Flight Segment (Unity Trip) as it stands.
      required:
        [tripId, module, rank, pleasureCruise, status, flightCount, roundsBanked, currentRoundId, perfectStreak,
         localDate, utcOffsetMinutes, contentVersion, openedAt, expiresAt, closedAt]
      properties:
        tripId: { type: string, format: uuid }
        module: { $ref: "#/components/schemas/ModuleId" }
        rank: { $ref: "#/components/schemas/Rank" }
        pleasureCruise: { type: boolean }
        status: { $ref: "#/components/schemas/FlightSegmentStatus" }
        flightCount: { type: integer, const: 10 }
        roundsBanked: { type: integer, minimum: 0, maximum: 10 }
        currentRoundId:
          description: The open Round, if any.
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        perfectStreak: { type: integer, minimum: 0, maximum: 10, description: "The segment's Perfect Streak (D-3)." }
        localDate: { $ref: "#/components/schemas/LocalDate" }
        utcOffsetMinutes: { type: integer, minimum: -720, maximum: 840 }
        contentVersion: { $ref: "#/components/schemas/ContentVersion" }
        openedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: "30 minutes after the last open, Round issue or Round result." }
        closedAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
    FlightSegmentEnvelope:
      type: object
      additionalProperties: false
      required: [trip, progress]
      properties:
        trip: { $ref: "#/components/schemas/FlightSegment" }
        progress: { $ref: "#/components/schemas/Progress" }
    FlightSegmentAbandoned:
      type: object
      additionalProperties: false
      required: [trip, replayed, progress]
      properties:
        trip: { $ref: "#/components/schemas/FlightSegment" }
        replayed: { type: boolean, description: True when the segment was already closed without completing. }
        progress: { $ref: "#/components/schemas/Progress" }

    StartRoundInSegmentRequest:
      type: object
      additionalProperties: false
      required: [tripId]
      description: Body of `POST /v1/rounds` (0.4.0, replaces `{ module }`). Module, rank and Pleasure Cruise come from the segment.
      properties:
        tripId: { type: string, format: uuid }

    RoundResultWithFlightFactsRequest:
      type: object
      additionalProperties: false
      required: [finished, errorCount, usedHint, timeRemainingFraction, aircraftKey, answerMs, attempts]
      description: |
        Body of `POST /v1/rounds/{roundId}/result` (0.4.0): the Round facts plus the Flight facts (ADR-0008 §2).
        Module rules (400 `invalid_request` when broken, nothing banked):
        - `identifier`: `aircraftKey` is the Unity aircraft family of the Flight's correct answer (the `family` of the
          question in `identifier_questions.json`, e.g. `787`, `A320`), required, also on a timeout. It must be an exact
          key of the seeded commercial Card catalog (U9: 707 717 727 737 747 757 767 777 787 A220 A300 A310 A318 A319 A320
          A321 A330 A340 A350 A380 E175 CRJ DC-8); a typo, a case variant (`a320`) or a Military key is 400 and banks
          nothing, so it can never create a second Card.
        - `aircraft-identifier-military`: `aircraftKey` is the content item id of the question (`mil-a4`), required (U3);
          the server maps it to the Card key frozen on the stored item (the client's answer text, design 3.5). An id the
          content store does not hold is rejected; a retired item is accepted (A6).
        - every other module: `aircraftKey` is null.
        - `attempts` >= `errorCount`, and >= 1 when `finished`.
        - `answerMs` may not exceed the server's own issue-to-result time by more than 2,000 ms.
      properties:
        finished: { type: boolean, description: "Answered correctly (Unity FlightEnd.Solved). A second try or a hint still counts." }
        errorCount: { type: integer, minimum: 0, maximum: 1000 }
        usedHint: { type: boolean }
        timeRemainingFraction: { type: number, minimum: 0, maximum: 1 }
        aircraftKey:
          description: The aircraft the Flight showed (see the module rules above).
          oneOf:
            - { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }
            - { type: "null" }
        answerMs:
          type: integer
          minimum: 0
          maximum: 1800000
          description: Milliseconds from the deal to the settle on the device (the clock the player saw). Feeds Bogey Identified.
        attempts:
          type: integer
          minimum: 0
          maximum: 1000
          description: Answers submitted in this Flight, the correct one included.

    HintGrant:
      type: object
      additionalProperties: false
      required: [kind, hints, ref]
      description: Hints the server granted (Unity `HintBank`). Each is one `hint_ledger` row, idempotent on (kind, ref).
      properties:
        kind:
          type: string
          enum: [trip_grant, day_streak_grant]
          description: "`trip_grant`: every 4th completed Flight Segment (ref = tripId; emitted by `complete`). `day_streak_grant`: every 7th consecutive local day with a banked Round (ref = that local date; built in T2)."
        hints: { type: integer, minimum: 1 }
        ref: { type: string }

    FlightSegmentSummary:
      type: object
      additionalProperties: false
      description: A completed Flight Segment, as the debrief and the Logbook row show it.
      required:
        [tripId, module, rank, pleasureCruise, flights, correct, outcome, hintUsed, goAround, nightTrip, bestStreak, miles,
         statusPoints, localDate, completedAt, catalogVersion]
      properties:
        tripId: { type: string, format: uuid }
        module: { $ref: "#/components/schemas/ModuleId" }
        rank: { $ref: "#/components/schemas/Rank" }
        pleasureCruise: { type: boolean }
        flights: { type: integer, const: 10 }
        correct: { type: integer, minimum: 0, maximum: 10, description: Rounds finished (answered correctly). }
        outcome: { $ref: "#/components/schemas/FlightSegmentOutcome" }
        hintUsed: { type: boolean, description: Any Round used a hint (paid or claimed). }
        goAround: { type: boolean, description: "All correct, and the previous completed segment was not (Go Around)." }
        nightTrip: { type: boolean, description: "Completed 22:00 up to 05:00 local (Red-Eye Special). Local = server time of the 10th banked Round + utcOffsetMinutes." }
        bestStreak: { type: integer, minimum: 0, maximum: 10, description: Longest Perfect Streak inside the segment. }
        miles: { type: integer, minimum: 0, description: Miles its Rounds earned. }
        statusPoints: { type: integer, minimum: 0, description: Status Points its Rounds earned. }
        localDate: { $ref: "#/components/schemas/LocalDate" }
        completedAt: { type: string, format: date-time }
        catalogVersion: { type: integer, minimum: 1, description: The Field Award catalog version it was judged against. }
    FieldAwardEarned:
      type: object
      additionalProperties: false
      required: [id, earnedAt]
      properties:
        id: { $ref: "#/components/schemas/FieldAwardId" }
        earnedAt: { type: string, format: date-time }
    ClipperCardCollected:
      type: object
      additionalProperties: false
      required: [key, module, firstCollectedAt]
      properties:
        key: { type: string, description: "The Card key (see ClipperCardDefinition.key)." }
        module: { $ref: "#/components/schemas/ModuleId" }
        firstCollectedAt: { type: string, format: date-time }
    FlightSegmentCompletion:
      type: object
      additionalProperties: false
      required: [trip, fieldAwards, clipperCards, hintGrants, replayed, progress]
      properties:
        trip: { $ref: "#/components/schemas/FlightSegmentSummary" }
        fieldAwards:
          type: array
          description: Field Awards newly earned by this segment (empty when none). The full board is in the Logbook.
          items: { $ref: "#/components/schemas/FieldAwardEarned" }
        clipperCards:
          type: array
          description: Cards collected for the first time by this segment.
          items: { $ref: "#/components/schemas/ClipperCardCollected" }
        hintGrants:
          type: array
          items: { $ref: "#/components/schemas/HintGrant" }
        replayed: { type: boolean, description: True when the segment was already completed; nothing changed. }
        progress: { $ref: "#/components/schemas/Progress" }

    FieldAwardId:
      type: string
      description: |
        The 28 Field Award ids. These are the Unity code ids (`Achievements.cs` `AchievementCatalog.Starter`), so
        progress earned on either side keeps its key (contract round 1). Ten differ from the sheet-snapshot ids
        (`field-awards.json`): first-flight = first-solo, century = logbook-100, sharp-eyes = vfr-certified,
        flawless-five = five-by-five, five-in-a-row = ace-in-the-cockpit, week-on-the-line = line-pilot,
        regular = 30-days-on-the-ramp, first-card = first-clipper-card, collector = curator-of-the-skies,
        textbook = textbook-landing. Renaming one is a breaking change.
      enum:
        - first-flight
        - frequent-flyer
        - century
        - sharp-eyes
        - flawless-five
        - five-in-a-row
        - week-on-the-line
        - regular
        - first-card
        - collector
        - textbook
        - high-flyer
        - coast-to-coast
        - no-instrument-flight
        - red-eye-special
        - fleet-admiral
        - centennial-streak
        - go-around
        - globe-trotter
        - quad-engine-royalty
        - the-great-rivalry
        - heavy-metal
        - regional
        - bogey-identified
        - top-gun-ace
        - rotorhead
        - vertical-horizon
        - executive-platinum
    FieldAwardMetric:
      type: string
      description: |
        What the server counts for an award (Unity `AchievementMetric`, kebab-case). A metric is code; staff can edit
        an award's text, target and hidden flag, never its metric. Scopes follow Unity `AwardCounters` and are spelled
        out in the design doc (for example `identifier-full-trips` and `best-perfect-flight-streak` see only the two
        Identifier modules; the Military-only metrics see only Military Cards).
      enum:
        - trips-completed
        - flights-completed
        - identifier-full-trips
        - best-perfect-flight-streak
        - best-day-streak
        - cards-collected
        - perfect-cards
        - miles-earned
        - best-hint-free-trip-streak
        - night-trips
        - go-arounds
        - quad-engine-cards
        - rivalry-balance
        - heavy-cards
        - regional-cards
        - quick-fighter-id
        - fighter-aces
        - rotary-identified
        - vtol-identified
    FieldAwardProgress:
      type: object
      additionalProperties: false
      required: [id, current, target, earned, earnedAt]
      properties:
        id: { $ref: "#/components/schemas/FieldAwardId" }
        current: { type: integer, minimum: 0, description: "The metric's value, capped at target." }
        target: { type: integer, minimum: 1 }
        earned: { type: boolean, description: "An earned award stays earned, even if its target is raised later." }
        earnedAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
    FieldAwardBoard:
      type: object
      additionalProperties: false
      required: [catalogVersion, earned, total, awards]
      properties:
        catalogVersion: { type: integer, minimum: 1 }
        earned: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 1 }
        awards:
          type: array
          description: Every award, in catalog (sheet) order.
          items: { $ref: "#/components/schemas/FieldAwardProgress" }

    ClipperCardRecord:
      type: object
      additionalProperties: false
      required: [key, module, firstCollectedAt, timesIdentified, everPerfect]
      description: Unity `CardRecord`, server-side.
      properties:
        key: { type: string }
        module: { $ref: "#/components/schemas/ModuleId" }
        firstCollectedAt: { type: string, format: date-time }
        timesIdentified: { type: integer, minimum: 1 }
        everPerfect: { type: boolean, description: "Identified at least once with no error and no hint (a one-way latch)." }
    LogbookTripRow:
      type: object
      additionalProperties: false
      required: [tripId, module, localDate, flights, correct, miles, statusPoints, completedAt]
      description: One RECENT FLIGHTS row (Unity `RoundRecord`, which is a Trip).
      properties:
        tripId: { type: string, format: uuid }
        module: { $ref: "#/components/schemas/ModuleId" }
        localDate: { allOf: [{ $ref: "#/components/schemas/LocalDate" }], description: "The local day the Trip was completed on (the same value as FlightSegmentSummary.localDate)." }
        flights: { type: integer, const: 10 }
        correct: { type: integer, minimum: 0, maximum: 10 }
        miles: { type: integer, minimum: 0 }
        statusPoints: { type: integer, minimum: 0 }
        completedAt: { type: string, format: date-time }
    DailyLog:
      type: object
      additionalProperties: false
      required: [lastPlayedDate, flightsOnLastPlayedDate, streakDays, bestStreakDays]
      description: Unity `DailyFlightLog` and the day streak behind Line Pilot and the 7-day hint. A day counts once a Round is banked on it.
      properties:
        lastPlayedDate:
          oneOf:
            - { $ref: "#/components/schemas/LocalDate" }
            - { type: "null" }
        flightsOnLastPlayedDate: { type: integer, minimum: 0 }
        streakDays: { type: integer, minimum: 0, description: Consecutive local days ending on lastPlayedDate. }
        bestStreakDays: { type: integer, minimum: 0 }
    LifetimeTotals:
      type: object
      additionalProperties: false
      required: [trips, flights, correct, allCorrectTrips, bestTripStreak, miles]
      description: Unity `LifetimeTotals` over completed Flight Segments (its `Rounds` are Trips).
      properties:
        trips: { type: integer, minimum: 0 }
        flights: { type: integer, minimum: 0 }
        correct: { type: integer, minimum: 0 }
        allCorrectTrips: { type: integer, minimum: 0, description: "Unity PerfectRounds: segments with every Round correct." }
        bestTripStreak: { type: integer, minimum: 0, maximum: 10, description: "Unity BestRoundStreak: the longest Perfect Streak inside one segment." }
        miles: { type: integer, minimum: 0, description: Miles earned in completed segments. }
    AwardCounters:
      type: object
      additionalProperties: false
      description: Unity `AwardCounters` (the parts that are not derived from Cards). Replaces the app's local counters.
      required:
        [identifierFullTrips, perfectFlightStreak, bestPerfectFlightStreak, hintFreeTripStreak, bestHintFreeTripStreak,
         nightTrips, goArounds, previousTripOutcome]
      properties:
        identifierFullTrips: { type: integer, minimum: 0 }
        perfectFlightStreak: { type: integer, minimum: 0, description: "Perfect Identifier Rounds in a row ACROSS segments (Ace in the Cockpit). Not the economy Perfect Streak." }
        bestPerfectFlightStreak: { type: integer, minimum: 0 }
        hintFreeTripStreak: { type: integer, minimum: 0 }
        bestHintFreeTripStreak: { type: integer, minimum: 0 }
        nightTrips: { type: integer, minimum: 0 }
        goArounds: { type: integer, minimum: 0 }
        previousTripOutcome:
          oneOf:
            - { $ref: "#/components/schemas/FlightSegmentOutcome" }
            - { type: "null" }
    Logbook:
      type: object
      additionalProperties: false
      required: [version, recentTrips, daily, lifetime, counters, clipperCards, fieldAwards]
      properties:
        version: { type: integer, minimum: 1, description: "The Logbook's own counter (players.logbook_version): NOT Progress.version. Rises when a Round is banked or a Trip completed; 1 for a player who has done neither." }
        recentTrips:
          type: array
          maxItems: 20
          description: The last 20 completed segments, newest first.
          items: { $ref: "#/components/schemas/LogbookTripRow" }
        daily: { $ref: "#/components/schemas/DailyLog" }
        lifetime: { $ref: "#/components/schemas/LifetimeTotals" }
        counters: { $ref: "#/components/schemas/AwardCounters" }
        clipperCards:
          type: array
          description: Every collected Card, oldest first.
          items: { $ref: "#/components/schemas/ClipperCardRecord" }
        fieldAwards: { $ref: "#/components/schemas/FieldAwardBoard" }
    LogbookEnvelope:
      type: object
      additionalProperties: false
      required: [logbook]
      properties:
        logbook: { $ref: "#/components/schemas/Logbook" }

    ContentDocumentName:
      type: string
      enum: [field-awards, clipper-cards, aircraft-tags]
    ManifestModule:
      type: object
      additionalProperties: false
      required: [id, enabled, contentVersion, assetBundleUrl]
      description: Unity `ApiWireModels.ModuleWire`, unchanged names and types.
      properties:
        id: { $ref: "#/components/schemas/ModuleId" }
        enabled: { type: boolean, const: true, description: Always true; Remote Config is the kill switch. }
        contentVersion:
          description: Null until content releases exist (5.2+).
          oneOf:
            - { $ref: "#/components/schemas/ContentVersion" }
            - { type: "null" }
        assetBundleUrl:
          description: Null until content releases exist (CCD/Bunny).
          oneOf:
            - { type: string }
            - { type: "null" }
    ManifestDocument:
      type: object
      additionalProperties: false
      required: [name, format, version, sha256, byteSize, url]
      properties:
        name: { $ref: "#/components/schemas/ContentDocumentName" }
        format: { type: string, enum: [field-awards.v1, clipper-cards.v1, aircraft-tags.v1] }
        version: { type: integer, minimum: 1, description: Goes up by one with every published change of this document. }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: Of the exact response bytes. }
        byteSize: { type: integer, minimum: 1 }
        url: { type: string, description: "Relative path: /v1/content/documents/{name}/{version}." }
    ContentManifest:
      type: object
      additionalProperties: false
      required: [version, generatedAtUtc, modules, documents]
      description: Unity `ApiWireModels.ManifestWire` plus `documents`.
      properties:
        version: { type: string, pattern: "^[A-Za-z0-9._:+-]{1,80}$", description: Opaque; changes whenever any entry changes. Also the ETag. }
        generatedAtUtc: { type: string, format: date-time }
        modules:
          type: array
          items: { $ref: "#/components/schemas/ManifestModule" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/ManifestDocument" }

    FieldAwardRuling:
      type: object
      additionalProperties: false
      required: [field, text, source, status]
      description: A client ruling or a reviewer note on the sheet row (the snapshot's `appliedEdits`).
      properties:
        field: { type: string }
        text: { type: string }
        source: { type: string, description: "e.g. client ruling 2026-10-28 (WhatsApp)" }
        status: { type: string, enum: [confirmed, resolved, to-confirm] }
    FieldAwardDefinition:
      type: object
      additionalProperties: false
      required: [id, sheetId, sheetRow, title, criteria, thresholdCell, target, metric, hidden, rulings]
      properties:
        id: { $ref: "#/components/schemas/FieldAwardId" }
        sheetId: { type: string, description: "The id in the sheet snapshot (field-awards.json), for traceability." }
        sheetRow: { type: integer, minimum: 2 }
        title: { type: string, minLength: 1, description: "The sheet's Name, verbatim." }
        criteria: { type: string, minLength: 1, description: "The sheet's Criteria, verbatim." }
        thresholdCell: { type: string, description: "The sheet's threshold cell, verbatim (e.g. `50 unique airfract`)." }
        target: { type: integer, minimum: 1, description: "The numeric target from the threshold cell and the client's rulings." }
        metric: { $ref: "#/components/schemas/FieldAwardMetric" }
        hidden: { type: boolean, description: 'A hidden award shows as a locked "?" until earned. None is hidden in Field Awards #1.' }
        rulings:
          type: array
          items: { $ref: "#/components/schemas/FieldAwardRuling" }
    FieldAwardCatalogDocument:
      type: object
      additionalProperties: false
      required: [format, version, source, awards]
      description: The Field Award catalog (C12). Field Awards pay no Miles or Status Points.
      properties:
        format: { type: string, const: field-awards.v1 }
        version: { type: integer, minimum: 1 }
        source:
          type: object
          additionalProperties: false
          required: [file, sha256, importDate]
          properties:
            file: { type: string, description: "Field Awards #1.xlsx" }
            sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
            importDate: { $ref: "#/components/schemas/LocalDate" }
        awards:
          type: array
          minItems: 1
          description: In sheet order. Each FieldAwardId appears once.
          items: { $ref: "#/components/schemas/FieldAwardDefinition" }

    ClipperCardDefinition:
      type: object
      additionalProperties: false
      required: [key, module, name, keySource, itemIds]
      properties:
        key:
          type: string
          minLength: 1
          description: |
            The Card identity. Commercial (`identifier`): the Unity aircraft family (`787`). Military: `mil:` plus the
            client's answer text normalised (trimmed, case-folded, runs of whitespace collapsed to one space, contract
            round 2), so repeated rows of one answer (Eurofighter Typhoon x3) share one Card and variants stay separate until the
            client supplies a family mapping.
        module: { $ref: "#/components/schemas/ModuleId" }
        name: { type: string, minLength: 1, description: "Display name: the family name, or the answer text as the client supplied it (first in natural id order)." }
        keySource: { type: string, enum: [unity_family, client_answer_text] }
        itemIds:
          type: array
          description: Content item ids that collect this Card (Military `mil-a4`, `mil-a8`, `mil-a26` for the Typhoon).
          items: { type: string }
    ClipperCardCatalogDocument:
      type: object
      additionalProperties: false
      required: [format, version, cards]
      properties:
        format: { type: string, const: clipper-cards.v1 }
        version: { type: integer, minimum: 1 }
        cards:
          type: array
          items: { $ref: "#/components/schemas/ClipperCardDefinition" }

    AircraftTag:
      type: string
      enum: [quad-engine, regional-jet, fighter-attack, military-rotary, vtol, piston, heavy]
      description: Unity `AircraftTag` flags, kebab-case.
    TagSource:
      type: string
      enum: [client_sheet, client_ruling, provisional]
      description: "`provisional`: authored by us (Unity `AircraftTags.cs`), pending the client's attribute grid."
    AircraftTagEntry:
      type: object
      additionalProperties: false
      required: [cardKey, manufacturer, manufacturerSource, tags]
      properties:
        cardKey: { type: string, minLength: 1 }
        manufacturer:
          description: '"Boeing", "Airbus", ... or null. Feeds The Great Rivalry.'
          oneOf:
            - { type: string, minLength: 1 }
            - { type: "null" }
        manufacturerSource:
          oneOf:
            - { $ref: "#/components/schemas/TagSource" }
            - { type: "null" }
        tags:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [tag, source]
            properties:
              tag: { $ref: "#/components/schemas/AircraftTag" }
              source: { $ref: "#/components/schemas/TagSource" }
    AircraftTagDocument:
      type: object
      additionalProperties: false
      required: [format, version, entries]
      description: What the tag-based Field Awards count. Keyed by Card key; one entry per tagged Card.
      properties:
        format: { type: string, const: aircraft-tags.v1 }
        version: { type: integer, minimum: 1 }
        entries:
          type: array
          items: { $ref: "#/components/schemas/AircraftTagEntry" }

    # ---------------------------------------------------------------------------------------------------------
    # Media pipeline schemas (plan T0, docs/plans/media-pipeline.md, ADR-0001, ADR-0002). Served: MediaItem, MediaVersion and
    # MediaLicence (0.14.0), with plan T4 MediaEditRequest, MediaLicenceUpdate and MediaRevisionRequest, and with plan T5 ImageRef, MediaDetail and MediaList, and with plan T7 MediaImages. Shapes follow the committed media tables (migration 0017).
    # ---------------------------------------------------------------------------------------------------------

    MediaId:
      type: string
      pattern: "^med-[1-9][0-9]{0,14}$"
      description: |
        `med-<n>`, n the identity of the item (no leading zero, at most 15 digits so it stays a JavaScript-safe integer). Parsed
        strictly; anything else is 404 `not_found` in a path and 400 `invalid_request` in a query or body.
    MediaState:
      type: string
      enum: [unverified, published, withdrawn]
      description: |
        `unverified`: uploaded, never published. `published`: exactly while `publishedVersion` is set; players and the website see
        only these. `withdrawn`: taken down by an admin (it can be published again; the owner and admins may still add versions and
        edit the draft licence).
    MediaContentType:
      type: string
      enum: [image/jpeg, image/png]
    MediaLicence:
      type: object
      additionalProperties: false
      required: [credit, licenceName, licenceUrl, sourceUrl, attributionText, creditRequired]
      description: |
        The licence of ONE file version (a published credit is frozen with its file). Any field except `creditRequired` is null
        until a staff member fills it in. A version can be published only with a `licenceName` and, when `creditRequired`, a `credit`
        (422 `content_invalid` otherwise).
      properties:
        credit: { type: [string, "null"], minLength: 1, maxLength: 200, description: The photographer or rights holder to credit. }
        licenceName: { type: [string, "null"], minLength: 1, maxLength: 200 }
        licenceUrl: { type: [string, "null"], maxLength: 2048, pattern: "^https?://" }
        sourceUrl: { type: [string, "null"], maxLength: 2048, pattern: "^https?://" }
        attributionText: { type: [string, "null"], maxLength: 1000 }
        creditRequired: { type: boolean }
    MediaLicenceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        A partial licence edit. A key that is absent keeps the stored value; `null` clears it (`creditRequired` cannot be null).
        Only an admin may change `creditRequired` (a photographer gets 403 `forbidden`; sending the stored value is fine).
        Text is trimmed and kept verbatim otherwise; control characters are refused (400). URLs must start with `http://` or
        `https://` and are at most 2048 characters.
      properties:
        credit: { type: [string, "null"], minLength: 1, maxLength: 200 }
        licenceName: { type: [string, "null"], minLength: 1, maxLength: 200 }
        licenceUrl: { type: [string, "null"], maxLength: 2048, pattern: "^https?://" }
        sourceUrl: { type: [string, "null"], maxLength: 2048, pattern: "^https?://" }
        attributionText: { type: [string, "null"], maxLength: 1000 }
        creditRequired: { type: boolean }
    MediaRights:
      type: object
      additionalProperties: false
      required: [statement, statedAt]
      description: |
        The uploader's rights statement for one file version (staff views only; never in an `ImageRef`). `statedBy` (the stater's
        principal) is present ONLY in responses to a caller who holds the `admin` role.
      properties:
        statement:
          type: string
          enum: [v1_own, v1_authorised, d1_private_review]
          description: |
            `v1_own` and `v1_authorised` are stated through the API (wording v1). `d1_private_review` marks a photo imported from the
            old website review queue; it cannot be published until the owner states `v1_own` or `v1_authorised` (`PUT .../rights`).
        statedAt: { type: string, format: date-time, description: Database time of the statement (for an import, the source's creation time). }
        statedBy: { type: string, minLength: 1, maxLength: 256, description: Admin callers only; absent otherwise. }
    MediaRightsRequest:
      type: object
      additionalProperties: false
      required: [revision, statement]
      properties:
        revision: { type: integer, minimum: 1, maximum: 2147483647 }
        statement: { type: string, enum: [v1_own, v1_authorised] }
    MediaVersion:
      type: object
      additionalProperties: false
      required: [version, sha256, contentType, byteSize, width, height, licence, description, rights, publishedAt, createdAt]
      description: |
        One uploaded file of a media item, with its own licence. The storage path is never returned. Two versions may share the same
        file: a licence edit on a published item creates a new version (version + 1) with the same sha256, type, size and dimensions.
      properties:
        version: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: Digest of the file bytes. }
        contentType: { $ref: "#/components/schemas/MediaContentType" }
        byteSize: { type: integer, minimum: 1, maximum: 5242880 }
        width: { type: integer, minimum: 1, maximum: 4096 }
        height: { type: integer, minimum: 1, maximum: 4096 }
        licence: { $ref: "#/components/schemas/MediaLicence" }
        description: { type: [string, "null"], minLength: 1, maxLength: 2000, description: Staff-only photo description; newlines allowed. Never in an `ImageRef`. }
        rights:
          oneOf: [{ $ref: "#/components/schemas/MediaRights" }, { type: "null" }]
          description: The rights statement; null only for versions from before statements existed (migration 0019).
        publishedAt: { type: [string, "null"], format: date-time, description: When this version first went live (kept when it is withdrawn and published again); null if it never did. }
        createdAt: { type: string, format: date-time }
    MediaItem:
      type: object
      additionalProperties: false
      required: [id, state, revision, draftVersion, publishedVersion, draft, createdAt, updatedAt]
      description: |
        One image. `revision` (>= 1) is the optimistic fence for EVERY write to the item (new version, licence edit, publish,
        withdraw): send the value you read, a stale one is 409 `version_conflict`. `draftVersion` is the latest version (a new
        upload, or a licence edit made while the draft equals the published version); `publishedVersion` is what players see (null
        unless `state` is `published`) and stays live, with its credit, until an admin publishes the change.

        `owner` (the uploader's principal) is present ONLY in responses to a caller who holds the `admin` role; for any other caller
        the key is absent. It is never in `GET /v1/media`.
      properties:
        id: { $ref: "#/components/schemas/MediaId" }
        state: { $ref: "#/components/schemas/MediaState" }
        revision: { type: integer, minimum: 1 }
        draftVersion: { type: integer, minimum: 1 }
        publishedVersion: { type: [integer, "null"], minimum: 1 }
        draft: { $ref: "#/components/schemas/MediaVersion" }
        owner: { type: string, minLength: 1, maxLength: 256, description: Admin callers only; absent otherwise. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ImageRef:
      description: |
        A reference to one published or previewed file version. `url` and `expiresAt` are BOTH set (a signed, expiring CDN link,
        `expiresAt` the signed expiry in whole seconds) or BOTH null, in which case `reason` says why (`cdn_not_configured`: the
        server has no CDN host or signing key, as on a local run). `reason` is null exactly when `url` is set. Verify the file against
        `sha256`; the link may be cached until `expiresAt` and then asked for again.
      oneOf:
        - type: object
          additionalProperties: false
          required: [mediaId, version, sha256, url, expiresAt, reason, contentType, width, height, licence]
          properties:
            mediaId: { $ref: "#/components/schemas/MediaId" }
            version: { type: integer, minimum: 1 }
            sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
            url: { type: string, format: uri }
            expiresAt: { type: string, format: date-time }
            reason: { type: "null" }
            contentType: { $ref: "#/components/schemas/MediaContentType" }
            width: { type: integer, minimum: 1, maximum: 4096 }
            height: { type: integer, minimum: 1, maximum: 4096 }
            licence: { $ref: "#/components/schemas/MediaLicence" }
        - type: object
          additionalProperties: false
          required: [mediaId, version, sha256, url, expiresAt, reason, contentType, width, height, licence]
          properties:
            mediaId: { $ref: "#/components/schemas/MediaId" }
            version: { type: integer, minimum: 1 }
            sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
            url: { type: "null" }
            expiresAt: { type: "null" }
            reason: { type: string, enum: [cdn_not_configured] }
            contentType: { $ref: "#/components/schemas/MediaContentType" }
            width: { type: integer, minimum: 1, maximum: 4096 }
            height: { type: integer, minimum: 1, maximum: 4096 }
            licence: { $ref: "#/components/schemas/MediaLicence" }
    MediaDetail:
      type: object
      additionalProperties: false
      required: [item, versions, preview]
      properties:
        item: { $ref: "#/components/schemas/MediaItem" }
        versions:
          type: array
          description: Every version, oldest first.
          items: { $ref: "#/components/schemas/MediaVersion" }
        preview:
          description: The draft version, signed in any state (for staff review).
          $ref: "#/components/schemas/ImageRef"
    MediaList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MediaItem" } }
        nextCursor: { type: [string, "null"], description: Opaque. Null on the last page. }
    MediaImages:
      type: object
      additionalProperties: false
      required: [images]
      properties:
        images:
          type: array
          maxItems: 50
          description: One `ImageRef` (the published version) per requested id that is published, in request order, duplicates collapsed. Others are absent.
          items: { $ref: "#/components/schemas/ImageRef" }
    MediaRevisionRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1, maximum: 2147483647, description: The item's `revision` as the caller read it. }
    MediaEditRequest:
      type: object
      additionalProperties: false
      required: [revision]
      anyOf:
        - required: [licence]
        - required: [description]
      description: |
        Edits the DRAFT version's licence and/or description; the published version and its credit stay live until an admin publishes.
        At least one of `licence` and `description` is required: `{ revision }` alone and `{ revision, note }` are 400. When the draft equals the published version the edit
        creates a new draft version (same file, version + 1); otherwise it edits the draft in place, except that a draft which was live once (an item now withdrawn) gets
        version + 1 as well. `note` goes to the audit row only.
      properties:
        revision: { type: integer, minimum: 1, maximum: 2147483647 }
        licence: { $ref: "#/components/schemas/MediaLicenceUpdate" }
        description:
          type: [string, "null"]
          maxLength: 2000
          description: CRLF becomes LF; newlines are the only control characters allowed (any other, leading or trailing included, is 400); then trimmed to 1 to 2000 code points. `null` clears it.
        note: { type: string, minLength: 1, maxLength: 500 }
    ContentItemMediaRequest:
      type: object
      additionalProperties: false
      required: [mediaId, expectedVersion]
      properties:
        mediaId:
          description: The image to link; null removes the link.
          oneOf: [{ $ref: "#/components/schemas/MediaId" }, { type: "null" }]
        expectedVersion: { type: integer, minimum: 1, description: The content item `version` the caller read. }
