        "404": { $ref: "#/components/responses/RoleRowNotFound" }
        "409": { $ref: "#/components/responses/RoleVersionConflict" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/accounts/{principal}/roles/admin/email:
    put:
      tags: [roles, admin]
      operationId: editAdminEmail
      summary: Correct or clear an admin's typed email
      description: |
        Sets (or with `email: null` clears) the typed email of an `active` or `revoked` admin row. The email is typed by an
        admin: unverified, display only, never used for authorisation; it is trimmed and lowercased and must have one `@` and
        3 to 320 characters (otherwise 400). Fenced by `revision`; a change bumps `revision` and writes one `role_email_edit`
        audit row (`detail`: role, from and to state and revision, `emailChanged: true`; never the email). An unchanged value is
        a 200 no-op (nothing written). No admin row is 404; a different `revision` is 409 `version_conflict`.
        Admin only, re-checked under the role lock. Exempt from the client version gate.
      parameters:
        - $ref: "#/components/parameters/AccountPrincipal"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminEmailEditRequest" }
      responses:
        "200":
          description: The row as it is now.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRoleEnvelope" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/RoleRowNotFound" }
        "409": { $ref: "#/components/responses/RoleVersionConflict" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/content/{module}/imports:
    post:
      tags: [admin]
      operationId: importContent
      summary: Import a content spreadsheet
      description: |
        Admin only. The body is the raw `.xlsx` (Content-Type
        `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`, at most 5 MB; also bounded when
        unpacked). The first worksheet is read. Only modules with a mapping can be imported (today
        `aircraft-identifier-military` and `airport-spotter`); any other module is 404 `not_found`.

        `airport-spotter` (sheet "Airport Spotter v1.xlsx", columns LEVEL, Correct Airport, Wrong Airport 1-3, File
        name): items are `apt-a<N>` in sheet order, natural key = the `File name` value, payload
        `{ answer, wrong[3], sourceFile }` (3-letter IATA codes, upper-cased, all four distinct; no airport names and
        no photographer are stored). A client sheet import applies a fixed table of seven named corrections
        (rows 9, 17, 21, 24, 32, 40, 44 of the v1 sheet; user ruling 2026-11-03) and reports each as a `warnings`
        entry naming the original and corrected value; a correction fires only while the row still holds that
        original value. Anything else wrong is a row error. The sheet as delivered embeds photos (13 MB) and is
        over the upload cap: re-save it without the pictures first.

        Two kinds of file. A **client sheet** has no `Id` column (the client's own spreadsheet) and is
        authoritative: each row is matched to a stored item by its natural key (Military: the trimmed `file`
        value, exact match); unmatched rows are created with the next free id (`mil-a<highest + 1>`, in sheet
        order; into an empty module that is simply row order, `mil-a1`...); a matched row whose rank or data
        differ is updated (version + 1, source `client_sheet`); stored items the file no longer lists are
        retired (status `retired`, version + 1); a retired item listed again comes back as `approved`. A missing
        or repeated `file` value is a row error, into an empty module too (never guessed). An **admin
        export** has an `Id` column (our export, edited): the id is the identity; without a `Version` a new
        id is created, identical content is unchanged and different content is a conflict; with a `Version`
        the id must exist at exactly that version, then it is updated (version + 1, source `admin`) or
        unchanged. It never retires anything, and its `Status` column is ignored. Any row error or conflict is
        422 `import_invalid` with a row `report`, and nothing is written.

        `dryRun=true` returns the plan (200: counts, per-row actions, a field-level `diff` for each updated
        row, the retirements, and a `planHash`) and writes and stores nothing. A client-sheet import that
        would update or retire anything must be applied with `confirm=<planHash>` from a dry run of the same
        file: without it the answer is 422 `import_invalid` (do a dry run first); if stored content changed
        since the dry run it is 409 `plan_changed` and nothing is written. Creates-only imports and
        admin-export imports need no confirm. Otherwise the original file is stored in file storage
        (content-addressed by sha256, kept) and the rows are written in one transaction: 201 with the
        receipt. Identical bytes replay the earlier receipt first, but only while that receipt is
        the module's latest import and no item of the module has been edited, retired or restored since: 200 with
        `replayed: true` and no writes, so a retry is safe. After a staff edit, retire or restore the same client sheet
        is planned like any other file, so uploading it again restores the client's data (a retired item it lists
        returns to `approved`; an update needs `confirm`). Once a later
        import exists the same bytes are planned like any other file (a stale export is a conflict). A dry run
        of bytes that would replay answers `replay: true` with the receipt only. File storage down is 503 `storage_unavailable`
        (nothing written). Imported rows are `approved`; nothing reaches players.
      parameters:
        - $ref: "#/components/parameters/ContentModule"
        - name: dryRun
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"], default: "false" }
        - name: confirm
          in: query
          required: false
          description: |
            The `planHash` of a dry run of the same file. Required to apply a client sheet that would update or
            retire stored items; not accepted together with `dryRun=true`.
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
        - name: X-File-Name
          in: header
          required: false
          description: Original file name for the receipt. Sanitised and cut to 200 characters; never used as a path.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: A dry-run plan, a dry run that would replay the latest import, or a replay of it.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ImportDryRun" }
                  - { $ref: "#/components/schemas/ImportDryRunReplay" }
                  - { $ref: "#/components/schemas/ImportReplayed" }
        "201":
          description: Imported.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportApplied" }
        "400":
          description: |
            Not an `.xlsx` (wrong content type, unreadable, no header row), a bad `dryRun` or `confirm`, or too
            large once unpacked or too many rows or columns.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [invalid_request]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownRoute" }
        "409":
          description: |
            `plan_changed`: the `confirm` hash no longer matches the plan, because stored content changed since
            the dry run. Nothing was written; run a new dry run. `import_in_progress`: another import for this
            module is running right now; nothing was written, retry after `Retry-After` seconds (that response
            only).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          x-error-codes: [plan_changed, import_in_progress]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Upload over 5 MB.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [invalid_request]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            At least one row has an error or a conflict (with a `report`), or a client sheet that would update
            or retire stored items was applied without `confirm` (no report; do a dry run first). Nothing was
            written. Also returned by `dryRun`.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [import_invalid]
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ImportInvalid" }
                  - { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: |
            `storage_unavailable`: file storage is down, not configured, or refused the upload (nothing
            written). Also `auth_unavailable` and `service_unavailable`. All carry `Retry-After` except a
            storage refusal that a retry will not fix (bad credentials), which has none.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          x-error-codes: [auth_unavailable, service_unavailable, storage_unavailable]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/admin/content/{module}/trip-coverage:
    post:
      tags: [admin]
      operationId: contentTripCoverage
      summary: Trip coverage of a module's content
      description: |
        Admin only. For each rank, how many Flights a Trip would hold if dealt from the module's **approved**
        items (draft or retired items are not counted), capped at `flightsPerTrip`; below that the content
        cannot fill a Trip at that rank. Computed by the same dealer the dealer contract publishes, under the
        module's deal policy, over the items in natural id order. An item without a photo (blank `sourceFile`
        for Military) is not dealable. Read-only; answers 200, not 201.

        `itemIds` (optional, at most 2000, each 1 to 64 characters) restricts the count to those items, for
        "what if only these were live". A repeated id counts once. An id the module does not store at all is
        422 `unknown_item_ids` and nothing is computed; a stored id that is not approved is not counted. An
        empty body, `{}` and `{ "itemIds": [] }` are valid (the last counts nothing). Any other field is 400.

        Only modules with a content mapping AND a deal policy answer (today `aircraft-identifier-military`);
        any other module is 404 `not_found` (`airport-spotter` is importable but has no deal policy yet, so it is
        404 here). Order of checks: auth (401, 403), body size (413), body validation
        (400, then 415), and only then the module (404): a bad body for an unmapped module is 400, not 404.
      parameters:
        - $ref: "#/components/parameters/ContentModule"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripCoverageRequest" }
      responses:
        "200":
          description: Coverage per rank, in rank order.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripCoverage" }
        "400":
          description: Unknown field, `itemIds` not an array of 1 to 64 character strings, or more than 2000 ids.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [invalid_request]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownRoute" }
        "413":
          description: |
            Body too large. This route's limit is 160 KB (not the 16 KB of other routes), but it applies only to a
            caller whose Bearer token is verified and who holds the `admin` role; a request without a well-formed Bearer header
            is read under the global 16 KB limit and gets this answer above it (a junk token is 401 and a caller without
            the role 403 before the body is read).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [invalid_request]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: A non-empty body whose Content-Type is not `application/json`. It is refused rather than ignored, because its `itemIds` would otherwise silently widen the answer to the whole module.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [invalid_request]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: At least one id in `itemIds` is not stored for this module.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [unknown_item_ids]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/content/{module}/items:
    get:
      tags: [admin]
      operationId: listContentItems
      summary: List content items
      description: |
        Admin only. All items of the module in natural id order (`mil-a2` before `mil-a10`), retired ones
        included (see `status`).
