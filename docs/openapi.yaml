  /v1/admin/accounts/{principal}/roles/photographer/block:
    post:
      tags: [roles, admin]
      operationId: blockPhotographer
      summary: Block an account from the photographer role
      description: |
        A `pending`, `active`, `rejected` or `revoked` photographer row becomes `blocked`: a real, lasting state. A blocked
        account cannot request the role again (403) and, if it was active, loses photographer access on the next request. Audit
        action `role_block`. An account with an `active` admin row cannot be blocked (409; revoke admin first). Blocking a
        `blocked` row is 409. Revoke, approve and reject of a `blocked` row are 409 too.
        Admin only. The acting admin is re-checked under the role lock, so an admin revoked a moment ago gets 403 and nothing is
        written. Fenced by `revision` (the value the caller read): a different `revision`, or a state the move does not start from,
        is 409 `version_conflict` naming the current state and revision; no photographer row is 404. Every change bumps `revision`
        and writes one audit row (`detail`: role, from and to state and revision, note). Answers 200, not 201. Exempt from the
        client version gate.
      parameters:
        - $ref: "#/components/parameters/AccountPrincipal"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleDecisionRequest" }
      responses:
        "200":
          description: The row as it is now.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRoleEnvelope" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
