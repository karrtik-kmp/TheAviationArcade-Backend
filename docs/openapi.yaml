        goAround: { type: boolean, description: "All correct, and the previous completed segment was not (Go Around)." }
        nightTrip: { type: boolean, description: "Completed 22:00 up to 05:00 local (Red-Eye Special). Local = server time of the 10th banked Round + utcOffsetMinutes." }
        bestStreak: { type: integer, minimum: 0, maximum: 10, description: Longest Perfect Streak inside the segment. }
        miles: { type: integer, minimum: 0, description: Miles its Rounds earned. }
