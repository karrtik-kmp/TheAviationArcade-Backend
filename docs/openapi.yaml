        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/RoleRowNotFound" }
        "409": { $ref: "#/components/responses/RoleVersionConflict" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

