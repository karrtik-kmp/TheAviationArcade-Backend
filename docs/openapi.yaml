openapi: 3.1.0
info:
  title: Airplane Games backend API
  version: 0.2.0
  description: |
    Contract for the Unity client. The code is the source of truth; `test/openapi.e2e.test.ts` fails when
    this file and the code drift (routes, error codes, enums, sample responses).

    - Every route except `/v1/health` and `/v1/health/ready` needs `Authorization: Bearer <Firebase ID token>`.
    - Bodies are JSON only, at most 16 KB. Unknown fields are rejected (400 `invalid_request`).
    - Every response carries `X-Request-Id`. `/v1` responses other than `/v1/health` are `Cache-Control: no-store`.
    - Errors share one body, `Error`. Switch on `error.code`, never on `message`.
    - A path or method not listed here is 404 `not_found`.
    - Any route can return 500 `internal_error` for an unexpected server fault.
    - Rate limit: one sliding 60 s window per player (authenticated) or per IP (public routes), shared across routes.
      Both health routes are exempt. Over the limit is 429 `rate_limited` with `Retry-After` (seconds until a
      request would be accepted); there is no extra lockout, so requests succeed again as soon as room frees up.
    - Client version gate: when the server sets a minimum build, a missing, malformed or too-low
      `X-Client-Version` is 426 `client_update_required` (checked before the token). Health routes and `DELETE /v1/me` (account deletion
      must work for outdated clients) are exempt.
    - Retry guidance: 503 and 429 carry `Retry-After` (seconds). Never retry any other 4xx unchanged.
    - Admin routes (`/v1/admin/*`, tag `admin`) are for staff only and are called by the website admin, not the
      app: the verified token email must be on the server allowlist (403 `forbidden` otherwise), and they are
      exempt from the client version gate. The staff import takes the raw `.xlsx` as the body (at most 5 MB),
      not JSON.
servers:
  - url: http://127.0.0.1:3000
    description: Local only. Hosting is not chosen yet.
security:
  - firebaseBearer: []
tags:
  - name: health
  - name: player
  - name: rounds
  - name: shop
  - name: admin

paths:
  /v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness
      description: Public. Does not touch the database. Not rate limited, not version gated.
      security: []
      responses:
        "200":
          description: The process is up.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Liveness" }

  /v1/health/ready:
    get:
      tags: [health]
      operationId: getReady
      summary: Readiness
      description: Public. The database must answer within 2 s. Not version gated and not rate limited (the answer is cached for about 1 s). 503 during shutdown, so load balancers stop routing.
      security: []
      responses:
        "200":
          description: Ready.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/me:
    put:
      tags: [player]
      operationId: signIn
      summary: Sign-in handshake
      description: |
        Call after every Firebase sign-in. Creates the player on first call (201), otherwise 200.
        Idempotent. No request body.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
      responses:
        "200":
          description: Existing player.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressEnvelope" }
        "201":
          description: Player created at zero, with the 5 starter hints.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [player]
      operationId: deleteAccount
      summary: Delete this player's backend data
      description: |
        Account deletion. Erases backend data only; the app deletes the Firebase account itself.
        Idempotent: 204 whether or not a player existed. A later `PUT /v1/me` with a still-valid token starts
        a fresh player at zero. No request body. Exempt from the client version gate (never 426).
      responses:
        "204":
          description: Deleted (or nothing to delete).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/me/progress:
    get:
      tags: [player]
      operationId: getProgress
      summary: Current progress
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
      responses:
        "200":
          description: Progress.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PlayerNotFound" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/me/active-rank:
    put:
      tags: [player]
      operationId: setActiveRank
      summary: Set Active Rank
      description: |
        Dial Active Rank down from Certified Rank (Pleasure Cruise) or back up to it. Above Certified is 403.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetActiveRankRequest" }
      responses:
        "200":
          description: Updated progress.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressEnvelope" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Requested rank is above Certified Rank.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [rank_not_certified]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/PlayerNotFound" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/me/ugs-link:
    put:
      tags: [player]
      operationId: linkUgs
      summary: Link this sign-in to its Unity Gaming Services player
      description: |
        Lets the server mirror this player's progress to Unity Gaming Services (UGS) Cloud Save, where the game
        reads it first (see `UgsMirrorProgress`). Send the UGS player token (`AuthenticationService.Instance.AccessToken`)
        after the game has signed in to UGS with Firebase as the OpenID Connect provider. The server verifies the
        token and then asks UGS which external identity is linked to that UGS player: it must be the Firebase user
        making this request. A client-supplied player id is never accepted and the body cannot name one.

        The mirror is one-way and read-only for the game: the server is the only writer and the game must never write
        progress to UGS. The server stays the authority: prefer `GET /v1/me/progress` whenever the server is
        reachable, and treat the UGS copy as a fallback that can lag the server by seconds to minutes under load.

        201 on the first link. 200 when this player was already linked to that UGS player (answered from the
        server's own record with no call to UGS, so calling this on every launch is cheap), or when it was
        re-pointed to a different UGS player (the old copy is deleted by the server; progress is unchanged).
        Requires a player (`PUT /v1/me` first). 404 `not_found` means this server has the mirror turned off.

        Any other attempt asks UGS for the link proof and counts against 5 per hour per player (429 `rate_limited`
        with `Retry-After`) and a server-wide proof budget (503 `service_unavailable`, `Retry-After: 5`). If the UGS
        player is still recorded against another sign-in that UGS no longer lists as linked, the link moves to this
        player.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UgsLinkRequest" }
      responses:
        "200":
          description: Already linked to this UGS player, or re-pointed to it.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UgsLinkResponse" }
        "201":
          description: Linked. A first mirror write is queued.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UgsLinkResponse" }
        "400":
          description: |
            Malformed or unknown body field, or the UGS token is not acceptable (the message says which check failed,
            for example `UGS token rejected: expired.`). 401 stays reserved for the Firebase token.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [invalid_request]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The UGS player is not linked to this Firebase sign-in (`UGS account is not linked to this sign-in`).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [forbidden]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`player_not_found` (call `PUT /v1/me` first) or `not_found` (the mirror is not enabled on this server)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [player_not_found, not_found]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: That UGS player is already linked to another player, and UGS still lists that player's sign-in as linked.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [ugs_link_conflict]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: |
            `auth_unavailable`: the UGS or Firebase signing keys could not be fetched. `service_unavailable`: the
            database, or UGS (needed for the link proof), is unreachable, or the server-wide link-proof budget is
            spent. Retry later with the same request.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          x-error-codes: [auth_unavailable, service_unavailable]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/rounds:
    post:
      tags: [rounds]
      operationId: startRound
      summary: Issue a Round
      description: |
        Issues a single-use Round at the player's Active Rank and abandons any other open Round
        (its result then fails with 410 `round_closed`). A Round expires 30 minutes after issue.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartRoundRequest" }
      responses:
        "201":
          description: Round issued.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoundEnvelope" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PlayerNotFound" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/rounds/{roundId}/result:
    post:
      tags: [rounds]
      operationId: submitRoundResult
      summary: Score and bank a Round
      description: |
        Reports Round facts; the server computes the award. Resubmitting a banked Round returns the stored
        award with `replayed: true` and pays nothing, so a retry after a dropped response is safe.
        A result sooner than 3 s after issue is 429 `round_too_fast` and leaves the Round open: retry
        after `Retry-After`. A `roundId` that is not a UUID is 404 `round_not_found`.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - name: roundId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoundResultRequest" }
      responses:
        "200":
          description: Banked, or replayed.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoundResultResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not this player's Round (or unknown, or `roundId` is not a UUID).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [round_not_found]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: |
            `round_expired`: the 30 minute window passed. `round_closed`: a newer Round superseded it.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [round_expired, round_closed]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429":
          description: |
            `rate_limited`: over the request limit. `round_too_fast`: result arrived under 3 s after issue.
            Both carry `Retry-After`.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          x-error-codes: [rate_limited, round_too_fast]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/rounds/{roundId}/hint:
    post:
      tags: [rounds]
      operationId: spendRoundHint
      summary: Spend this Round's hint
      description: |
        Spends one Co-Pilot hint on the player's own open, unexpired Round. A Round allows one hint, so this
        is idempotent: when the Round already has its hint the answer is 200 with `replayed: true` and nothing
        is debited (also after the Round was banked or superseded). A paid hint cannot be hidden: the result
        is scored as used even if the client reports `usedHint: false`. No request body. No hints left is 409
        `insufficient_hints`. A Round that is banked or superseded without a hint is 410 `round_closed`.
        A `roundId` that is not a UUID is 404 `round_not_found`. `progress` is the current balance, also on a
        replay; don't derive deltas from it. A spent hint is final: issuing a new Round abandons this one
        without a refund.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - name: roundId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Hint spent, or already spent for this Round (`replayed`).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HintResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not this player's Round (or unknown, or `roundId` is not a UUID).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [round_not_found]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The player has no hints left.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [insufficient_hints]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: |
            `round_expired`: the 30 minute window passed. `round_closed`: the Round was superseded or already banked.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [round_expired, round_closed]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/shop/miles-hint-pack:
    post:
      tags: [shop]
      operationId: buyMilesHintPack
      summary: Buy the hint pack with Miles
      description: |
        Spends 5,000 Miles for 10 hints (client ruling CF-53). Requires an `Idempotency-Key` header (1-128
        characters of letters, digits, `_` and `-`); a missing or malformed key is 400 `invalid_request`.
        The first request with a key buys the pack; any later request with the same key returns the original
        receipt with `replayed: true` and charges nothing, so a retry after a dropped response is safe. A new
        key is a new purchase. Not enough Miles is 409 `insufficient_miles` and records nothing, so the same
        key can buy later: mint a new key per purchase attempt. `progress` is the current balance, also on a
        replay. No request body (an empty object is accepted; any field is 400).
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
      responses:
        "200":
          description: Purchased, or already purchased under this key (`replayed`).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PlayerNotFound" }
        "409":
          description: Fewer than 5,000 Miles.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [insufficient_miles]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/me:
    get:
      tags: [admin]
      operationId: getAdminMe
      summary: Am I staff?
      description: |
        Staff only. Lets the website check access: 200 `{ principal, staff: true }` for a verified token whose
        email is on the server allowlist, 403 `forbidden` for any other signed-in caller. A staff caller needs
        no player row. Exempt from the client version gate.
      responses:
        "200":
          description: The caller is staff.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/content/{module}/imports:
    post:
      tags: [admin]
      operationId: importContent
      summary: Import a content spreadsheet
      description: |
        Staff only. The body is the raw `.xlsx` (Content-Type
        `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`, at most 5 MB; also bounded when
        unpacked). The first worksheet is read. Only modules with a mapping can be imported (today
        `aircraft-identifier-military`); any other module is 404 `not_found`.

        Two kinds of file. A **client sheet** has no `Id` column (the client's own spreadsheet) and is
        authoritative: each row is matched to a stored item by its natural key (Military: the trimmed `file`
        value, exact match); unmatched rows are created with the next free id (`mil-a<highest + 1>`, in sheet
        order; into an empty module that is simply row order, `mil-a1`...); a matched row whose rank or data
        differ is updated (version + 1, source `client_sheet`); stored items the file no longer lists are
        retired (status `retired`, version + 1); a retired item listed again comes back as `approved`. A missing
        or repeated `file` value is a row error, into an empty module too (never guessed). An **admin
        export** has an `Id` column (our export, edited): the id is the identity; without a `Version` a new
        id is created, identical content is unchanged and different content is a conflict; with a `Version`
        the id must exist at exactly that version, then it is updated (version + 1, source `admin`) or
        unchanged. It never retires anything, and its `Status` column is ignored. Any row error or conflict is
        422 `import_invalid` with a row `report`, and nothing is written.

        `dryRun=true` returns the plan (200: counts, per-row actions, a field-level `diff` for each updated
        row, the retirements, and a `planHash`) and writes and stores nothing. A client-sheet import that
        would update or retire anything must be applied with `confirm=<planHash>` from a dry run of the same
        file: without it the answer is 422 `import_invalid` (do a dry run first); if stored content changed
        since the dry run it is 409 `plan_changed` and nothing is written. Creates-only imports and
        admin-export imports need no confirm. Otherwise the original file is stored in file storage
        (content-addressed by sha256, kept) and the rows are written in one transaction: 201 with the
        receipt. Identical bytes replay the earlier receipt first, but only while that receipt is
        the module's latest import: 200 with `replayed: true` and no writes, so a retry is safe. Once a later
        import exists the same bytes are planned like any other file (a stale export is a conflict). A dry run
        of bytes that would replay answers `replay: true` with the receipt only. File storage down is 503 `storage_unavailable`
        (nothing written). Imported rows are `approved`; nothing reaches players.
      parameters:
        - $ref: "#/components/parameters/ContentModule"
        - name: dryRun
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"], default: "false" }
        - name: confirm
          in: query
          required: false
          description: |
            The `planHash` of a dry run of the same file. Required to apply a client sheet that would update or
            retire stored items; not accepted together with `dryRun=true`.
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
        - name: X-File-Name
          in: header
          required: false
          description: Original file name for the receipt. Sanitised and cut to 200 characters; never used as a path.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: A dry-run plan, a dry run that would replay the latest import, or a replay of it.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ImportDryRun" }
                  - { $ref: "#/components/schemas/ImportDryRunReplay" }
                  - { $ref: "#/components/schemas/ImportReplayed" }
        "201":
          description: Imported.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportApplied" }
        "400":
          description: |
            Not an `.xlsx` (wrong content type, unreadable, no header row), a bad `dryRun` or `confirm`, or too
            large once unpacked or too many rows or columns.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [invalid_request]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownRoute" }
        "409":
          description: |
            `plan_changed`: the `confirm` hash no longer matches the plan, because stored content changed since
            the dry run. Nothing was written; run a new dry run. `import_in_progress`: another import for this
            module is running right now; nothing was written, retry after `Retry-After` seconds (that response
            only).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          x-error-codes: [plan_changed, import_in_progress]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Upload over 5 MB.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [invalid_request]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            At least one row has an error or a conflict (with a `report`), or a client sheet that would update
            or retire stored items was applied without `confirm` (no report; do a dry run first). Nothing was
            written. Also returned by `dryRun`.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          x-error-codes: [import_invalid]
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ImportInvalid" }
                  - { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: |
            `storage_unavailable`: file storage is down, not configured, or refused the upload (nothing
            written). Also `auth_unavailable` and `service_unavailable`. All carry `Retry-After` except a
            storage refusal that a retry will not fix (bad credentials), which has none.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          x-error-codes: [auth_unavailable, service_unavailable, storage_unavailable]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/admin/content/{module}/items:
    get:
      tags: [admin]
      operationId: listContentItems
      summary: List content items
      description: |
        Staff only. All items of the module in natural id order (`mil-a2` before `mil-a10`), retired ones
        included (see `status`).
      parameters:
        - $ref: "#/components/parameters/ContentModule"
      responses:
        "200":
          description: Items.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentItemList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownRoute" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/content/{module}/export:
    get:
      tags: [admin]
      operationId: exportContent
      summary: Export content as a spreadsheet
      description: |
        Staff only. An `.xlsx` with columns `Id, Version, Level, Correct Answer, Wrong Answer 1, Wrong Answer 2,
        Wrong Answer 3, file, Photographer, Status` (Level in the client wording), natural id order, retired
        items included (`Status` is `approved` or `retired`). Edit it and import it again: the `Version`
        column makes the import an edit of exactly that version. The `Status` column is informational and is
        ignored on import; an export never retires anything.
      parameters:
        - $ref: "#/components/parameters/ContentModule"
      responses:
        "200":
          description: The spreadsheet.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Content-Disposition:
              description: '`attachment; filename="<module>-<YYYY-MM-DD>.xlsx"`.'
              schema: { type: string }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownRoute" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
      description: |
        Firebase ID token (email/password or Google). The server derives the player from the verified token
        only; no ID, role or name is ever read from a request.

  parameters:
    XClientVersion:
      name: X-Client-Version
      in: header
      required: false
      description: |
        App build number, a positive integer of at most 9 digits. Required in practice once the server sets a
        minimum build (otherwise 426).
      schema: { type: string, pattern: "^[1-9][0-9]{0,8}$" }

    ContentModule:
      name: module
      in: path
      required: true
      description: A module ID. Only modules with an import mapping are served (today `aircraft-identifier-military`); others are 404.
      schema: { $ref: "#/components/schemas/ModuleId" }

  headers:
    XRequestId:
      description: Request correlation id. Quote it in bug reports. Also echoed as `error.requestId` on errors.
      schema: { type: string }
    NoStore:
      description: Always `no-store`.
      schema: { type: string, const: no-store }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: string, pattern: "^[0-9]+$" }
    WWWAuthenticate:
      description: Always `Bearer`.
      schema: { type: string, const: Bearer }

  responses:
    InvalidRequest:
      description: Malformed JSON, wrong field type or range, or an unknown field.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [invalid_request]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BodyRejected:
      description: Body over 16 KB (413) or unsupported charset or encoding (415). Same body shape as 400.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [invalid_request]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, malformed, expired or wrongly issued token.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        WWW-Authenticate: { $ref: "#/components/headers/WWWAuthenticate" }
      x-error-codes: [unauthorized]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PlayerNotFound:
      description: No player yet. Call `PUT /v1/me` first.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [player_not_found]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Signed in, but not staff (the verified token email is not on the server allowlist).
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [forbidden]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnknownRoute:
      description: Any path or method not in this document. Not attached to a route.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      x-error-codes: [not_found]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ClientUpdateRequired:
      description: |
        `X-Client-Version` missing, malformed or below the server's minimum build. Show an update prompt.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [client_update_required]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Over the request limit. Wait `Retry-After` seconds.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      x-error-codes: [rate_limited]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: |
        `auth_unavailable`: the Google signing keys could not be fetched (on the UGS link route, the UGS keys too). `service_unavailable`: database
        unreachable or timed out (also readiness failing). Both carry `Retry-After`; retry later with the
        same token and the same request.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      x-error-codes: [auth_unavailable, service_unavailable]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Unexpected server fault. Any route can return it; not attached to individual routes.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      x-error-codes: [internal_error]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Rank:
      type: string
      description: Flight Crew Hierarchy, lowest first.
      enum: [trainee, first-officer, captain, check-airman, chief-pilot]
    ModuleId:
      type: string
      description: Module ID = the Unity ModuleRegistry BackendId. The Military game's final name is a working title.
      enum:
        - airport-spotter
        - atc-match
        - call-sign-match
        - identifier
        - aircraft-identifier-military
        - code-search
        - runway-identifier
        - tail-identifier
    Completion:
      type: string
      enum: [perfect, standard, unfinished]
    Liveness:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ready }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              description: Stable. Switch on this.
              enum:
                - unauthorized
                - forbidden
                - auth_unavailable
                - invalid_request
                - player_not_found
                - round_not_found
                - round_expired
                - round_closed
                - round_too_fast
                - rank_not_certified
                - insufficient_hints
                - insufficient_miles
                - not_found
                - rate_limited
                - client_update_required
                - import_invalid
                - plan_changed
                - import_in_progress
                - ugs_link_conflict
                - storage_unavailable
                - service_unavailable
                - internal_error
            message:
              type: string
              description: For logs, not for display or logic.
            requestId:
              type: string
              description: Same value as the `X-Request-Id` header.
    AdminMe:
      type: object
      additionalProperties: false
      required: [principal, staff]
      properties:
        principal: { type: string, description: "firebase:<projectId>:<uid>" }
        staff: { type: boolean, const: true }
    ContentItem:
      type: object
      additionalProperties: false
      required: [id, rank, status, source, version, data, updatedAt]
      properties:
        id: { type: string, description: "Stable item id, e.g. mil-a5." }
        rank: { $ref: "#/components/schemas/Rank" }
        status: { type: string, enum: [approved, retired] }
        source: { type: string, enum: [client_sheet, admin] }
        version: { type: integer, minimum: 1, description: Bumped by every edit. }
        data:
          type: object
          description: Module payload. Military Aircraft Identifier is `{ answer, wrong[3], sourceFile, photographer }`.
        updatedAt: { type: string, format: date-time }
    ContentItemList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ContentItem" }
    ImportIssue:
      type: object
      additionalProperties: false
      required: [row, level, message]
      properties:
        row: { type: integer, minimum: 1, description: 1-based sheet row. }
        id: { type: string }
        level: { type: string, enum: [error, conflict, warning] }
        message: { type: string }
    ImportCounts:
      type: object
      additionalProperties: false
      required: [created, updated, unchanged, retired]
      properties:
        created: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        retired: { type: integer, minimum: 0, description: Stored items a client sheet no longer lists. }
    ImportSummary:
      type: object
      additionalProperties: false
      required: [id, module, fileName, sha256, byteSize, created, updated, unchanged, retired, createdAt]
      properties:
        id: { type: string, format: uuid }
        module: { $ref: "#/components/schemas/ModuleId" }
        fileName: { type: string }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        byteSize: { type: integer, minimum: 1 }
        created: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        retired: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    ImportDryRun:
      type: object
      additionalProperties: false
      required: [dryRun, replay, kind, counts, planHash, requiresConfirm, rows, retirements, warnings]
      properties:
        dryRun: { type: boolean, const: true }
        replay: { type: boolean, const: false, description: A real import of these bytes would be planned and applied, not replayed. }
        kind:
          type: string
          enum: [client_sheet, admin_export]
          description: A file without an Id column is a client sheet (authoritative); with one it is an admin export.
        counts: { $ref: "#/components/schemas/ImportCounts" }
        planHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: sha256 of the canonical plan. Pass it as `confirm` to apply a plan that has `requiresConfirm`.
        requiresConfirm:
          type: boolean
          description: True for a client sheet that would update or retire stored items.
        rows:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [row, id, action]
            properties:
              row: { type: integer, minimum: 1 }
              id: { type: string }
              action: { type: string, enum: [create, update, unchanged] }
              diff:
                type: array
                description: For an update, each changed field. A retired item coming back shows `status` retired to approved.
                items:
                  type: object
                  additionalProperties: false
                  required: [field, from, to]
                  properties:
                    field: { type: string, description: "e.g. answer, wrong[1], rank, status" }
                    from: {}
                    to: {}
        retirements:
          type: array
          description: Stored items the apply would retire (client sheets only).
          items:
            type: object
            additionalProperties: false
            required: [id, naturalKey]
            properties:
              id: { type: string }
              naturalKey: { type: string, description: "Military: the file name." }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/ImportIssue" }
    ImportDryRunReplay:
      type: object
      additionalProperties: false
      required: [dryRun, replay, import]
      description: A real import of these bytes would replay this receipt (it is the module's latest import).
      properties:
        dryRun: { type: boolean, const: true }
        replay: { type: boolean, const: true }
        import: { $ref: "#/components/schemas/ImportSummary" }
    ImportApplied:
      type: object
      additionalProperties: false
      required: [replayed, import, warnings]
      properties:
        replayed: { type: boolean, const: false }
        import: { $ref: "#/components/schemas/ImportSummary" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/ImportIssue" }
    ImportReplayed:
      type: object
      additionalProperties: false
      required: [replayed, import]
      properties:
        replayed: { type: boolean, const: true }
        import: { $ref: "#/components/schemas/ImportSummary" }
    ImportInvalid:
      type: object
      additionalProperties: false
      required: [error, report]
      properties:
        error: { $ref: "#/components/schemas/Error/properties/error" }
        report:
          type: array
          description: Every problem found, in row order, including warnings. At least one is an error or conflict.
          items: { $ref: "#/components/schemas/ImportIssue" }
    NextRank:
      type: object
      additionalProperties: false
      required: [rank, statusPoints]
      properties:
        rank: { $ref: "#/components/schemas/Rank" }
        statusPoints: { type: integer, minimum: 0, description: Lifetime Status Points needed. }
    Progress:
      type: object
      additionalProperties: false
      required:
        - version
        - statusPoints
        - miles
        - hints
        - certifiedRank
        - activeRank
        - pleasureCruise
        - selectableRanks
        - nextRank
        - perfectStreak
        - firstClassPass
      properties:
        version:
          type: integer
          minimum: 1
          description: |
            The server's player version. It goes up by one with every change visible in this object or in the UGS
            copy (a Round result, a hint spend, a hint pack, a changed Active Rank), so a higher `version` is
            always newer. Compare it with `UgsMirrorProgress.version` to order a server answer against the UGS copy.
        statusPoints: { type: integer, minimum: 0, description: Lifetime Status Points. }
        miles: { type: integer, minimum: 0 }
        hints: { type: integer, minimum: 0, description: Co-Pilot hints left. }
        certifiedRank: { $ref: "#/components/schemas/Rank" }
        activeRank: { $ref: "#/components/schemas/Rank" }
        pleasureCruise:
          type: boolean
          description: True when Active Rank is below Certified Rank.
        selectableRanks:
          type: array
          description: Ranks the player may fly, Certified down to Trainee.
          items: { $ref: "#/components/schemas/Rank" }
        nextRank:
          description: Null at Chief Pilot.
          oneOf:
            - { $ref: "#/components/schemas/NextRank" }
            - { type: "null" }
        perfectStreak: { type: integer, minimum: 0, description: Consecutive Perfect Completions. }
        firstClassPass: { type: boolean }
    ProgressEnvelope:
      type: object
      additionalProperties: false
      required: [progress]
      properties:
        progress: { $ref: "#/components/schemas/Progress" }
    UgsLinkRequest:
      type: object
      additionalProperties: false
      required: [ugsToken]
      properties:
        ugsToken:
          type: string
          minLength: 1
          maxLength: 8000
          description: The UGS player access token. Verified server-side; the player id comes from it, never from the client.
    UgsLinkResponse:
      type: object
      additionalProperties: false
      required: [link]
      properties:
        link:
          type: object
          additionalProperties: false
          required: [linkedAt]
          properties:
            linkedAt: { type: string, format: date-time }
    UgsMirrorProgress:
      type: object
      additionalProperties: false
      description: |
        NOT an API response: the JSON value of the Cloud Save **Protected** item with key `progress`, written by the
        server for each linked player (the player can read their own, only the server can write). Same field names
        and values as `Progress` where they overlap. It is a fallback: prefer the server when it is reachable, and
        expect the copy to lag by seconds to minutes. Never write it. Order two copies, or a copy and a server answer,
        by `version`: it goes up by one with every visible change, Active Rank changes included, and `Progress.version`
        is the same counter.
      required: [schemaVersion, version, statusPoints, miles, hints, perfectStreak, certifiedRank, activeRank, firstClassUntil, updatedAt]
      properties:
        schemaVersion: { type: integer, const: 1 }
        version: { type: integer, minimum: 1, description: "The server's player version at the time of the snapshot." }
        statusPoints: { type: integer, minimum: 0 }
        miles: { type: integer, minimum: 0 }
        hints: { type: integer, minimum: 0, description: Co-Pilot hints left. }
        perfectStreak: { type: integer, minimum: 0 }
        certifiedRank: { $ref: "#/components/schemas/Rank" }
        activeRank: { $ref: "#/components/schemas/Rank" }
        firstClassUntil:
          type: [string, "null"]
          format: date-time
          description: End of the First Class Pass, or null. The pass is active while this is in the future.
        updatedAt: { type: string, format: date-time, description: "Server time of the player's last change." }
    SetActiveRankRequest:
      type: object
      additionalProperties: false
      required: [rank]
      properties:
        rank: { $ref: "#/components/schemas/Rank" }
    StartRoundRequest:
      type: object
      additionalProperties: false
      required: [module]
      properties:
        module: { $ref: "#/components/schemas/ModuleId" }
    IssuedRound:
      type: object
      additionalProperties: false
      required: [roundId, module, rank, pleasureCruise, expiresAt]
      properties:
        roundId: { type: string, format: uuid }
        module: { $ref: "#/components/schemas/ModuleId" }
        rank: { $ref: "#/components/schemas/Rank" }
        pleasureCruise: { type: boolean }
        expiresAt: { type: string, format: date-time }
    RoundEnvelope:
      type: object
      additionalProperties: false
      required: [round]
      properties:
        round: { $ref: "#/components/schemas/IssuedRound" }
    RoundResultRequest:
      type: object
      additionalProperties: false
      required: [finished, errorCount, usedHint, timeRemainingFraction]
      properties:
        finished: { type: boolean }
        errorCount: { type: integer, minimum: 0, maximum: 1000 }
        usedHint: { type: boolean }
        timeRemainingFraction:
          type: number
          minimum: 0
          maximum: 1
          description: Fraction of the timer left at finish.
    Award:
      type: object
      additionalProperties: false
      required: [completion, speedBonus, streakMiles, statusPoints, miles, firstClassPass, pleasureCruise]
      properties:
        completion: { $ref: "#/components/schemas/Completion" }
        speedBonus: { type: boolean }
        streakMiles: { type: integer, minimum: 0 }
        statusPoints: { type: integer, minimum: 0 }
        miles: { type: integer, minimum: 0 }
        firstClassPass: { type: boolean, description: Whether First Class Pass applied to this Round. }
        pleasureCruise: { type: boolean, description: Whether this Round was flown below Certified Rank. }
    Promotion:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: { $ref: "#/components/schemas/Rank" }
        to: { $ref: "#/components/schemas/Rank" }
    RoundResultResponse:
      type: object
      additionalProperties: false
      required: [award, promotion, replayed, progress]
      properties:
        award: { $ref: "#/components/schemas/Award" }
        promotion:
          description: Null unless this Round raised Certified Rank.
          oneOf:
            - { $ref: "#/components/schemas/Promotion" }
            - { type: "null" }
        replayed:
          type: boolean
          description: True when this Round was already banked; nothing was paid again.
        progress: { $ref: "#/components/schemas/Progress" }
    HintReceipt:
      type: object
      additionalProperties: false
      required: [roundId, replayed]
      properties:
        roundId: { type: string, format: uuid }
        replayed:
          type: boolean
          description: True when this Round already had its hint; nothing was debited again.
    HintResponse:
      type: object
      additionalProperties: false
      required: [hint, progress]
      properties:
        hint: { $ref: "#/components/schemas/HintReceipt" }
        progress: { $ref: "#/components/schemas/Progress" }
    PurchaseReceipt:
      type: object
      additionalProperties: false
      required: [hints, priceMiles, replayed]
      properties:
        hints: { type: integer, minimum: 1, description: Hints added by the pack. }
        priceMiles: { type: integer, minimum: 1, description: Miles charged. }
        replayed:
          type: boolean
          description: True when this Idempotency-Key was already billed; nothing was charged again.
    PurchaseResponse:
      type: object
      additionalProperties: false
      required: [purchase, progress]
      properties:
        purchase: { $ref: "#/components/schemas/PurchaseReceipt" }
        progress: { $ref: "#/components/schemas/Progress" }
