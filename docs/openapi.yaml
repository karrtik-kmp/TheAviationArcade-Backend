    StartRoundInSegmentRequest:
      x-planned: true
      type: object
      additionalProperties: false
      required: [tripId]
      description: Planned body of `POST /v1/rounds` (T2). Module, rank and Pleasure Cruise come from the segment.
      properties:
        tripId: { type: string, format: uuid }

    RoundResultWithFlightFactsRequest:
      x-planned: true
      type: object
      additionalProperties: false
      required: [finished, errorCount, usedHint, timeRemainingFraction, aircraftKey, answerMs, attempts]
      description: |
        Planned body of `POST /v1/rounds/{roundId}/result` (T2): today's Round facts plus the Flight facts (ADR-0008 §2).
        Module rules (400 `invalid_request` when broken):
        - `identifier`: `aircraftKey` is the Unity aircraft family of the Flight's correct answer (the `family` of the
          question in `identifier_questions.json`, e.g. `787`, `A320`), required, also on a timeout.
        - `aircraft-identifier-military`: `aircraftKey` is the content item id of the question (`mil-a4`), required;
          the server maps it to the client's answer text and from that to the Card key (see `ClipperCardDefinition`).
          An id the content store does not hold is rejected. PROPOSED: the alternative is sending the answer text
          (design doc, open question U3).
        - every other module: `aircraftKey` is null.
        - `attempts` >= `errorCount`, and >= 1 when `finished`.
        - `answerMs` may not exceed the server's own issue-to-result time by more than 2,000 ms.
      properties:
        finished: { type: boolean, description: "Answered correctly (Unity FlightEnd.Solved). A second try or a hint still counts." }
        errorCount: { type: integer, minimum: 0, maximum: 1000 }
        usedHint: { type: boolean }
        timeRemainingFraction: { type: number, minimum: 0, maximum: 1 }
        aircraftKey:
          description: The aircraft the Flight showed (see the module rules above).
          oneOf:
            - { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }
            - { type: "null" }
        answerMs:
          type: integer
          minimum: 0
          maximum: 1800000
          description: Milliseconds from the deal to the settle on the device (the clock the player saw). Feeds Bogey Identified.
        attempts:
          type: integer
          minimum: 0
          maximum: 1000
          description: Answers submitted in this Flight, the correct one included.

    HintGrant:
      x-planned: true
      type: object
      additionalProperties: false
      required: [kind, hints, ref]
      description: Hints the server granted (Unity `HintBank`). Each is one `hint_ledger` row, idempotent on (kind, ref).
      properties:
        kind:
          type: string
          enum: [trip_grant, day_streak_grant]
          description: "`trip_grant`: every 4th completed Flight Segment (ref = tripId). `day_streak_grant`: every 7th consecutive local day with a banked Round (ref = that local date)."
        hints: { type: integer, minimum: 1 }
