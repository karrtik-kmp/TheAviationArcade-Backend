  /v1/admin/role-requests:
    get:
      tags: [roles, admin]
      operationId: listRoleRequests
      summary: Role queue
      description: |
        Admin only. `photographer` and `admin` rows in one `state` (default `pending`), oldest request first (then principal,
        role). `limit` is 1 to 100 (default 50). `nextCursor` is opaque; pass it back as `cursor` for the next page, `null` on the
        last. `?state=blocked` lists blocked photographer rows (by their original request time). Shows `requestEmail` for
        photographer rows and `grantEmail` for admin rows (`email` and `emailSource` say which one an admin screen shows).
        Exempt from the client version gate.
      parameters:
        - name: state
          in: query
          required: false
          schema: { $ref: "#/components/schemas/RoleState" }
        - name: cursor
          in: query
          required: false
          description: Opaque; only a `nextCursor` this route returned is accepted (otherwise 400).
          schema: { type: string, minLength: 1, maxLength: 700 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: A page of rows.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleRequestList" }
