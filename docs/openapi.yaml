openapi: 3.1.0
info:
  title: Airplane Games backend API
  version: 0.20.0
  description: |
    Contract for the Unity client. The code is the source of truth; `test/openapi.e2e.test.ts` fails when
    this file and the code drift (routes, error codes, enums, sample responses).

    **Changelog 0.20.0 (purchases, wave P; docs/plans/purchases.md, docs/briefs/commerce.md).** Built: `POST /v1/purchases`, `GET /v1/me/entitlements`, `GET /v1/store/products`, the
    staff catalog `GET /v1/admin/store/products`, `PUT .../{productId}`, `POST .../{productId}/retire` and `.../restore`, and, still `x-planned` (wave P4),
    the Apple and Google store-notification webhooks. New schemas `StorePurchaseRequest`, `StorePurchaseResponse`, `Entitlements`, the
    store product schemas; new error codes `store_unavailable`, `purchase_invalid`, `purchase_revoked`, `purchase_owned_by_other`. Store verification runs on the fake verifier only (local/test; `STORE_VERIFIER=none` answers 503
    `store_unavailable`) until the Apple and Google adapters land (P2, P3). The store reference is the idempotency key. Every purchase outcome says whether the app finishes
    the store transaction or keeps it pending (table on `POST /v1/purchases`). A purchase with no account token is owned by the first
    verified caller. The First Class +50% stays on in the backend: a Pass bought here makes it live (`progress.firstClassPass`).

    **Changelog 0.19.0 (staff media; breaking for uploaders, no change for the game).** User rulings 2026-11-04 (plan
    `docs/plans/media-rights-and-public.md` Wave R). Both uploads (`POST /v1/admin/media`, `POST .../{mediaId}/versions`)
    require `X-Rights-Statement: v1_own | v1_authorised` (the photographer's rights statement v1; sending it is their
    consent): missing or other is 400, and a replay of a key with a different statement is 422 `idempotency_key_reused`.
    `POST .../versions` is owner only: an admin who is not the owner gets 403 `forbidden`. New
    `PUT /v1/admin/media/{mediaId}/rights` (owner only) gives a v1 statement to a draft that has none or an imported one
    and was never published, else 409 `rights_already_stated` (new error code). Publishing needs a v1 statement (422
    `content_invalid`). `PATCH /v1/admin/media/{mediaId}` takes `licence` and/or `description` (1-2000 characters,
    newlines allowed, null clears; staff only, a new file version copies it forward). Staff `MediaVersion` gains
    `description` and `rights` (`statedBy` for admins only). `ImageRef` and both read routes are unchanged.

    **Changelog 0.18.0 (website; additive, no change for the game).** New `GET /v1/public/media?ids=` (user ruling
    2026-11-04): the guest twin of `GET /v1/media` for the public website. No token (an Authorization header is ignored),
    no client-version gate, the same strict `ids` query and the same `{ images: ImageRef[] }` answer: published versions
    only, 24 h signed links, no owner or principal. Rate limit: the per-IP public tier (`RATE_LIMIT_PUBLIC_PER_MIN`). The
    website's server calls it, so all guests share its budget: send up to 50 ids per call, cache each ImageRef and
    refresh it ahead of `expiresAt`, and keep serving cached refs on 429.

    **Changelog 0.17.0 (staff-only, no change for the game).** Fix: `PATCH /v1/admin/media/{mediaId}` now refuses a
    licence edit that would change `creditRequired` unless the caller is an admin (403 `forbidden`, nothing written;
    sending the stored value back stays a no-op), as the licence description always said. New filter
    `GET /v1/admin/media?pending=true`: published items whose draft is ahead of the published version (a licence edit or
    a new file waiting for an admin). It combines only with `state=published` (any other `state` is 400), and a cursor is
    bound to the filter it was made under.

    **Changelog 0.16.0 (media plan T5-T7, Backend ADR-0001).** All media routes are now built. For the game and the website:
    `GET /v1/media?ids=` (any signed-in caller, at most 50 ids, `X-Client: web` accepted) returns an `ImageRef` per
    **published** image in request order; unpublished, withdrawn and unknown ids are absent, not 404. Each link is a
    Bunny CDN URL signed for 24 h (`expiresAt` from the database clock); without CDN settings (local runs) `url` is null
    with reason `cdn_not_configured`. Staff: `GET /v1/admin/media` (newest first, opaque cursor, photographers see only
    their own) and `GET /v1/admin/media/{mediaId}` (versions and a signed preview in any state);
    `PUT /v1/admin/content/{module}/items/{id}/media` (admin) links or unlinks an image on a content item (a staff edit:
    version bump, audit); `ContentItem.mediaId` and a trailing export column "Media Id" are added (import ignores it).

    **Changelog 0.15.0 (media plan T4 and role plan R-d; staff-only, no change for the game).** Media: built (were
    `x-planned`) `POST /v1/admin/media/{mediaId}/versions`, `PATCH /v1/admin/media/{mediaId}` (licence edit; never touches
    the live version: an edit of a version that was ever published makes a new version with the same file),
    `POST .../publish` and `.../withdraw` (admin). Roles (additive): new state `blocked` (photographer only);
    `POST /v1/admin/accounts/{principal}/roles/photographer/block` and `.../unblock`; `PUT .../roles/admin/email`; the
    admin grant takes an optional typed `email`; admin views gain `grantEmail`, `email` and `emailSource`
    (`verified_at_request` or `typed`; a typed email is unverified and display-only). A blocked account's photographer
    request is 403. An active admin cannot be blocked, and admin cannot be granted to a blocked account (409).

    **Changelog 0.14.0 (media plan T3, Backend ADR-0001; staff-only, no change for the game).** `POST /v1/admin/media` is built
    (it was `x-planned`): a photographer or admin uploads one JPEG or PNG (raw body, at most 5 MB) with a required
    `Idempotency-Key`; the server checks the image, stores it under its hash and creates an `unverified` item with version 1.
    The error code `media_invalid` is now served. No response carries a storage path or URL.

    **Changelog 0.13.0 (plan R-b, Backend ADR-0002; no change for the game's own calls except one extra database write).** Role
    registration and admin decisions are built. `PUT /v1/me` now also issues the informational `player` role on every call (an
    existing player gets it on the next sign-in; a revoked one is never reactivated; nothing requires it yet). New routes:
    `GET /v1/me/roles` (the caller's own rows), `POST /v1/me/roles/photographer` (ask for the role: needs a verified email,
    creates no player row; 201 when recorded, 200 and no change when already pending or active), and for admins
    `GET /v1/admin/role-requests` (a queue, oldest first, with a cursor) and `POST /v1/admin/accounts/{principal}/roles/...`
    `photographer/approve`, `photographer/reject`, `{photographer|admin}/revoke` and `admin/grant`. Decisions are fenced by the
    row's `revision`: a stale one is 409 `version_conflict` naming the current state and revision, as is any move the state
    machine does not allow and the revoke of the last active admin. Every change is audited. No new error code. A photographer request stores the
    token's verified email (`requestEmail`, shown to admins only, never used for authorisation); `DELETE /v1/me` clears it.

    **Changelog 0.12.0 (plan R-a, Backend ADR-0002, staff-only, no change for the game's own calls).** Privilege now comes only
    from ACTIVE rows of the `account_roles` table for the verified principal, read on every request (a revoke applies to the
    next call). `STAFF_EMAILS` no longer grants anything, and the 403 on every `/v1/admin` route now means "no active admin role
    (or the email is not verified)" rather than "not on the allowlist"; its message changed accordingly, the `forbidden` code did
    not. `GET /v1/admin/me` gains the required `roles` (the caller's active roles, in the order player, photographer, admin);
    `staff` stays and is always true. The upload routes (`.../imports`, `.../field-awards/imports`, `.../trip-coverage`) now
    also count against the per-principal rate limit before the body is read, so a refused caller is 429 `rate_limited` at the
    limit. There is no route to grant a role yet: the first admin comes from the coming operator command `roles:grant`.

    **Changelog 0.11.0 (slice T6, design 8, staff-only, no change for the game's own calls).** Five staff routes edit and publish
    the three documents: `GET /v1/admin/content/documents`, `GET` and `PATCH /v1/admin/content/documents/{name}/draft`,
    `POST .../draft/discard` and `POST .../publish`. A draft is a mutable overlay on the version in force with its own revision
    (`draftVersion`, the version check: stale = 409); a publish writes the next immutable `content_documents` version and one
    `content_publish` audit row, and only then do players see it (manifest `version` and document entry, `catalogVersion` on later
    completions, the Logbook `ETag`; no player row is written). New error codes `version_conflict` (409), `nothing_to_publish`
    (409) and `content_invalid` (422). Publishing `clipper-cards` rebuilds the Cards from the approved Military content as it is
    then, so a version sealed from a small set catches up. Consumers of Cards still need a fallback for a Card key that is not
    in the document they hold, and should verify each document's `sha256` against the manifest. Remote Config and the Field
    Awards sheet re-import are not part of this.

    **Changelog 0.10.0 (slice T5, design 6).** `GET /v1/me/logbook` is built (it was `x-planned`), for any signed-in player
    who has called `PUT /v1/me`: recent Trips, the daily log, lifetime totals, the Field Award counters, every Clipper Card and
    all 28 Field Awards, from one consistent snapshot, with no write and no lock. It carries a strong `ETag` and answers
    `If-None-Match` with 304 (`Cache-Control: private, no-cache`, another exception to `/v1` `no-store`). `Logbook.version`
    is a new counter, `logbookVersion`, **not** `Progress.version` (a completion that pays no hint and resets no streak
    changes the Logbook and not Progress); it is also folded, with the Field Award and aircraft-tag versions in force, into
    the ETag, so a catalog publish changes the tag with no player write. Field Award `earned` is the stored fact, never
    `current >= target`. No new error code, and no change to any other route, to Progress or to the UGS copy.

    **Changelog 0.9.0 (slice T4, design 7).** Two routes are built, both for any signed-in player and both used by the app:
    `GET /v1/content/manifest` and `GET /v1/content/documents/{name}/{version}` (they were `x-planned`). The manifest keeps
    Unity's `ManifestWire` / `ModuleWire` fields and adds `documents[]`; all eight modules are `enabled: true` and
    `contentVersion` / `assetBundleUrl` are null. The manifest `version` is a stable hash (same on every instance and
    after a restart) and its `ETag`; `If-None-Match` gives 304. Documents are immutable: the bytes of `(name, version)`
    never change, they are the canonical JSON of the document (keys sorted at every depth, no whitespace, UTF-8, integers
    only) and hash to the `sha256` the manifest lists. The only exceptions to `/v1` `no-store` are these two routes' 200 and
    304 answers (`no-cache` and `private, max-age=31536000, immutable`); their errors stay `no-store`. No new error code.
    Version 1 of the Field Award catalog and the aircraft tags exists from the first start; `clipper-cards` v1 appears once the
    server holds Military content. Completing a Trip now reads the catalog and tags from the highest valid document versions
    (`catalogVersion` is the Field Award document's version). No change to any other route.

    **Changelog 0.8.0 (slice B5, staff-only, no change for the game).** New route
    `POST /v1/admin/content/{module}/trip-coverage` (how many Flights a Trip would hold at each rank for the
    stored approved content, computed by the server's Trip dealer) and new error code `unknown_item_ids`.

    **Changelog 0.7.0 (2026-11-02, user rulings).** (1) The game orders copies by `(version, evaluatedAt)`:
    `version` orders stored changes, `evaluatedAt` orders time-derived changes such as lazy Trip expiry at one
    version (D-1, amended). (2) The UGS copy is `schemaVersion` 3 and `evaluatedAt` is required (0.6.0 had it
    optional; no copy of an earlier schema was ever written). (3) `evaluatedAt` is the DATABASE clock at the instant
    the view was built, and that same instant judges lazy Trip expiry; process clocks never stamp it. (4) U14 is
    narrowed: a key replays only when module, localDate, utcOffsetMinutes and contentVersion all match what it
    opened; otherwise 422 `idempotency_key_reused`. Persist the entire original request with its key and replay it
    unchanged. Never substitute `updatedAt` for an evaluation time.

    **API review fixes (2026-10-29, version 0.6.0).** Progress and UGS snapshots gained `evaluatedAt`; reusing a Trip
    key with any changed request field became 422 `idempotency_key_reused` (0.5.0 compared only `module`).

    **Trip completion (slice T3, built 2026-10-29, version 0.5.0) adds a route and changes one behaviour.** `POST /v1/trips/{tripId}/complete`
    (after the 10th banked Round) returns the segment's outcome, the Field Awards it earned, the Clipper Cards it
    collected and the Trip hint grant; replaying it returns the same lists and pays nothing twice. New error code
    `trip_incomplete`. **Behaviour change Unity must handle:** `POST /v1/trips` no longer returns 409 `trip_full` (0.4.0 did).
    A full open segment is completed first (its Cards, counters, awards and hint are recorded, `complete` then replays
    them), and the new segment opens. `POST /v1/rounds` still answers 409 `trip_full` for a full segment, and a full
    segment still cannot be abandoned.

    **Flight Segments (slice T2, built 2026-10-29) are a BREAKING CHANGE to the Round routes.** `POST /v1/trips` opens a
    Flight Segment (Unity Trip) and `POST /v1/trips/{tripId}/abandon` closes it; `POST /v1/rounds` now takes
    `{ tripId }` instead of `{ module }` (module and rank come from the segment), and `POST /v1/rounds/{roundId}/result`
    requires the Flight facts `aircraftKey`, `answerMs` and `attempts`. An app built against 0.3.0 gets 400
    `invalid_request` from both Round routes until it adopts this. Unity changes: open a segment per Trip with a fresh
    `Idempotency-Key`, issue each Round with its `tripId`, send the Flight facts, call `complete` after the 10th Round.

    **Planned contract.** The purchase contract (0.20.0, `docs/plans/purchases.md`) is built except the two store webhooks, which are still planned
    and not served yet (`POST /v1/purchases`, `GET /v1/me/entitlements` and the store catalog routes are served). The media contract (plan T0, `docs/plans/media-pipeline.md`, ADR-0001, ADR-0002) was recorded as
    planned and is now fully built: upload (0.14.0); versions, licence edit, publish and withdraw (0.15.0); list, get, the
    content link and `GET /v1/media` (0.16.0). Before it, the Logbook was the last planned operation (0.10.0). An operation marked `x-planned: true` is the agreed next contract, recorded here so Unity can build
    against it. It is NOT served yet: the parity test asserts each one answers 404 `not_found` today. Planned
    changes to built operations are described under `x-planned-change` and planned fields under
    `x-planned-properties`; the built shapes beside them are what the server does now. Error codes only planned
    operations use are listed in `Error` under `x-planned-enum`, not in `enum`. Design, open questions and the build
    order: `docs/design/trips-awards-logbook.md`.

    Vocabulary: a backend **Round** is one Unity **Flight**; a backend **Flight Segment** is one Unity **Trip**
    (ten Flights). Type names use the backend words; the wire keeps the ruled names `/v1/trips`, `tripId` and
    `trip` (contract round 1, 2026-10-29).

    - Every route except `/v1/health`, `/v1/health/ready` and the guest media read `GET /v1/public/media` needs
      `Authorization: Bearer <Firebase ID token>`.
      The manifest and the documents need a signed-in player like every other route (any player, no staff rule).
    - Bodies are JSON only, at most 16 KB (exceptions for staff: the xlsx import, 5 MB, and Trip coverage, 160 KB). Unknown fields are rejected (400 `invalid_request`).
    - Every response carries `X-Request-Id`. `/v1` responses other than `/v1/health` are `Cache-Control: no-store`.
    - Errors share one body, `Error`. Switch on `error.code`, never on `message`.
    - A path or method not listed here is 404 `not_found`.
    - Any route can return 500 `internal_error` for an unexpected server fault.
    - Rate limit: one sliding 60 s window per player (authenticated) or per IP (public routes), shared across routes.
      Both health routes are exempt. Over the limit is 429 `rate_limited` with `Retry-After` (seconds until a
      request would be accepted); there is no extra lockout, so requests succeed again as soon as room frees up.
    - Client version gate: when the server sets a minimum build, a missing, malformed or too-low
      `X-Client-Version` is 426 `client_update_required` (checked before the token). Health routes, the guest media read and `DELETE /v1/me` (account deletion
      must work for outdated clients) are exempt. The website's server calls with `X-Client: web` (exactly `web`, any case)
      instead of a build number and is exempt. That is a compatibility label, not a credential: the token is still verified, and the app
      must never send it.
    - Retry guidance: 503 and 429 carry `Retry-After` (seconds). Never retry any other 4xx unchanged.
    - Admin routes (`/v1/admin/*`, tag `admin`) need the `admin` role and are called by the website admin, not the
      app: the verified principal must hold an ACTIVE `admin` row in the backend's `account_roles` table and the token's
      email must be verified (403 `forbidden` otherwise; Backend ADR-0002). Roles are read on every request, so a revoke
      takes effect on the next call. No email list, header, query or body field grants a role. They are
      exempt from the client version gate. The staff import takes the raw `.xlsx` as the body (at most 5 MB),
      not JSON.
servers:
  - url: http://127.0.0.1:3000
    description: Local only. Hosting is not chosen yet.
security:
  - firebaseBearer: []
tags:
  - name: health
  - name: player
  - name: rounds
  - name: shop
  - name: store
    description: The store product catalog (player listing, staff editing); the store notification webhooks are still planned (wave P4).
  - name: purchases
    description: Verified store purchases and the player's entitlements (purchases plan).
  - name: admin
  - name: roles
    description: Role registration and admin decisions (Backend ADR-0002).
  - name: trips
    description: Flight Segments (Unity Trips) of ten Rounds (Unity Flights). Open, complete and abandon are built.
  - name: content
    description: The content manifest and the versioned data documents it points to.
  - name: media
    description: Images with their licence, rights statement and description; upload, edit and publish for staff; batch reads of published images (signed-in and guest).

paths:
  /v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness
      description: Public. Does not touch the database. Not rate limited, not version gated.
      security: []
      responses:
        "200":
          description: The process is up.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Liveness" }

  /v1/health/ready:
    get:
      tags: [health]
      operationId: getReady
      summary: Readiness
      description: Public. The database must answer within 2 s. Not version gated and not rate limited (the answer is cached for about 1 s). 503 during shutdown, so load balancers stop routing.
      security: []
      responses:
        "200":
          description: Ready.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/me:
    put:
      tags: [player]
      operationId: signIn
      summary: Sign-in handshake
      description: |
        Call after every Firebase sign-in. Creates the player on first call (201), otherwise 200.
        Idempotent. No request body. Every call also makes sure the account holds the informational `player` role (inserted
        once, audited once; a revoked row is left as it is).
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
      responses:
        "200":
          description: Existing player.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressEnvelope" }
        "201":
          description: Player created at zero, with the 5 starter hints.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [player]
      operationId: deleteAccount
      summary: Delete this player's backend data
      description: |
        Account deletion. Erases backend data only; the app deletes the Firebase account itself.
        Idempotent: 204 whether or not a player existed. A later `PUT /v1/me` with a still-valid token starts
        a fresh player at zero. No request body. Exempt from the client version gate (never 426). Role rows (`player`,
        `photographer`, `admin`) and their audit rows are not game data and stay; only the emails kept on role rows are cleared (the requester
        email on a photographer request, and the typed email of an admin row).
      responses:
        "204":
          description: Deleted (or nothing to delete).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/me/roles:
    get:
      tags: [roles]
      operationId: getMyRoles
      summary: My role rows
      description: |
        Any signed-in caller. Every role row of the caller in any state (`player`, `photographer`, `admin`, in that order). A
        `pending`, `rejected`, `revoked` or `blocked` row grants nothing. No query parameters (any is 400).
      responses:
        "200":
          description: The caller's rows (empty before the first `PUT /v1/me`).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnRolesEnvelope" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/me/roles/photographer:
    post:
      tags: [roles]
      operationId: requestPhotographerRole
      summary: Ask for the photographer role
      description: |
        Any signed-in caller whose token has a verified email (otherwise 403). The role is fixed by the path: a body or query naming
        a role, state or anything else is 400. No body. Creates no player row. A missing, `rejected` or `revoked` row becomes
        `pending` (a rejected or revoked one at `revision` + 1); a `pending` or `active` row is never touched (200,
        `changed: false`). An admin approves or rejects it. Audit action `role_request`, only when a row changed. An account
        whose `photographer` row is `blocked` gets 403 `forbidden` and nothing is written (a block is per principal, never
        matched by email).
      responses:
        "200":
          description: Already `pending` or `active`; nothing changed.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotographerRequestResult" }
        "201":
          description: "The request was recorded (`state: pending`)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotographerRequestResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/me/progress:
    get:
      tags: [player]
      operationId: getProgress
      summary: Current progress
      description: |
        `perfectStreak` is the Perfect Streak of the open Flight Segment, 0 when none is open or the open one has
        expired (D-3, built in T2). The full Field Award board, Clipper Cards and counters will be served by
        `GET /v1/me/logbook`, not here (contract round 2).
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
      responses:
        "200":
          description: Progress.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PlayerNotFound" }
        "426": { $ref: "#/components/responses/ClientUpdateRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/me/active-rank:
    put:
      tags: [player]
      operationId: setActiveRank
      summary: Set Active Rank
      description: |
        Dial Active Rank down from Certified Rank (Pleasure Cruise) or back up to it. Above Certified is 403.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetActiveRankRequest" }
      responses:
        "200":
          description: Updated progress.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
