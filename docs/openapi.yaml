        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/accounts/{principal}/roles/photographer/approve:
    post:
      tags: [roles, admin]
      operationId: approvePhotographer
      summary: Approve a photographer request
      description: |
        `pending` to `active`. Audit action `role_approve`.
        Admin only. The acting admin is re-checked under the role lock, so an admin revoked a moment ago gets 403 and nothing is
        written. Fenced by `revision` (the value the caller read): a different `revision`, or a state the move does not start from,
        is 409 `version_conflict` naming the current state and revision. Every change bumps `revision` and writes one audit row
        (`detail`: role, from and to state and revision, note). Answers 200, not 201. Exempt from the client version gate.
      parameters:
        - $ref: "#/components/parameters/AccountPrincipal"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleDecisionRequest" }
      responses:
        "200":
          description: The row as it is now.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRoleEnvelope" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/RoleRowNotFound" }
        "409": { $ref: "#/components/responses/RoleVersionConflict" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

