        "404": { $ref: "#/components/responses/RoleRowNotFound" }
        "409": { $ref: "#/components/responses/RoleVersionConflict" }
        "413": { $ref: "#/components/responses/BodyRejected" }
        "415": { $ref: "#/components/responses/BodyRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/accounts/{principal}/roles/admin/grant:
    post:
      tags: [roles, admin]
      operationId: grantAdmin
      summary: Grant the admin role
      description: |
        A missing row becomes `active`; a `revoked` row becomes `active` again (the same row, `revision` + 1). An `active`,
        `pending` or `rejected` admin row is 409 `version_conflict`, and so is an account whose `photographer` row is `blocked`
        (unblock it first). An optional `email` is TYPED by the granting admin: trimmed, lowercased, one `@`, 3-320 characters
        (otherwise 400); it is unverified, display only and never used for authorisation. A re-grant replaces the stored email
        when one is given and keeps it otherwise. No email is written to the audit row. Admin is never self-registered; `photographer` is never
        granted this way. Audit action `role_grant`. The body has no `revision` (there is nothing to fence on a missing row).
        Admin only. The acting admin is re-checked under the role lock, so an admin revoked a moment ago gets 403 and nothing is
        written. A 409 `version_conflict` is either an admin row that exists and is not revoked (naming its current state and revision), or an account whose photographer row is blocked.
        Every change bumps `revision` and writes one audit row (`detail`: role, from and to state and revision, note).
        Answers 200, not 201. Exempt from the client version gate.
      parameters:
        - $ref: "#/components/parameters/AccountPrincipal"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminGrantRequest" }
      responses:
        "200":
          description: The row as it is now.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRoleEnvelope" }
